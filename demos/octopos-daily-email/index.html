const stories={"grocery":{"title":"Tuesday close · register shortage","situation":"Hilltop Fresh Market ends a busy Tuesday with Register 2 short $6.35. Shoppers used cards, EBT, cash and customer accounts.","response":"The email shows $9,482.35 net sales, the payment mix and the cash discrepancy, with a direct Review link."},"liquor":{"title":"After-work rush · small overage","situation":"Corner Spirits & Wine has its busiest hour from 6–7 PM. Register 1 ends $2 over; the shop does not offer customer credit accounts.","response":"Shows the evening peak and overage. The credit-account section is absent."},"history":{"title":"Older report · incomplete records","situation":"An owner reviews September 22 results after a data migration. The old records combine $120 of gift-card and store-credit payments, and drawer history is unavailable.","response":"Shows the recorded totals and flags missing history; does not invent the tender split, drawer balance or historical comparisons."},"clear":{"title":"All registers match at close","situation":"The closing manager counts all three Hilltop registers. Each one matches its expected cash balance.","response":"Replaces the shortage warning with a balanced state, keeping sales and payment figures."},"credit":{"title":"Eight purchases on customer tabs","situation":"A grocer lets eight regulars buy $860 on account. Nobody makes an immediate payment.","response":"Reports $860 net sales but $0 collected. The donut and the historical sales chart are omitted."},"refund":{"title":"A return on a no-sales day","situation":"The store has no new checkouts but refunds an $80 item plus $8 tax to a card.","response":"Shows negative $80 net sales and $88 in refunds, with no basket average or payment donut."},"missing":{"title":"A cash count was never submitted","situation":"Register 2 closes without a cash count while the other registers were counted.","response":"Displays a count-pending state rather than treating missing information as balanced."},"mismatch":{"title":"A card refund is under-recorded","situation":"A $4.19 difference in how a card refund is recorded makes sales and payment totals disagree.","response":"Highlights the reconciliation discrepancy and directs the merchant to the Sales Summary."},"offset":{"title":"Two registers cancel out on paper","situation":"Register 1 is $10 over and Register 2 is $10 short. The overall cash total is exactly on target.","response":"Warns that two registers have differences even though the net variance is $0."}}; function renderScenarioContext(){const item=stories[$('scenario').value];$('scenarioExampleTitle').textContent=item.title;$('scenarioExampleText').textContent=item.situation;$('scenarioEmailChange').textContent=item.response;}

function spark(now,prior,tone){
if(!Array.isArray(now)||now.length!==7)return '';
const w=160,h=54,k=3,cv=document.createElement('canvas');cv.width=w*k;cv.height=h*k;
const ctx=cv.getContext('2d');ctx.scale(k,k);
const vals=now.concat(Array.isArray(prior)?prior:[]);let lo=Math.min(...vals),hi=Math.max(...vals),spread=Math.max(hi-lo,hi*.12,1);lo-=spread*.15;hi+=spread*.15;
const X=i=>5+i*(w-10)/6,Y=v=>5+(h-12)*(1-(v-lo)/(hi-lo));

function render(){renderScenarioContext();const d=current(),b=brands[$('brand').value],netPay=+(d.received-d.refunded).toFixed(2),change=pct(d.net,d.prev),week=pct(d.weekly,d.weeklyPrev);$('email').style.setProperty('--tone',b[1]);$('sender').textContent=b[0];$('subject').textContent=d.store+' · '+money(d.net)+' net sales · '+(d.date.includes('September')?'Sep 22':'Oct 27');$('preheader').textContent=d.customers+' sales · '+money(netPay)+' payments after refunds';

let weekBlock=d.weekly!=null&&Array.isArray(d.weeks)?`<div class="week"><div class="week-copy"><div class="week-label">Last 7 days</div><div class="week-numbers"><b>${money(d.weekly)}</b>${delta(week)}</div><div class="week-period">vs same weekdays last year</div><button class="link" onclick="openReport('trends')">View trends ↗</button></div><div class="week-plot"><img width="160" height="54" src="${spark(d.weeks,d.priorWeek,b[1])}" alt="Seven-day net sales trend compared with last year, ${money(d.weekly)} total."/><div class="week-key"><span><i></i>This period</span><span class="last"><i></i>Last year</span></div></div></div>`:'';
let chart=(netPay>0)?'<div class="payment-mix"><div class="ring"></div><div class="legend"><div><span>Card</span><strong>47%</strong></div><div><span>EBT</span><strong>13%</strong></div><div><span>Cash</span><strong>36%</strong></div><div><span>Other</span><strong>4%</strong></div></div></div>':'<div class="muted" style="font-size:11px">Mix unavailable</div>';
$('email').innerHTML='<div class="banner"><div class="banner-top"><span class="word">'+b[0].toLowerCase()+'</span><span class="caps">DAILY SALES</span></div><div class="store-line"><div><div class="store">'+esc(d.store)+'</div><div class="date">'+esc(d.date)+'</div></div><div class="cal"><span>'+ (d.date.includes('September')?'SEP':'OCT') +'</span><strong>'+ (d.date.includes('September')?'22':'27') +'</strong></div></div></div><div class="body"><div class="hero"><div class="eyebrow">Net sales</div><div class="hero-value">'+money(d.net)+'</div><div class="comparer">'+delta(change)+(change!=null?'vs last Tuesday · '+money(d.prev):'Comparison unavailable')+'</div></div><div class="kpis">'+kpis+'</div><section class="section"><div class="section-title">Payments <button class="link" onclick="openReport(\'payments\')">View breakdown ↗</button></div><div class="panel"><div><div class="payment-label">Payments after refunds</div><div class="payment-value">'+money(netPay)+'</div><div class="payment-equation">Received '+money(d.received)+' · '+d.refundCount+' refunds '+money(d.refunded)+'</div></div>'+chart+'</div></section><section class="section"><div class="section-title">Daily checks</div><div class="checks">'+checks+'</div></section>'+weekBlock+'<button class="button" onclick="openReport(\'overview\')">Open daily sales report →</button></div><div class="footer"><span><b>'+b[0]+'</b><br>'+esc(d.store)+' · Store time</span><button onclick="openReport(\'overview\')">View reports ↗</button></div>';
}
function drawReport(){const d=current(),netPay=d.received-d.refunded,b=brands[$('brand').value];$('reportTitle').textContent={overview:'Sales summary',payments:'Payments',invoices:'Credit accounts',drawer:'Cash drawer',trends:'Sales trends'}[activeTab];$('filters').innerHTML='<span class="pill">Location · '+esc(d.store)+'</span><span class="pill">Business date · '+esc(d.date)+'</span>';$('tabs').innerHTML=['overview','payments','drawer','invoices','trends'].map(x=>'<button class="'+(x===activeTab?'on':'')+'" onclick="openReport(\''+x+'\')">'+({overview:'Overview',payments:'Payments',drawer:'Cash drawer',invoices:'Credit accounts',trends:'Trends'}[x])+'</button>').join('');
let html='';
if(activeTab==='overview')html='<div class="report-grid"><div class="report-stat"><span>Net sales</span><strong>'+money(d.net)+'</strong></div><div class="report-stat"><span>Payments</span><strong>'+money(netPay)+'</strong></div><div class="report-stat"><span>Customers</span><strong>'+d.customers+'</strong></div></div><div class="report-card" style="margin-top:14px"><h3>Report reconciliation</h3><div class="report-line"><span>Net sales</span><strong>'+money(d.net)+'</strong></div><div class="report-line"><span>Payments after refunds</span><strong>'+money(netPay)+'</strong></div><p class="help">Detailed reconciliation and payment classifications belong in the actual back office.</p></div>';
if(activeTab==='payments')html='<div class="report-card"><h3>Payments by method</h3><div class="tablewrap"><table><thead><tr><th>Method</th><th>Received</th><th>Refunds</th><th>Net</th></tr></thead><tbody>'+d.paymentRows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+money(r[1])+'</td><td>'+r[3]+' · '+money(r[2])+'</td><td><strong>'+money(r[1]-r[2])+'</strong></td></tr>').join('')+'</tbody></table></div></div><p class="help">Illustrative data. Actual link should open the payment report filtered to this store and date.</p>';
if(activeTab==='drawer')html='<div class="report-card"><h3>Register status</h3><div class="report-line"><span>Cash drawer</span><strong>'+esc(d.notes)+'</strong></div><div class="report-line"><span>Net variance</span><strong>'+money(d.drawer)+'</strong></div></div>';
if(activeTab==='invoices')html=d.credit?'<div class="report-card"><h3>Customer accounts</h3><div class="report-line"><span>Charged today</span><strong>'+money(d.charged)+'</strong></div><div class="report-line"><span>Collected on earlier invoices</span><strong>'+money(d.earlier)+'</strong></div><div class="report-line"><span>Still owed</span><strong>'+money(d.owed)+'</strong></div></div>':'<div class="report-card">No credit account activity</div>';
if(activeTab==='trends')html='<div class="report-card"><h3>Sales trends</h3><div class="report-line"><span>Last 7 days</span><strong>'+money(d.weekly)+'</strong></div><div class="report-line"><span>Same weekdays last year</span><strong>'+money(d.weeklyPrev)+'</strong></div></div>';
$('reportContent').innerHTML=html;}
$('scenario').addEventListener('change',render);$('brand').addEventListener('change',render);$('desktop').onclick=()=>{$('preview').classList.remove('mobile');$('desktop').classList.add('on');$('mobile').classList.remove('on')};$('mobile').onclick=()=>{$('preview').classList.add('mobile');$('mobile').classList.add('on');$('desktop').classList.remove('on')};$('close').onclick=()=>$('backdrop').classList.remove('show');$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop'))$('backdrop').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('backdrop').classList.remove('show')});render();
</script></body></html>
