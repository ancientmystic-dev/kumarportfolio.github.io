/* Inline bulk controls: one first-class list row, no edit mode. */
.inlineBulkRow{border:1px solid #dbe4f9;border-radius:10px;background:#f6f9ff;margin:8px 0 16px;padding:14px 14px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.inlineBulkIdentity{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.inlineBulkIcon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#e7eeff;color:var(--blue);flex:none}
.inlineBulkText strong{display:block;font-size:12px;font-weight:750;color:#283c68}
.inlineBulkText small{display:block;font-size:11px;margin-top:5px;color:#7b86a4;line-height:1.35}
.inlineBulkRight{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.inlineBulkCaption{font-size:10px;letter-spacing:.25px;font-weight:650;color:#68789a;white-space:nowrap}
.inlineBulkState{font-size:10px;font-weight:700;border:1px solid #dce4f4;background:#fff;color:#66769b;border-radius:30px;padding:5px 8px;white-space:nowrap}
.inlineBulkState.custom{color:#975f12;border-color:#f1dec1;background:#fff8ec}
.inlineSegments{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid #cbd7f0;background:white;box-shadow:0 1px 3px #223c6608}
.inlineSegments button{border:0;border-right:1px solid #dce4f3;background:#fff;color:#61708e;font-size:11px;font-weight:700;padding:8px 10px;min-height:32px;white-space:nowrap}
.inlineSegments button:last-child{border-right:0}
.inlineSegments button:hover{background:#ebf2ff;color:var(--blue)}
.inlineSegments button.active{background:var(--blue);color:#fff}
.inlineSegments button:focus-visible{position:relative;z-index:2}
.inlineBulkRow.forActions{margin:12px 0 7px;background:#fcfcff;border-color:#e5e6f1}
.inlineBulkRow.forActions .inlineBulkIcon{background:#f2f1f9;color:#78718d}
.inlineBulkRow.forReports{margin:12px 0 8px}
.reportCard{transition:background .16s}
.reportCard .check:indeterminate{background:#2b5dd9;border-color:#2b5dd9}
.reportCard .check:indeterminate:after{content:"";width:9px;height:2px;background:white}
.inlineReportHint{font-size:11px;color:var(--muted);margin:4px 2px 11px}
.scopeNote{margin-top:13px}
@media(max-width:900px){.inlineBulkRight{width:100%;justify-content:flex-start}.inlineBulkRow{align-items:flex-start}.inlineBulkCaption{display:none}}
@media(max-width:740px){.inlineBulkRow{padding:12px 10px;gap:9px}.inlineBulkRight{gap:7px}.inlineSegments button{padding:9px 9px}.inlineBulkState{font-size:10px}}

.actionSubhead{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#8d8aa0;padding:16px 10px 8px;background:#fbfcff;border-top:1px solid #eef0f5}
.coverageStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.coverageStats>div{padding:13px;background:#f4f7fe;border:1px solid #e5edfd;border-radius:9px;text-align:center}.coverageStats strong{display:block;font-size:20px;color:#2358d7}.coverageStats span{font-size:10px;color:#7a7891;display:block;margin-top:4px}
.coverageRows{max-height:55vh;overflow:auto;border:1px solid #e8e7ee;border-radius:10px}.coverageApp{position:sticky;top:0;background:#eef3ff;color:#2454ba;padding:12px;margin:0;border-bottom:1px solid #e3e7f1;z-index:1}.coverageSection{padding:9px 12px;background:#fafafe;color:#7f7b91;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.6px}.coverageItem{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #f0eff5;padding:9px 12px;font-size:11px}.coverageItem b{font-weight:600;flex:1}.coverageItem span{color:#7c7690;text-align:right;flex:1}
@media(max-width:680px){.coverageStats{grid-template-columns:repeat(2,1fr)}.coverageItem{align-items:flex-start;flex-direction:column;gap:4px}.coverageItem span{text-align:left}}

/* Register operations: compact grouped accordion, with controls embedded in each header */
.registerGroups{display:grid;gap:9px;padding-top:5px}
.registerGroup{border:1px solid #e5e5ef;border-radius:10px;background:white;overflow:hidden}
.registerGroupHead{display:flex;align-items:center;gap:4px;min-height:65px;padding-right:11px}
.registerGroupToggle{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:12px 8px 12px 12px;border:0;background:transparent;text-align:left;color:var(--ink)}
.registerGroupToggle:hover .registerGroupTitle{color:var(--blue)}
.registerChevron{width:25px;height:25px;flex:none;display:grid;place-items:center;border-radius:6px;color:#817b98;background:#f5f5fa;transition:transform .15s}
.registerGroup.open .registerChevron{transform:rotate(90deg);background:#eaf0ff;color:var(--blue)}
.registerGroupCopy{flex:1;min-width:0}
.registerGroupTitle{font-size:12px;font-weight:730;line-height:1.35;display:block}
.registerGroupDescription{font-size:11px;color:#8e8aa2;margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.registerGroupControls{flex:none;display:flex;align-items:center;gap:11px}
.registerGroupCount{font-size:11px;font-weight:670;color:#79758d;white-space:nowrap;font-variant-numeric:tabular-nums}
.registerGroupCustom{color:#926015;background:#fff8ea;border:1px solid #eedcbd;padding:3px 7px;border-radius:30px;font-size:10px;font-weight:730}
.registerGroupBulk{padding:7px 4px;border:0;background:none;color:var(--blue);font-size:11px;font-weight:730;white-space:nowrap}
.registerGroupBulk:hover{text-decoration:underline}
.registerGroupBody{border-top:1px solid var(--line)}
.registerActionLabel{cursor:pointer;display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px 11px 40px;border-bottom:1px solid #f0eff5;font-weight:560;font-size:12px}
.registerActionLabel:last-child{border-bottom:0}
.registerActionLabel:hover{background:#fafbff}
.registerActionLabel .check{flex:none}
@media(max-width:1000px){.registerGroupControls{gap:6px}.registerGroupToggle{gap:7px}.registerGroupHead{padding-right:5px}.registerGroupCustom{display:none}}
@media(max-width:530px){.registerGroupHead{flex-wrap:wrap;padding:0 9px 9px}.registerGroupToggle{flex-basis:100%;padding-bottom:5px}.registerGroupControls{width:100%;padding-left:36px;justify-content:space-between}.registerActionLabel{padding-left:25px}}


/* Reports-style inline permission groups: bulk selection in the header, details below */
.permissionGroupList{display:grid;gap:10px;padding-top:4px}
.permissionGroupCard{border:1px solid #e4e5ef;border-radius:10px;background:#fff;overflow:hidden;transition:border-color .18s,box-shadow .18s}
.permissionGroupCard:hover{border-color:#d9e1f5}
.permissionGroupCard.expanded{border-color:#cddbf7;box-shadow:0 3px 13px rgba(35,88,215,.045)}
.permissionGroupCard .reportCard{margin:0;border:none;border-radius:0;min-height:67px;padding:13px 14px;gap:13px}
.permissionGroupCard .reportCard:hover{background:#fbfcff}
.permissionGroupCard .reportCard:focus-within{background:#fbfcff}
.permissionGroupCard .reportInfo{min-width:0}
.permissionGroupCard .reportInfo strong{display:block;font-size:12px;font-weight:740;color:#34324e}
.permissionGroupCard .reportInfo small{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.permissionGroupCard .reportCount{font-weight:600;color:#77748d;font-variant-numeric:tabular-nums}
.permissionGroupCard .customLink{padding:7px 3px;min-width:64px;text-align:right}
.permissionGroupCard .customLink[aria-expanded="true"]{color:#4e62a0}
.permissionGroupCard .groupState{background:#fff8ec;border:1px solid #eedbb9;color:#996414;font-weight:700;font-size:10px;border-radius:20px;padding:4px 8px;flex:none}
.permissionGroupCard .inlineOptions{border-top:1px solid #e9eaf2;background:#fff;padding:4px 0}
.permissionGroupCard .inlineOption{display:flex;align-items:center;gap:13px;margin:0;min-height:44px;padding:11px 19px 11px 27px;border-bottom:1px solid #f0f0f5;color:#46435e;font-size:12px;font-weight:540;cursor:pointer}
.permissionGroupCard .inlineOption:last-child{border-bottom:0}
.permissionGroupCard .inlineOption:hover{background:#f8faff}
.permissionGroupCard .inlineOption .check{flex:none}
.permissionGroupCard .inlineOption:has(input:focus-visible){background:#f3f7ff}
.permissionGroupCard .inlineOption small{color:#918da3;font-size:11px;display:block;font-weight:400;margin-top:4px}
.permissionGroupHelp{font-size:11px;color:var(--muted);margin:5px 2px 10px}
.permissionGroupCard .check:indeterminate{background:#2b5dd9;border-color:#2b5dd9}
.permissionGroupCard .check:indeterminate:after{content:"";width:9px;height:2px;background:#fff}
@media(max-width:900px){.permissionGroupCard .reportCard{flex-wrap:wrap}.permissionGroupCard .reportInfo{flex-basis:calc(100% - 50px)}.permissionGroupCard .reportCount{margin-left:27px}.permissionGroupCard .customLink{margin-left:auto}}

function bulkSummary(kind,g){const rows=kind==='actions'?(g.actions||[]):(g.rows||[]);
 if(kind==='actions'){const n=rows.filter(a=>act(a[0])).length;return {total:rows.length,on:n,state:n===0?'none':n===rows.length?'allow':'mixed'};}
 const vals=rows.map(r=>perm(r[0]));const n=vals.filter(v=>v!=='none').length;const first=vals[0]||'none';let state=vals.every(x=>x===first)?first:'mixed';if(state==='mixed'&&rows.every(r=>perm(r[0])===(r[3]==='readonly'?'view':'manage')))state='manage';if(state==='mixed'&&rows.every(r=>perm(r[0])===(r[3]==='manageonly'?'none':'view')))state='view';return {total:vals.length,on:n,state};}
function bulkRow(g,kind='resources'){
 const actions=kind==='actions';const sum=bulkSummary(actions?'actions':'resources',g);
 const labels=actions?[['block','Deny all'],['allow','Allow all']]:[['none','No access'],['view','View'],['manage','Manage']];
 const select=actions?'setAllActions':'setAll';
 const status=sum.state==='mixed'?'Custom':actions?(sum.state==='allow'?'All allowed':'All denied'):(sum.state==='none'?'None':sum.state==='view'?'View only':'Full access');
 const description=actions?`${sum.on} of ${sum.total} allowed`:`${sum.on} of ${sum.total} have access`;
 return `<div class="inlineBulkRow ${actions?'forActions':''}" role="group" aria-label="Apply access to all ${escapeHTML(g.name)} ${actions?'special actions':'permissions'}"><div class="inlineBulkIdentity"><div class="inlineBulkIcon">${I(actions?'shield':'layers','sm')}</div><div class="inlineBulkText"><strong>${actions?(g.id==='register'?'All register actions':'All special actions'):'All '+g.name.toLowerCase()+' permissions'}</strong><small>${description} · Set every ${actions?'action':'permission'} below at once</small></div></div><div class="inlineBulkRight"><span class="inlineBulkState ${sum.state==='mixed'?'custom':''}">${status}</span><div class="inlineSegments" aria-label="Set access for all">${labels.map(([val,label])=>`<button type="button" ${!actions&&((val==='manage'&&(g.rows||[]).every(r=>r[3]==='readonly'))||(val==='view'&&(g.rows||[]).every(r=>r[3]==='manageonly')))?'disabled':''} class="${sum.state===val?'active':''}" aria-pressed="${sum.state===val}" aria-label="${label} for all ${g.name} ${actions?'actions':'permissions'}" onclick="proto.${select}('${g.id}',${actions?val==='allow':`'${val}'`})">${label}</button>`).join('')}</div></div></div>`;
}

const REGISTER_GROUP_ORDER=['Discounts & prices','Refunds & clearing orders','Cash drawer & till','Bypasses','Open tickets','Register settings','Other register actions'];
function toggleRegisterGroup(group){registerExpanded.has(group)?registerExpanded.delete(group):registerExpanded.add(group);render();}
function toggleReportInline(id){reportExpanded.has(id)?reportExpanded.delete(id):reportExpanded.add(id);render();}
function setRegisterGroup(group,allow){const g=GROUPS.find(g=>g.id==='register');for(const a of g.actions.filter(a=>a[3]===group))role.actions[a[0]]=allow;render();}
function registerGroupCard(name,g){
 const all=g.actions.filter(a=>a[3]===name);
 const on=all.filter(a=>act(a[0])).length;
 if(enabledOnly&&on===0)return '';
 const visible=enabledOnly?all.filter(a=>act(a[0])):all;
 const expanded=registerExpanded.has(name),full=on===all.length,mixed=on>0&&!full;
 const title=name==='Other register actions'?'Other':name;
 const groupIndex=REGISTER_GROUP_ORDER.indexOf(name);
 const preview=all.slice(0,3).map(a=>a[1]).join(' · ')+(all.length>3?'…':'');
 return `<section class="permissionGroupCard ${expanded?'expanded':''}" aria-label="${escapeHTML(title)} permissions">
   <div class="reportCard">
    <input type="checkbox" class="check" data-register="${groupIndex}" aria-label="Select all ${escapeHTML(title)} actions" ${full?'checked':''} onchange="proto.setRegisterGroup('${name}',this.checked)" />
    <div class="reportInfo"><strong>${escapeHTML(title)}</strong><small title="${escapeHTML(all.map(a=>a[1]).join(', '))}">${escapeHTML(preview)}</small></div>
    <span class="reportCount">${on}/${all.length} selected</span>
    <button class="customLink" type="button" aria-expanded="${expanded}" aria-controls="register-custom-${groupIndex}" onclick="proto.toggleRegisterGroup('${name}')">${expanded?'Done':'Customize'}</button>
   </div>
   ${expanded?`<div class="inlineOptions" id="register-custom-${groupIndex}">${visible.map(a=>`<label class="inlineOption"><input type="checkbox" class="check" aria-label="${escapeHTML(a[1])}" ${act(a[0])?'checked':''} onchange="proto.applyAction('${a[0]}',this.checked)"/><span>${escapeHTML(a[1])}</span></label>`).join('')}</div>`:''}
 </section>`;
}
function registerContent(g){
 const cards=REGISTER_GROUP_ORDER.map(name=>registerGroupCard(name,g)).filter(Boolean).join('');
 return `${bulkRow(g,'actions')}<div class="permissionGroupHelp">Select a group to allow all its actions, or choose Customize to select individual actions.</div><div class="permissionGroupList">${cards||empty('No enabled register actions','Turn off “Enabled only” to see all groups.')}</div>`;
}
function reportGroupCard(g){
 const n=g.reports.filter(r=>role.reports.includes(r)).length;
 const expanded=reportExpanded.has(g.id);
 const preview=g.reports.slice(0,3).join(' · ')+(g.reports.length>3?'…':'');
 return `<section class="permissionGroupCard ${expanded?'expanded':''}" aria-label="${escapeHTML(g.name)} reports">
  <div class="reportCard">
   <input type="checkbox" class="check" aria-label="Select all ${escapeHTML(g.name)} reports" ${n===g.reports.length?'checked':''} data-report="${g.id}" onchange="proto.toggleReportGroup('${g.id}',this.checked)"/>
   <div class="reportInfo"><strong>${escapeHTML(g.name)}</strong><small title="${escapeHTML(g.reports.join(', '))}">${escapeHTML(preview)}</small></div>
   <span class="reportCount">${n}/${g.reports.length} selected</span>
   <button class="customLink" type="button" aria-expanded="${expanded}" aria-controls="report-custom-${g.id}" onclick="proto.toggleReportInline('${g.id}')">${expanded?'Done':'Customize'}</button>
  </div>
  ${expanded?`<div class="inlineOptions" id="report-custom-${g.id}">${g.reports.filter(r=>!enabledOnly||role.reports.includes(r)).map(r=>`<label class="inlineOption"><input type="checkbox" class="check" aria-label="${escapeHTML(r)}" ${role.reports.includes(r)?'checked':''} onchange="proto.toggleReport('${r.replace(/'/g,"\\'")}',this.checked)"/><span>${escapeHTML(r)}</span></label>`).join('')}</div>`:''}
 </section>`;
}
function reportsContent(){const groups=REPORT_GROUPS.filter(g=>!enabledOnly||g.reports.some(x=>role.reports.includes(x)));return `${allReportsRow()}<div class="permissionGroupHelp">Select a category to allow all its reports, or choose Customize to select individual reports.</div><div class="permissionGroupList">${groups.map(reportGroupCard).join('')||empty('No enabled reports','Turn off “Enabled only” to see report groups.')}</div>`;}
function empty(title,body){return `<div class="empty">${I('search')}<strong>${title}</strong><span>${body}</span></div>`;}
function searchResults(){const q=search.toLowerCase().trim();let out='';let n=0;GROUPS.forEach(g=>{if(g.type==='reports'){const hits=REPORT_GROUPS.filter(x=>x.name.toLowerCase().includes(q)||x.reports.some(r=>r.toLowerCase().includes(q)));if(hits.length){out+=`<div class="resultCategory">Reports</div>`+hits.map(reportGroupCard).join('');n+=hits.length;}return;}let rows=(g.rows||[]).filter(r=>(r[1]+' '+r[2]+' '+g.name).toLowerCase().includes(q)&&(!enabledOnly||perm(r[0])!=='none'));let actions=(g.actions||[]).filter(a=>(a[1]+' '+a[2]+' '+g.name).toLowerCase().includes(q)&&(!enabledOnly||act(a[0])));if(rows.length||actions.length){out+=`<div class="resultCategory">${g.name}</div>`+(rows.length?tableHeader()+rows.map(rowMarkup).join(''):'')+actions.map(actionMarkup).join('');n+=rows.length+actions.length;}});return n?out:empty('No matching permissions','Try a different search term.');}
function permissionPanel(){let g=GROUPS.find(g=>g.id===category)||GROUPS[0];return `<section class="card permissionPanel">${categories()}<div class="content">${contentHeader(g)}<div class="contentBody">${contentBody(g)}</div><div class="footer"><span>${I('info')} Changes to this role affect <strong>${role.assigned} assigned employees</strong>.</span><button class="linkAction" onclick="proto.open('impact')">Preview access ${I('chev','sm')}</button></div></div></section>`;}
function listPage(){return `<div class="page"><div class="pageHead"><div><div class="crumb">Employees ${I('chev','sm')} Roles</div><h1>Roles</h1><p class="subtitle">Manage permissions for your store team.</p></div><div class="headActions"><span class="previewTag">Interactive prototype</span><button class="btn primary" onclick="proto.newRole()">${I('plus')} Create role</button></div></div><div class="card roleList"><table class="roleTable"><thead><tr><th>Role</th><th>Employees</th><th>App access</th><th></th></tr></thead><tbody>${Object.entries(ROLES).map(([k,v])=>`<tr><td><strong>${escapeHTML(v.name)}</strong><div style="color:#918ca3;margin-top:5px">${escapeHTML(v.description)}</div></td><td>${v.assigned}</td><td>${Object.values(v.apps).filter(Boolean).length} apps</td><td style="text-align:right"><button class="btn small" onclick="proto.loadRole('${k}')">Edit role ${I('chev','sm')}</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function modalHTML(){if(!modal)return '';let title='',description='',body='',actions='';if(modal==='details'){title='Edit role details';description='Update the name and description of this role.';body=`<div class="field"><label for="roleName">Display name <span style="color:#c74355">*</span></label><input id="roleName" value="${escapeHTML(role.name)}" maxlength="70" /></div><div class="field"><label for="roleDesc">Description</label><textarea id="roleDesc" maxlength="250">${escapeHTML(role.description)}</textarea></div>`;actions=`<button class="btn" onclick="proto.close()">Cancel</button><button class="btn primary" onclick="proto.saveDetails()">Apply changes</button>`;}
if(modal==='impact'){title='Effective access preview';description='App access and shared permissions work together. Turning off an app does not erase its underlying permissions.';const enabled=Object.entries(role.perms).filter(([k,v])=>v!=='none');body=`<div style="font-size:12px;color:var(--muted);margin-bottom:15px">${enabled.length} enabled business permissions · ${Object.values(role.actions).filter(Boolean).length} enabled special actions</div>`+[['bo','Back Office','Configure the catalog, sales, purchasing and team based on shared permissions.'],['pos','POS Register','Use shared catalog and customer permissions alongside checkout-specific actions.'],['yard','OctoYard','Use shared product, inventory and purchasing permissions in supported handheld workflows.']].map(([k,name,d])=>`<div class="impactApp"><div class="hdr"><strong>${name}</strong><span class="${role.apps[k]?'impactOn':'impactOff'}">${role.apps[k]?'Access allowed':'Access blocked'}</span></div><p>${role.apps[k]?d:'All features in this app are inaccessible for this role.'}</p></div>`).join('')+`<div class="scopeNote" style="margin:14px 0 0">${I('info')}<span>Exact capabilities depend on which features each application implements, location restrictions, and any required manager approval.</span></div>`;actions=`<button class="btn primary" onclick="proto.close()">Done</button>`;}
if(modal==='coverage'){
 title='Permission coverage';description='Every permission shown in the four supplied screenshots is accounted for. Shared entries map to one canonical control; report names and app-only actions remain available.';
 let appNames=['Back Office','Reports','Register app','OctoYard app'];
 body=`<div class="coverageStats">${appNames.map(app=>{const count=LEGACY_MAP.filter(x=>x.app===app).length;return `<div><strong>${count}</strong><span>${app}</span></div>`}).join('')}</div><p class="smallhelp" style="margin:14px 0">Source permission → redesigned destination. Some existing source entries intentionally map to the same shared permission.</p><div class="coverageRows">`+appNames.map(app=>{
 const members=LEGACY_MAP.filter(x=>x.app===app);let last='';return `<h3 class="coverageApp">${app} · ${members.length}</h3>`+members.map(it=>{const current=it.section!==last?`<div class="coverageSection">${escapeHTML(it.section)}</div>`:'';last=it.section;const owner=GROUPS.find(g=>(g.rows||[]).some(r=>r[0]===it.key)||(g.actions||[]).some(a=>a[0]===it.key));let target=it.kind==='report'?'Reports → '+it.section:(owner?owner.name:'')+' → '+(owner?.rows||[]).find(r=>r[0]===it.key)?.[1];if(it.kind==='action')target=(owner?.name||'')+' → '+(owner?.actions||[]).find(a=>a[0]===it.key)?.[1];return current+`<div class="coverageItem"><b>${escapeHTML(it.label)}</b><span>${escapeHTML(target||'')}</span></div>`;}).join('');}).join('')+'</div>';
 actions=`<button class="btn primary" onclick="proto.close()">Done</button>`;
}
if(modal==='threshold'){
 const isProduct=modalData==='alertProductDiscount';const label=isProduct?'Product Discount Override':'Order Discount Override';const k=isProduct?'product':'order';
 title='Configure '+label;description='This alert is sent to employees subscribed through OctoYard when a cashier crosses the threshold.';
 body=`<div class="field"><label for="thresholdInput">Alert when manual discount exceeds (%)</label><input id="thresholdInput" type="number" min="0" max="100" step="0.1" value="${role.thresholds[k]}" /></div><p class="smallhelp" style="margin-top:10px">Current screenshot example: ${isProduct?'70.00':'60.00'}%. This is an alert threshold, not a cashier discount limit.</p>`;
 actions=`<button class="btn" onclick="proto.close()">Cancel</button><button class="btn primary" onclick="proto.saveThreshold('${k}')">Apply threshold</button>`;
}
if(modal==='discard'){title='Discard unsaved changes?';description='Your changes to this role have not been saved.';body='<p class="subtitle">If you leave now, your changes to app access and permissions will be lost.</p>';actions=`<button class="btn" onclick="proto.close()">Keep editing</button><button class="btn danger" onclick="proto.discard()">Discard changes</button>`;}
return `<div class="overlay" role="presentation" onclick="if(event.target===this)proto.close()"><section class="modal ${['impact','coverage'].includes(modal)?'wide':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="modalHead"><div><h2>${title}</h2><p>${description}</p></div><button class="close" aria-label="Close" onclick="proto.close()">${I('x','sm')}</button></div><div class="modalBody">${body}</div><div class="modalFooter">${actions}</div></section></div>`;}
let lastRenderedCategory=null,lastRenderedView=null;
function render(){
 const prior=document.querySelector('.mainScroll');
 const priorTop=prior?prior.scrollTop:0;
 const restore=prior&&category===lastRenderedCategory&&view===lastRenderedView;
 document.getElementById('app').innerHTML=sidebar()+`<main class="workspace">${topbar()}<div class="mainScroll">${view==='list'?listPage():`<div class="page">${pageHeader()}${roleCard()}${accessCard()}${permissionPanel()}</div>`}</div></main>`+modalHTML();
 const next=document.querySelector('.mainScroll');if(next&&restore)next.scrollTop=priorTop;
 lastRenderedCategory=category;lastRenderedView=view;
 document.querySelectorAll('input[data-report]').forEach(el=>{let g=REPORT_GROUPS.find(g=>g.id===el.dataset.report);if(g){const n=g.reports.filter(r=>role.reports.includes(r)).length;el.indeterminate=n>0&&n<g.reports.length;}});
 document.querySelectorAll('input[data-register]').forEach(el=>{const name=REGISTER_GROUP_ORDER[Number(el.dataset.register)];const all=GROUPS.find(g=>g.id==='register').actions.filter(a=>a[3]===name);const n=all.filter(a=>act(a[0])).length;el.indeterminate=n>0&&n<all.length;});
}
window.proto={
 navToast:n=>toast('Navigation outside Roles is not included in this prototype.'),pickCategory:id=>{category=id;search='';render();},toggleApp,changePerm,applyAction,toggleReportGroup,toggleReport,setAll,setAllReports,save,open:(m,d)=>{modal=m;modalData=d;render();},close:()=>{modal='';modalData=null;render();},saveDetails:()=>{const name=document.getElementById('roleName').value.trim(),description=document.getElementById('roleDesc').value;if(!name){document.getElementById('roleName').focus();return;}role.name=name;role.description=description;modal='';render();},setSearch:q=>{let i=document.activeElement?.selectionStart;search=q;render();const el=document.getElementById('globalSearch');if(el){el.focus();el.setSelectionRange(i,i);}},enabledOnly:()=>{enabledOnly=!enabledOnly;render();},goList:()=>{if(diff())modal='discard';else view='list';render();},cancel:()=>{if(diff())modal='discard';else view='list';render();},discard:()=>{role=clone(baseline);modal='';view='list';render();},setAllActions,loadRole,toggleRegisterGroup,toggleReportInline,setRegisterGroup, saveThreshold:k=>{const val=Number(document.getElementById('thresholdInput').value);if(!Number.isFinite(val)||val<0||val>100){toast('Enter a threshold between 0 and 100.',false);return;}role.thresholds[k]=val;modal='';render();}, newRole:()=>{toast('Choose a sample role to explore the redesigned editor.');},
};
loadRole('manager');
})();
</script></body></html>
