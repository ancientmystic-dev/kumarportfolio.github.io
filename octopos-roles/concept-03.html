const notify=text=>{let t=el('#toast');if(!t)return;t.textContent=text;t.classList.remove('hide');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.add('hide'),2700)};
const render=(keepScroll=true)=>{const active=document.activeElement?.id;const pos=window.scrollY;el('#root').innerHTML=`<div class="shell">${head()}</div>`;if(keepScroll)requestAnimationFrame(()=>{window.scrollTo(0,pos);if(active==='permSearch'){const x=el('#permSearch');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}}});};
const persist=()=>{try{localStorage.setItem(STORAGE,JSON.stringify({roles,selected}))}catch(e){}};
const switchRole=k=>{if(!roles[k])return;if(dirty()){modal='switch';modalPayload={target:k};render();return}selected=k;expanded='';expandedReport='';expandedRegister='';render()};
const changeCheckbox=(target,val)=>{const action=target.dataset.act,id=target.dataset.id;if(action==='report'){if(val){if(!role().reports.includes(id))role().reports.push(id)}else role().reports=role().reports.filter(x=>x!==id);render()}else if(action==='reportgroup'){let g=REPORT_GROUPS.find(x=>x.id===id);const allOn=g.reports.every(x=>role().reports.includes(x));let enable=!allOn;role().reports=role().reports.filter(x=>!g.reports.includes(x));if(enable)role().reports.push(...g.reports);render()}else if(action==='actioncheck'){role().actions[id]=val;render()}else if(action==='actiongroup'){let arr=(group('register').actions||[]).filter(x=>x[3]===id);let allOn=arr.every(x=>isActionOn(x[0]));arr.forEach(x=>role().actions[x[0]]=!allOn);render()}};
document.addEventListener('change',e=>{if(e.target.id==='roleSwitch'){switchRole(e.target.value);return}if(['report','reportgroup','actioncheck','actiongroup'].includes(e.target.dataset.act)){changeCheckbox(e.target,e.target.checked);return}if(e.target.dataset.act==='threshold'){const id=e.target.dataset.id;role().thresholds[id]=Math.max(0,Math.min(100,Number(e.target.value)||0));render();return}});
document.addEventListener('input',e=>{if(e.target.id==='permSearch'){search=e.target.value;const caret=e.target.selectionStart;const parent=el('#groupLists');parent.innerHTML=groupLists();return}if(e.target.id==='auditSearch'){const d=el('#auditResults');if(d)d.innerHTML=auditRows(e.target.value)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,id=b.dataset.id,val=b.dataset.value;
 if(a==='nav'){notify('Prototype navigation: Roles & permissions is the active page.');return}
 if(a==='roles'){modal='roles';render();return}
 if(a==='filter'){filter=id;render();return}
 if(a==='expand'){expanded=expanded===id?'':id;expandedReport='';expandedRegister='';render();return}
 if(a==='group'){setGroup(id,val);return}
 if(a==='feature'){setItem('',id,val);return}
 if(a==='action'){role().actions[id]=!isActionOn(id);render();return}
 if(a==='reportExpand'){expandedReport=expandedReport===id?'':id;render();return}
 if(a==='regExpand'){expandedRegister=expandedRegister===id?'':id;render();return}
 if(a==='preview'||a==='audit'||a==='roleDetails'){modal=a;render();return}
 if(a==='closeModal'){modal='';modalPayload=null;render();return}
 if(a==='save'){baseline[selected]=clone(role());persist();render();notify(`Changes saved locally for ${role().name}.`);return}
 if(a==='discard'){modal='discard';render();return}
 if(a==='confirmDiscard'){roles[selected]=clone(baseline[selected]);modal='';render();notify('Unsaved changes discarded.');return}
 if(a==='confirmSwitch'){roles[selected]=clone(baseline[selected]);selected=modalPayload.target;modal='';modalPayload=null;expanded='';render();return}
 if(a==='chooseRole'){modal='';switchRole(id);return}
 if(a==='saveRoleDetails'){const name=el('#roleNameInput')?.value.trim(),desc=el('#roleDescriptionInput')?.value.trim();if(!name){notify('Role name is required.');return}role().name=name;role().description=desc;modal='';render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';render()}});
render(false);
})();
</script></body></html>
