const TABSECTIONS=[{key:'daily',title:'Daily operations',groups:['products','sales','inventory','purchasing','customers','team']},{key:'pos',title:'Reports & POS',groups:['allReports','register','overview']},{key:'admin',title:'Administration',groups:['settings','integrations','alerts','other']}];
const ICONS={search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',products:'<path d="m5 3 14 0 3 8-11 11L0 11Z"/><circle cx="11" cy="10" r="2"/>',sales:'<path d="M5 3h13v18l-3-2-3 2-3-2-4 2V3Z"/><path d="M8 8h7M8 12h7"/>',inventory:'<path d="m12 2 9 5-9 5-9-5 9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/>',purchasing:'<path d="M3 5h12v12H3zM15 9h4l3 3v5h-7"/><circle cx="7.5" cy="18" r="2"/><circle cx="18.5" cy="18" r="2"/>',customers:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-2c0-4 14-4 14 0v2M17 4a4 4 0 0 1 0 8M19 15c2 1 3 3 3 6"/>',team:'<circle cx="9" cy="6" r="3"/><circle cx="17" cy="7" r="2"/><path d="M3 20v-3c0-5 12-5 12 0v3M17 14c3 0 5 2 5 5v1"/>',register:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',overview:'<path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M10 2h4l1 3 3 1 3-1 2 4-2 2v3l2 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 2-2v-3L1 9l2-4 3 1 3-1z"/>',integrations:'<path d="M10 13a5 5 0 0 1-7-7l4-4a5 5 0 0 1 7 7M14 11a5 5 0 0 1 7 7l-4 4a5 5 0 0 1-7-7"/>',alerts:'<path d="M5 18h14l-2-3v-5c0-7-10-7-10 0v5zM10 21h4"/>',other:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',allReports:'<path d="M4 21V10h4v11M10 21V4h4v17M16 21v-9h4v9M2 21h20"/>',chevron:'<path d="m6 9 6 6 6-6"/>',back:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m4 12 5 5 11-11"/>',close:'<path d="M5 5 19 19 M19 5 5 19"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 7v5l4 3"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/>',edit:'<path d="M4 20h4l12-12-4-4L4 16z"/>'};
function icon(name,size=17){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.other}</svg>`}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy=x=>JSON.parse(JSON.stringify(x));
const defaultRole=()=>({name:'',displayName:'',description:'',assigned:0,perms:{},actions:{},reports:[],thresholds:{product:70,order:60}});
function buildSeed(){return Object.entries(PRESETS).map(([id,p])=>({id,name:p.name,displayName:p.name,description:p.description,assigned:p.assigned,perms:copy(p.perms||{}),actions:copy(p.actions||{}),reports:p.reports||[],thresholds:copy(p.thresholds||{product:70,order:60})}));}
let savedRoles=buildSeed();
try{const existing=JSON.parse(localStorage.getItem('octopos_role_drawer_v6_saved')||'null');if(Array.isArray(existing)&&existing.length)savedRoles=existing}catch(e){}
let open=true,mode='create',editId='',draft=defaultRole(),baseline=copy(draft),activeTab='all',search='',expanded='',expandedReports=new Set(),expandedActions=new Set(),expandedFinder=new Set(),error=false,modal='',toastTimer;
const byId=id=>savedRoles.find(r=>r.id===id);
const dirty=()=>JSON.stringify(draft)!==JSON.stringify(baseline);
const access=id=>draft.perms[id]||'none';const enabled=id=>Boolean(draft.actions[id]);const reportOn=name=>draft.reports.includes(name);
function featureExpected(row,mode){if(mode==='none')return 'none';if(row.control==='readonly')return 'view';if(row.control==='manageonly')return mode==='manage'?'manage':'none';return mode;}
function groupLevel(g){const r=g.features||[];if(!r.length)return null;for(const mode of ['none','view','manage'])if(r.every(x=>access(x.id)===featureExpected(x,mode)))return mode;return 'custom'}
function reportsFor(id){return Object.keys(REPORTS).filter(n=>REPORTS[n].owner===id)}
function allActions(g){return g.actions||[]}
function counts(id){const g=GROUPS[id];return [g.features.filter(f=>access(f.id)!=='none').length,reportsFor(id).filter(reportOn).length,g.actions.filter(a=>enabled(a.id)).length]}
function groupSubtitle(id){const g=GROUPS[id];let parts=[];if(g.features.length)parts.push(`${counts(id)[0]}/${g.features.length} features`);if(reportsFor(id).length)parts.push(`${counts(id)[1]}/${reportsFor(id).length} reports`);if(g.actions.length)parts.push(`${counts(id)[2]}/${g.actions.length} actions`);return parts.join(' · ')}
function renderBackground(){const rows=savedRoles.map((r,i)=>`<div class="tr" data-row-role="${esc(r.id)}" role="button" tabindex="0"><span>${57+i*4}</span><span class="link">${esc(r.name)}</span><span>${esc(r.displayName)}</span><span class="muted">${r.assigned||0} employees</span></div>`).join('');return `<div class="app"><aside class="appside"><div class="logo">◉ octopos</div>${['Dashboard','HR','Products','Sales','Purchasing','Customer Engagement','Reports','Settings'].map(x=>`<div class="appnav ${x==='HR'?'current':''}">${x==='HR'?'▣':'◇'} <span>${x}</span></div>${x==='HR'?'<div class="appsub">Employees</div><div class="appsub current">Roles</div><div class="appsub">Employee Schedules</div>':''}`).join('')}</aside><main class="appbody"><div class="appmain"><div class="appheader">HR Management</div><div class="rolesbar"><input class="searchback" placeholder="Search roles…" aria-label="Search roles" id="backSearch"><button class="primary" data-act="newrole">+ Create role</button></div><div class="apptable"><div class="tr h"><span>ID</span><span>Role Name</span><span>Display Name</span><span>Assigned</span></div>${rows}</div></div></main></div>`}
function renderDetails(){return `<section class="fieldbox"><div class="fieldgrid"><div class="field"><label for="roleName">Role Name <span class="req">*</span></label><input id="roleName" placeholder="Name" value="${esc(draft.name)}" maxlength="70" class="${error&&!draft.name.trim()?'invalid':''}">${error&&!draft.name.trim()?'<small class="fieldErr">Enter a role name.</small>':''}</div><div class="field"><label for="roleDisplay">Display Name <span class="req">*</span></label><input id="roleDisplay" placeholder="Display Name" value="${esc(draft.displayName)}" maxlength="70" class="${error&&!draft.displayName.trim()?'invalid':''}">${error&&!draft.displayName.trim()?'<small class="fieldErr">Enter a display name.</small>':''}</div><div class="field full"><label for="roleDescription">Description <span class="req">*</span></label><textarea id="roleDescription" maxlength="200" placeholder="Describe what this role is for">${esc(draft.description)}</textarea><div style="display:flex;justify-content:space-between;gap:8px"><span class="fieldErr">${error&&!draft.description.trim()?'Enter a description.':''}</span><span class="muted" style="font-size:10px">${draft.description.length}/200</span></div></div></div></section>`}
function miniLevels(id,current,kind='standard'){let opts=kind==='readonly'?[['none','No access'],['view','View']]:kind==='manageonly'?[['none','No access'],['manage','Manage']]:[['none','No access'],['view','View'],['manage','Manage']];return `<div class="levels compactLevels" role="group" aria-label="Permission level">${opts.map(([value,label])=>`<button type="button" class="${current===value?'active':''}" data-act="feature" data-id="${esc(id)}" data-value="${value}" aria-pressed="${current===value}">${label}</button>`).join('')}</div>`}
function parentLevels(id,g){const current=groupLevel(g);const opts=g.features.every(f=>f.control==='readonly')?[['none','No access'],['view','View']]:[['none','No access'],['view','View'],['manage','Manage']];return `<div class="levels" role="group" aria-label="${esc(g.label)} group permissions">${opts.map(([val,label])=>`<button type="button" class="${current===val?'active':''}" data-act="group" data-id="${id}" data-value="${val}" aria-pressed="${current===val}">${label}</button>`).join('')}</div>`}
function summaryBadge(id){const g=GROUPS[id];const l=groupLevel(g);return l==='custom'?'<span class="custombadge">Custom</span>':''}
function renderGroup(id){if(id==='allReports')return renderFinderCard();const g=GROUPS[id];const isOpen=expanded===id;let summary=groupSubtitle(id);return `<article class="permcard" data-group="${id}"><div class="cardhead"><div class="permicon">${icon(id,19)}</div><div class="cardtitle"><div class="cardname">${esc(g.label)} ${summaryBadge(id)}</div><div class="cardsub">${esc(g.subtitle)}</div><div class="cardcount">${esc(summary)}</div></div><div class="rightcontrols">${g.features.length?parentLevels(id,g):`<button class="smallbtn" data-act="actionBulk" data-id="${id}" data-value="${g.actions.every(x=>enabled(x.id))?'clear':'select'}">${g.actions.every(x=>enabled(x.id))?'Clear all':'Allow all'}</button>`}<button class="customize" data-act="expand" data-id="${id}" aria-expanded="${isOpen}">${isOpen?'Done':'Customize'} ${icon('chevron',13)}</button></div></div>${isOpen?renderExpanded(id):''}</article>`}
function featuresSection(id){const g=GROUPS[id];let features=g.features.filter(f=>!search||[f.label,f.help,g.label].join(' ').toLowerCase().includes(search.toLowerCase()));if(!features.length)return '';return `<div class="minorHead">Feature access <span class="muted" style="font-weight:400;font-size:10px">${counts(id)[0]} of ${g.features.length} enabled</span></div><div class="featureBox">${features.map(f=>`<div class="featureRow"><div style="min-width:0;flex:1"><label>${esc(f.label)}</label><div class="help">${esc(f.help)}</div></div>${miniLevels(f.id,access(f.id),f.control)}</div>`).join('')}</div>`}
function reportRows(names){return names.map(n=>`<div class="foldRow"><label><input type="checkbox" data-report="${esc(n)}" ${reportOn(n)?'checked':''}/><span><span style="font-weight:650">${esc(n)}</span>${REPORTS[n].review?'<small class="caution">Report grouping needs product confirmation</small>':''}</span></label></div>`).join('')}
function reportsSection(id){const items=reportsFor(id);if(!items.length)return '';const match=items.filter(n=>!search||[n,id,GROUPS[id].label,REPORTS[n].sourceGroup].join(' ').toLowerCase().includes(search.toLowerCase()));const on=items.filter(reportOn).length;const open=expandedReports.has(id)||!!search;return `<div class="separate"><div class="minorHead"><span>Related reports <span class="kindpill">Independent</span></span><span class="reportCount">${on} / ${items.length} selected</span></div><div class="segmentNote">${esc(GROUPS[id].label)} access does <strong>not</strong> automatically grant reports. Select reports separately below.</div><div class="fold"><div class="foldHead"><button class="foldTitle" data-act="reportsFold" data-id="${id}">${icon('chevron',13)}<div><strong>Reports for ${esc(GROUPS[id].label)}</strong><br><span>${items.length} available</span></div></button><div class="foldSmall"><button class="foldAct" data-act="reportBulk" data-id="${id}" data-value="clear">Clear all</button><button class="foldAct" data-act="reportBulk" data-id="${id}" data-value="select">Select all</button></div></div>${open?reportRows(match):''}</div></div>`}
function actionSections(id){const items=GROUPS[id].actions;if(!items.length)return '';const groups=[...new Set(items.map(x=>x.subgroup))];return `<div class="separate"><div class="minorHead">Special actions <span class="reportCount">${items.filter(x=>enabled(x.id)).length} / ${items.length} allowed</span></div><div class="segmentNote">Actions such as refunds, price overrides, and alerts are authorized separately. A parent View/Manage choice doesn't enable them.</div>${groups.map(sub=>{const arr=items.filter(x=>x.subgroup===sub);const match=arr.filter(x=>!search||[x.label,x.help,sub].join(' ').toLowerCase().includes(search.toLowerCase()));if(!match.length)return '';const opened=expandedActions.has(id+'|'+sub)||!!search;return `<div class="fold"><div class="foldHead"><button class="foldTitle" data-act="actionFold" data-id="${esc(id+'|'+sub)}">${icon('chevron',13)}<div><strong>${esc(sub)}</strong><br><span>${arr.filter(x=>enabled(x.id)).length} of ${arr.length} allowed</span></div></button><div class="foldSmall"><button class="foldAct" data-act="actionCategoryBulk" data-id="${id}" data-sub="${esc(sub)}" data-value="clear">Clear</button><button class="foldAct" data-act="actionCategoryBulk" data-id="${id}" data-sub="${esc(sub)}" data-value="select">Select all</button></div></div>${opened?match.map(x=>`<div class="foldRow"><label><input type="checkbox" data-action="${x.id}" ${enabled(x.id)?'checked':''}/><span>${esc(x.label)}<small>${esc(x.help)}</small></span></label>${x.id==='alertProductDiscount'||x.id==='alertOrderDiscount'?`<div class="foldSmall"><input class="numInput" aria-label="${esc(x.label)} threshold percentage" type="number" min="0" max="100" data-threshold="${x.id==='alertProductDiscount'?'product':'order'}" value="${esc(draft.thresholds[x.id==='alertProductDiscount'?'product':'order'])}"/><span class="muted">%</span></div>`:''}</div>`).join(''):''}</div>`}).join('')}</div>`}
function renderExpanded(id){let g=GROUPS[id];let feat=featuresSection(id),rep=reportsSection(id),act=actionSections(id);return `<div class="expandPane"><div class="expandTop"><div><strong>Customize ${esc(g.label)}</strong><p>Configure individual permissions without changing other capabilities.</p></div><button class="textbutton" data-act="expand" data-id="${id}">Done ↑</button></div>${g.features.length?'<div class="segmentNote">The group-level buttons update <strong>feature access only</strong>. Reports and special actions keep their own selections.</div>':''}${id==='other'?'<div class="warn">This is an unresolved legacy permission. Confirm its actual behavior before releasing a role configuration that changes it.</div>':''}${feat}${rep}${act}</div>`}
function finderOwnership(){return [...new Set(Object.values(REPORTS).map(x=>x.owner))].sort((a,b)=>TABSECTIONS[0].groups.indexOf(a)-TABSECTIONS[0].groups.indexOf(b))}
function renderFinderCard(){const isOpen=expanded==='allReports';return `<article class="permcard"><div class="cardhead"><div class="permicon">${icon('allReports',20)}</div><div class="cardtitle"><div class="cardname">All reports <span class="finderTag">Finder, not another permission</span></div><div class="cardsub">Find any report by the business area that owns it</div><div class="cardcount">${draft.reports.length} of ${DATA.reportTotal} selected</div></div><div class="rightcontrols"><button class="customize" data-act="expand" data-id="allReports">${isOpen?'Done':'Browse reports'} ${icon('chevron',13)}</button></div></div>${isOpen?`<div class="expandPane"><div class="segmentNote">Every report has one permission setting. Changes made here also appear in its related business group.</div>${finderOwnership().map(id=>{const names=reportsFor(id).filter(n=>!search||[n,GROUPS[id].label].join(' ').toLowerCase().includes(search.toLowerCase()));if(!names.length)return '';const show=expandedFinder.has(id)||!!search;return `<div class="fold"><div class="foldHead"><button class="foldTitle" data-act="finderFold" data-id="${id}">${icon('chevron',13)}<div><strong>${esc(GROUPS[id].label)}</strong><br><span>${reportsFor(id).filter(reportOn).length} of ${reportsFor(id).length} reports selected</span></div></button><div class="foldSmall"><button class="foldAct" data-act="reportBulk" data-id="${id}" data-value="clear">Clear</button><button class="foldAct" data-act="reportBulk" data-id="${id}" data-value="select">Select all</button></div></div>${show?reportRows(names):''}</div>`}).join('')}<div style="margin-top:12px"><button class="textbutton" data-act="reportBulk" data-id="ALL" data-value="select">Select all 45 reports</button><span class="muted"> · </span><button class="textbutton" data-act="reportBulk" data-id="ALL" data-value="clear">Clear all reports</button></div></div>`:''}</article>`}
function relevantForSearch(id,q){if(!q)return true;if(id==='allReports')return 'all reports report finder'.includes(q)||Object.keys(REPORTS).some(n=>n.toLowerCase().includes(q));const g=GROUPS[id];return [g.label,g.subtitle,...g.features.flatMap(f=>[f.label,f.help]),...g.actions.flatMap(a=>[a.label,a.help,a.subgroup]),...reportsFor(id)].join(' ').toLowerCase().includes(q)}
function groupSections(){const q=search.trim().toLowerCase();const sections=TABSECTIONS.filter(s=>activeTab==='all'||s.key===activeTab||Boolean(q));return sections.map(section=>{let ids=section.groups.filter(id=>relevantForSearch(id,q));if(!ids.length)return '';return `<section class="groupsection"><h3 class="groupheading">${esc(section.title)}</h3><div class="cards">${ids.map(id=>renderGroup(id)).join('')}</div></section>`}).join('')||'<div class="empty">No permissions found. Try a different search.</div>'}
function renderDrawer(){if(!open)return '';return `<div class="scrim" data-act="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${mode==='create'?'Create':'Edit'} role"><header class="dhead"><h1>${mode==='create'?'Create Role':'Edit Role'}</h1><button class="xbtn" aria-label="Close role editor" data-act="close">×</button></header><div class="dbody" id="drawerScroll">${renderDetails()}<div class="heading"><div><h2>Permission groups</h2><p>Set access for each business area, then customize individual permissions.</p></div><button class="textbutton" data-act="audit">135 mapped</button></div><div class="tools"><div class="pilltabs" role="tablist">${[['all','All'],['daily','Daily Operations'],['pos','Reports & POS'],['admin','Administration']].map(([key,label])=>`<button type="button" role="tab" aria-selected="${activeTab===key}" class="${activeTab===key?'active':''}" data-act="tab" data-value="${key}">${label}</button>`).join('')}</div><label class="permsearch">${icon('search',16)}<input type="search" id="permSearch" placeholder="Search Permission" value="${esc(search)}" aria-label="Search all permissions"/></label></div><div class="note">Related reports now appear inside their business groups. <strong>View/Manage changes features only</strong>; reports and special actions are always selected separately.</div><div id="groupsContent">${groupSections()}</div><div class="auditline">${icon('check',14)} <button class="textbutton" data-act="audit">135 / 135 original entries mapped</button> <span>·</span> <span>45 reports with one shared selection state</span></div></div><footer class="dfoot"><div class="footleft"><span id="dirtyText">${dirty()?'● Unsaved changes':'● No unsaved changes'}</span> ${dirty()?`<button class="textbutton" data-act="review">Review changes</button>`:''}</div><div class="footright"><button class="secondary" data-act="close">Cancel</button><button class="primary" data-act="save">${mode==='create'?'Save':'Update'}</button></div></footer></aside>`}
function renderAll(scroll=true){const y=document.getElementById('drawerScroll')?.scrollTop||0;document.getElementById('root').innerHTML=renderBackground()+renderDrawer();if(scroll&&open)document.getElementById('drawerScroll').scrollTop=y;renderModal()}
function renderOnlyGroups(){const body=document.getElementById('groupsContent');if(body)body.innerHTML=groupSections()}
function redraw(){const x=document.getElementById('drawerScroll');let top=x?.scrollTop||0;const yy=window.scrollY;renderAll(false);const fresh=document.getElementById('drawerScroll');if(fresh)fresh.scrollTop=top;window.scrollTo(0,yy)}
function notify(msg){const root=document.getElementById('toastroot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3400)}
function saveState(){try{localStorage.setItem('octopos_role_drawer_v6_saved',JSON.stringify(savedRoles))}catch(e){}}
function setFeature(id,val){draft.perms[id]=val;redraw()}
function setGroupLevel(id,val){const g=GROUPS[id];let skipped=0;g.features.forEach(f=>{if(f.control==='manageonly'&&val==='view'){skipped++;return}draft.perms[f.id]=featureExpected(f,val)});redraw();notify(`Updated ${g.features.length-skipped} ${g.label} feature permissions. Reports and special actions unchanged.`)}
function setReport(name,on){let chosen=new Set(draft.reports);on?chosen.add(name):chosen.delete(name);draft.reports=[...chosen];redraw()}
function reportBulk(id,enable){const arr=id==='ALL'?Object.keys(REPORTS):reportsFor(id);const selection=new Set(draft.reports);arr.forEach(n=>enable?selection.add(n):selection.delete(n));draft.reports=[...selection];redraw();notify(`${arr.length} report permissions ${enable?'selected':'cleared'} independently of feature access.`)}
function actionBulk(id,sub,enable){GROUPS[id].actions.filter(a=>!sub||a.subgroup===sub).forEach(a=>draft.actions[a.id]=enable);redraw();notify('Action permissions updated. Other access levels unchanged.')}
function startNew(){mode='create';editId='';draft=defaultRole();baseline=copy(draft);activeTab='all';search='';expanded='';expandedReports.clear();expandedActions.clear();expandedFinder.clear();open=true;error=false;modal='';renderAll(false)}
function openEdit(id){const current=byId(id);if(!current)return;mode='edit';editId=id;draft=copy(current);baseline=copy(current);activeTab='all';search='';expanded='';expandedReports.clear();expandedActions.clear();expandedFinder.clear();open=true;error=false;modal='';renderAll(false)}
function tryClose(){if(dirty()){modal='discard';renderModal();return}open=false;renderAll(false)}
function saveRole(){error=false;if(!draft.name.trim()||!draft.displayName.trim()||!draft.description.trim()){error=true;redraw();document.getElementById('roleName')?.focus();notify('Complete the required role details before saving.');return}let role=copy(draft);if(mode==='create'){role.id='role_'+Math.random().toString(36).slice(2,8);savedRoles.push(role)}else{const i=savedRoles.findIndex(x=>x.id===editId);if(i>=0)savedRoles[i]={...role,id:editId}}saveState();open=false;modal='';renderAll(false);notify(`Role ${mode==='create'?'created':'updated'} locally. No production changes were made.`)}
function auditMarkup(){return `<div style="max-height:400px;overflow:auto"><table class="auditTable"><thead><tr><th>Current app</th><th>Current group</th><th>Existing permission</th><th>New business group</th></tr></thead><tbody>${LEGACY.map(l=>{let owner=l.kind==='report'?REPORTS[l.label]?.owner:Object.keys(GROUPS).find(id=>GROUPS[id].features.some(x=>x.id===l.key)||GROUPS[id].actions.some(x=>x.id===l.key));return `<tr><td>${esc(l.app)}</td><td>${esc(l.section)}</td><td>${esc(l.label)}</td><td>${esc(GROUPS[owner]?.label||'Review')}</td></tr>`}).join('')}</tbody></table></div>`}
function reviewHtml(){const changes=[];const originalReports=new Set(baseline.reports);const newReports=new Set(draft.reports);for(const g of Object.values(GROUPS)){for(const f of g.features){if(access(f.id)!==(baseline.perms[f.id]||'none'))changes.push(`${g.label} → ${f.label}: ${baseline.perms[f.id]||'none'} → ${access(f.id)}`)}for(const a of g.actions){if(Boolean(draft.actions[a.id])!==Boolean(baseline.actions[a.id]))changes.push(`${g.label} → ${a.label}: ${baseline.actions[a.id]?'Allowed':'Blocked'} → ${draft.actions[a.id]?'Allowed':'Blocked'}`)}}for(const n of Object.keys(REPORTS))if(originalReports.has(n)!==newReports.has(n))changes.push(`Report: ${n}: ${originalReports.has(n)?'Allowed':'Blocked'} → ${newReports.has(n)?'Allowed':'Blocked'}`);let extra=(draft.name!==baseline.name)+(draft.displayName!==baseline.displayName)+(draft.description!==baseline.description);return `<div class="reviewGrid"><div class="reviewBox"><strong>${changes.length}</strong> Permission changes</div><div class="reviewBox"><strong>${draft.reports.length}/45</strong> Reports enabled</div></div><div class="feedback" style="margin-bottom:10px">${extra?`${extra} role detail field(s) modified. `:''}Changes apply wherever each capability is supported; they do not automatically authorize related reports.</div>${changes.length?`<div style="max-height:300px;overflow:auto"><div class="featureBox">${changes.map(s=>`<div style="padding:10px 12px;border-bottom:1px solid #eff0f5;font-size:11px">${esc(s)}</div>`).join('')}</div></div>`:'<div class="empty">No permission edits yet.</div>'}`}
function renderModal(){const root=document.getElementById('modalroot');if(!modal){root.innerHTML='';return}let title,desc,body,actions;if(modal==='discard'){title='Discard unsaved changes?';desc='Any changes you made in this role editor will be lost.';body='<div class="warn">This is a simulated role editor. Changes are not applied until you save.</div>';actions='<button class="secondary" data-act="modalClose">Keep editing</button><button class="primary" data-act="confirmClose">Discard changes</button>'}else if(modal==='audit'){title='Permission coverage';desc='A traceable mapping of every existing permission, including four shared-control consolidations.';body=`<div class="reviewGrid"><div class="reviewBox"><strong>135 / 135</strong> Original permissions mapped</div><div class="reviewBox"><strong>45 / 45</strong> Reports mapped</div></div><div class="warn" style="margin-bottom:12px">Some existing application-specific permissions map to shared business controls. Engineering must review effective-access migration before production use.</div>${auditMarkup()}`;actions='<button class="primary" data-act="modalClose">Done</button>'}else{title='Review role changes';desc='Review the permissions for this role before saving.';body=reviewHtml();actions='<button class="secondary" data-act="modalClose">Keep editing</button><button class="primary" data-act="modalSave">Save role</button>'}root.innerHTML=`<div class="modalScrim" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><p>${esc(desc)}</p>${body}<div class="actions">${actions}</div></section></div>`}
function refreshDirty(){const text=document.getElementById('dirtyText');if(text)text.textContent=dirty()?'● Unsaved changes':'● No unsaved changes'}
// Keep the text fields stable while typing; permission changes use delegated events.
document.addEventListener('input',e=>{const id=e.target.id;if(id==='roleName')draft.name=e.target.value;else if(id==='roleDisplay')draft.displayName=e.target.value;else if(id==='roleDescription')draft.description=e.target.value;else if(id==='permSearch'){search=e.target.value;renderOnlyGroups();return}else if(id==='backSearch'){const value=e.target.value.toLowerCase();document.querySelectorAll('[data-row-role]').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(value)?'':'none');return}else return;refreshDirty()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.report){setReport(t.dataset.report,t.checked);return}if(t.dataset.action){draft.actions[t.dataset.action]=t.checked;redraw();return}if(t.dataset.threshold){let n=Number(t.value);draft.thresholds[t.dataset.threshold]=Math.min(100,Math.max(0,isFinite(n)?n:0));redraw();return}});
document.addEventListener('click',e=>{const role=e.target.closest('[data-row-role]');if(role&&!open){openEdit(role.dataset.rowRole);return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,val=b.dataset.value;if(a==='newrole'){startNew();return}if(a==='close'||a==='scrim'){tryClose();return}if(a==='tab'){activeTab=val;search='';expanded='';expandedReports.clear();expandedActions.clear();expandedFinder.clear();redraw();return}if(a==='expand'){expanded=expanded===id?'':id;if(id!=='allReports'){expandedReports.add(id);GROUPS[id].actions.forEach(x=>expandedActions.add(id+'|'+x.subgroup))}redraw();return}if(a==='group'){setGroupLevel(id,val);return}if(a==='feature'){setFeature(id,val);return}if(a==='reportBulk'){reportBulk(id,val==='select');return}if(a==='reportsFold'){expandedReports.has(id)?expandedReports.delete(id):expandedReports.add(id);redraw();return}if(a==='finderFold'){expandedFinder.has(id)?expandedFinder.delete(id):expandedFinder.add(id);redraw();return}if(a==='actionFold'){expandedActions.has(id)?expandedActions.delete(id):expandedActions.add(id);redraw();return}if(a==='actionBulk'||a==='actionCategoryBulk'){actionBulk(id,b.dataset.sub||'',val==='select');return}if(a==='save'||a==='modalSave'){saveRole();return}if(a==='review'||a==='audit'){modal=a;renderModal();return}if(a==='modalClose'){modal='';renderModal();return}if(a==='confirmClose'){modal='';open=false;renderAll(false);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';renderModal()}else if(e.key==='Escape'&&open)tryClose();const el=e.target.closest?.('[data-row-role]');if(el&&!open&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openEdit(el.dataset.rowRole)}});
renderAll(false);
</script></body></html>
