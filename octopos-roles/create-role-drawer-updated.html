/* Visual refinement: compact, focused Create Role editor (V7). */
:root{--blue:#285bd4;--ink:#27314b;--muted:#7b8399;--border:#e5e8ef;--line:#eff0f5;--tint:#edf3ff;--bg:#f7f8fb}
.drawer{width:min(960px,75vw);background:#fff}

.dfoot{min-height:65px;padding:11px 24px;border-color:#e9ecf3;box-shadow:0 -4px 16px #1f2e5310}

.heading h2{font-size:15px;margin:0;letter-spacing:-.2px}
.headingTools{display:flex;gap:14px;align-items:center}

.permsearch{border-radius:8px;min-height:36px;width:100%;max-width:none}
.groupsection{margin:0 0 18px}
.groupheading{margin:0 0 9px 2px;letter-spacing:.7px;font-size:10px;color:#8590a4}

.cards{gap:7px}

.cardname{font-size:12.5px;color:#27314c;line-height:1.3;gap:6px;letter-spacing:-.1px}
.cardtitle{overflow:visible}
.cardcount{font-size:10.7px;color:#8c96a8;margin-top:4px;line-height:1.3}
.cardsub,.appCoverage,.scopeBanner,.sourceNote{display:none!important}
.rightcontrols{gap:10px}
.levels{border-radius:7px;border-color:#dfe5f0;box-shadow:none}
.levels button{font-size:11px;padding:7px 11px;min-height:31px;color:#525d74;border-color:#e0e5ef}
.levels button.active{background:#2b5ac8;color:#fff;border-color:#2b5ac8}
.customize{font-size:11px;padding:8px 2px;color:#2457c6;font-weight:700}
.customize:hover,.foldAct:hover{color:#143d9f}
.customize[aria-expanded="true"] svg{transform:rotate(180deg)}
.custombadge{font-size:9px;padding:2px 6px;border-radius:5px}

.focusBreadcrumb{display:flex;align-items:center;gap:11px;margin:4px 0 17px;color:#abb1c0;font-size:12px}
.focusBreadcrumb strong{color:#525d76;font-weight:670}
.focusBack{display:inline-flex;align-items:center;gap:6px;color:#2558c6;border:0;background:transparent;font-size:12px;font-weight:720;padding:5px 0}
.focusBack:hover{text-decoration:underline}
.focusDivider{color:#c7cedd}
.singleCategory .permcard{border-radius:12px}

.singleCategory .cardcount{font-size:11px}
.expandPane{background:#fff;border-top:1px solid #eaeef5;padding:13px 16px 22px}
.expandTop{margin-bottom:8px;min-height:28px}

 const tabDef=[['daily','Daily operations'],['pos','Register & reports'],['admin','Administration'],['all','All']];
 const focusLabel=expanded==='allReports'?'All reports':GROUPS[expanded]?.label||'Permissions';
 return `<div class="scrim" data-act="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${mode==='create'?'Create':'Edit'} role"><header class="dhead"><h1>${mode==='create'?'Create Role':'Edit Role'}</h1><button class="xbtn" aria-label="Close role editor" data-act="close">×</button></header><div class="dbody" id="drawerScroll">${focused?`<div class="focusBreadcrumb"><button class="focusBack" data-act="focusBack">${icon('back',17)} All permission groups</button><span class="focusDivider">/</span><strong>${esc(focusLabel)}</strong></div>`:`${renderDetails()}<div class="heading"><div><h2>Permissions</h2></div><div class="headingTools"><button class="subtleLink" data-act="scope" title="View application availability details">${icon('info',14)} App coverage</button><button class="subtleLink" data-act="audit" title="See legacy permission mapping">135 mapped</button></div></div><div class="tools"><div class="pilltabs" role="tablist">${tabDef.map(([key,label])=>`<button type="button" role="tab" aria-selected="${activeTab===key}" class="${activeTab===key?'active':''}" data-act="tab" data-value="${key}">${label}</button>`).join('')}</div><label class="permsearch">${icon('search',16)}<input type="search" id="permSearch" placeholder="Find a permission..." value="${esc(search)}" aria-label="Search all permissions"/></label></div>`}<div id="groupsContent">${groupSections()}</div></div><footer class="dfoot"><div class="footleft"><span id="dirtyText">${dirty()?'● Unsaved changes':'No unsaved changes'}</span>${dirty()?` <button class="textbutton" data-act="review">Review</button>`:''}</div><div class="footright"><button class="secondary" data-act="close">Cancel</button><button class="primary" data-act="save">${mode==='create'?'Create role':'Save changes'}</button></div></footer></aside>`
}
function renderAll(scroll=true){const y=document.getElementById('drawerScroll')?.scrollTop||0;document.getElementById('root').innerHTML=renderBackground()+renderDrawer();if(scroll&&open)document.getElementById('drawerScroll').scrollTop=y;renderModal();markMixed()}
function markMixed(){document.querySelectorAll('.headerCheckbox[data-mixed="true"]').forEach(el=>{el.indeterminate=true})}
function renderOnlyGroups(){const body=document.getElementById('groupsContent');if(body)body.innerHTML=groupSections();markMixed()}
function redraw(){const x=document.getElementById('drawerScroll');let top=x?.scrollTop||0;const yy=window.scrollY;renderAll(false);const fresh=document.getElementById('drawerScroll');if(fresh)fresh.scrollTop=top;window.scrollTo(0,yy)}
function notify(msg){const root=document.getElementById('toastroot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3400)}
function saveState(){try{localStorage.setItem('octopos_role_drawer_v6_saved',JSON.stringify(savedRoles))}catch(e){}}
function setFeature(id,val){draft.perms[id]=val;redraw()}
function setGroupLevel(id,val){const g=GROUPS[id];let skipped=0;g.features.forEach(f=>{if(f.control==='manageonly'&&val==='view'){skipped++;return}draft.perms[f.id]=featureExpected(f,val)});redraw();notify(`Updated ${g.features.length-skipped} ${g.label} feature permissions. Reports and special actions unchanged.`)}
function setReport(name,on){let chosen=new Set(draft.reports);on?chosen.add(name):chosen.delete(name);draft.reports=[...chosen];redraw()}
function reportBulk(id,enable){const arr=id==='ALL'?Object.keys(REPORTS):reportsFor(id);const selection=new Set(draft.reports);arr.forEach(n=>enable?selection.add(n):selection.delete(n));draft.reports=[...selection];redraw();notify(`${arr.length} report permissions ${enable?'selected':'cleared'} independently of feature access.`)}
function actionBulk(id,sub,enable){GROUPS[id].actions.filter(a=>!sub||a.subgroup===sub).forEach(a=>draft.actions[a.id]=enable);redraw();notify('Action permissions updated. Other access levels unchanged.')}
function startNew(){mode='create';editId='';draft=defaultRole();baseline=copy(draft);activeTab='daily';search='';expanded='';expandedReports.clear();expandedActions.clear();expandedFinder.clear();open=true;showCoverage=false;listScroll=0;error=false;modal='';renderAll(false)}
function openEdit(id){const current=byId(id);if(!current)return;mode='edit';editId=id;draft=copy(current);baseline=copy(current);activeTab='daily';search='';expanded='';expandedReports.clear();expandedActions.clear();expandedFinder.clear();open=true;showCoverage=false;listScroll=0;error=false;modal='';renderAll(false)}
function tryClose(){if(dirty()){modal='discard';renderModal();return}open=false;renderAll(false)}
function saveRole(){error=false;if(!draft.name.trim()||!draft.displayName.trim()||!draft.description.trim()){error=true;redraw();document.getElementById('roleName')?.focus();notify('Complete the required role details before saving.');return}let role=copy(draft);if(mode==='create'){role.id='role_'+Math.random().toString(36).slice(2,8);savedRoles.push(role)}else{const i=savedRoles.findIndex(x=>x.id===editId);if(i>=0)savedRoles[i]={...role,id:editId}}saveState();open=false;modal='';renderAll(false);notify(`Role ${mode==='create'?'created':'updated'} locally. No production changes were made.`)}
function auditMarkup(){return `<div style="max-height:400px;overflow:auto"><table class="auditTable"><thead><tr><th>Current app</th><th>Current group</th><th>Existing permission</th><th>New business group</th></tr></thead><tbody>${LEGACY.map(l=>{let owner=l.kind==='report'?REPORTS[l.label]?.owner:Object.keys(GROUPS).find(id=>GROUPS[id].features.some(x=>x.id===l.key)||GROUPS[id].actions.some(x=>x.id===l.key));return `<tr><td>${esc(l.app)}</td><td>${esc(l.section)}</td><td>${esc(l.label)}</td><td>${esc(GROUPS[owner]?.label||'Review')}</td></tr>`}).join('')}</tbody></table></div>`}
function reviewHtml(){const changes=[];const originalReports=new Set(baseline.reports);const newReports=new Set(draft.reports);for(const g of Object.values(GROUPS)){for(const f of g.features){if(access(f.id)!==(baseline.perms[f.id]||'none'))changes.push(`${g.label} → ${f.label}: ${baseline.perms[f.id]||'none'} → ${access(f.id)}`)}for(const a of g.actions){if(Boolean(draft.actions[a.id])!==Boolean(baseline.actions[a.id]))changes.push(`${g.label} → ${a.label}: ${baseline.actions[a.id]?'Allowed':'Blocked'} → ${draft.actions[a.id]?'Allowed':'Blocked'}`)}}for(const n of Object.keys(REPORTS))if(originalReports.has(n)!==newReports.has(n))changes.push(`Report: ${n}: ${originalReports.has(n)?'Allowed':'Blocked'} → ${newReports.has(n)?'Allowed':'Blocked'}`);let extra=(draft.name!==baseline.name)+(draft.displayName!==baseline.displayName)+(draft.description!==baseline.description);return `<div class="reviewGrid"><div class="reviewBox"><strong>${changes.length}</strong> Permission changes</div><div class="reviewBox"><strong>${draft.reports.length}/45</strong> Reports enabled</div></div><div class="feedback" style="margin-bottom:10px">${extra?`${extra} role detail field(s) modified. `:''}Changes apply wherever each capability is supported; they do not automatically authorize related reports.</div>${changes.length?`<div style="max-height:300px;overflow:auto"><div class="featureBox">${changes.map(s=>`<div style="padding:10px 12px;border-bottom:1px solid #eff0f5;font-size:11px">${esc(s)}</div>`).join('')}</div></div>`:'<div class="empty">No permission edits yet.</div>'}`}
function renderModal(){const root=document.getElementById('modalroot');if(!modal){root.innerHTML='';return}let title,desc,body,actions;if(modal==='scope'){title='Where permissions apply';desc='Unified permission model · app coverage shown for transparency';body=`<div class="segmentNote">The intent of this concept is <strong>one permission per business capability</strong>. That access applies only in apps where that capability is implemented; it does not give someone access to an app they cannot otherwise open. These badges are not app-by-app permission toggles.</div><div class="scopeGrid"><div class="scopeSample"><strong>Products</strong>${featureChips('products')}<p>Back Office Products and OctoYard Product Detail appear in the original permissions. POS Products-module management is a planned addition, not one of the 21 original Register permissions. Existing BO Read/Write and OctoYard on/off controls would need a defined migration.</p></div><div class="scopeSample"><strong>Customers</strong>${featureChips('customers')}<p>Customers currently maps to Back Office. POS Customers-module management is planned. No OctoYard Customers permission was supplied in the source screenshots, so it is <strong>not</strong> shown as supported.</p></div><div class="scopeSample"><strong>Departments & tags</strong>${featureChips('departments')}<p>Explicit Back Office permissions exist. POS module-management rights are planned. The inventory does not establish independent OctoYard permissions for these capabilities.</p></div><div class="scopeSample"><strong>Purchase orders</strong>${featureChips('purchaseOrders')}<p>Both Back Office and OctoYard have an existing purchase-order permission. Whether their access levels are equivalent still requires engineering verification.</p></div></div><div class="warn">Unifying permissions changes access policy, not just the interface. Preserve existing effective access during migration. Product lookup at checkout and clock-in access are separate from Product module management.</div>`;actions='<button class="primary" data-act="modalClose">Got it</button>'}else if(modal==='discard'){title='Discard unsaved changes?';desc='Any changes you made in this role editor will be lost.';body='<div class="warn">This is a simulated role editor. Changes are not applied until you save.</div>';actions='<button class="secondary" data-act="modalClose">Keep editing</button><button class="primary" data-act="confirmClose">Discard changes</button>'}else if(modal==='audit'){title='Permission coverage';desc='A traceable mapping of 135 existing permissions. App badges distinguish source coverage from proposed POS modules.';body=`<div class="reviewGrid"><div class="reviewBox"><strong>135 / 135</strong> Original permissions mapped</div><div class="reviewBox"><strong>45 / 45</strong> Reports mapped</div></div><div class="warn" style="margin-bottom:12px">Existing app-specific permissions may differ in capabilities and access levels. A unified permission needs explicit backend mapping and a safe migration. Dashed badges represent proposed POS module access, not verified current permissions.</div>${auditMarkup()}`;actions='<button class="primary" data-act="modalClose">Done</button>'}else{title='Review role changes';desc='Review the permissions for this role before saving.';body=reviewHtml();actions='<button class="secondary" data-act="modalClose">Keep editing</button><button class="primary" data-act="modalSave">Save role</button>'}root.innerHTML=`<div class="modalScrim" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><p>${esc(desc)}</p>${body}<div class="actions">${actions}</div></section></div>`}
function refreshDirty(){const text=document.getElementById('dirtyText');if(text)text.textContent=dirty()?'● Unsaved changes':'● No unsaved changes'}
// Keep the text fields stable while typing; permission changes use delegated events.
document.addEventListener('input',e=>{const id=e.target.id;if(id==='roleName')draft.name=e.target.value;else if(id==='roleDisplay')draft.displayName=e.target.value;else if(id==='roleDescription')draft.description=e.target.value;else if(id==='permSearch'){search=e.target.value;renderOnlyGroups();return}else if(id==='backSearch'){const value=e.target.value.toLowerCase();document.querySelectorAll('[data-row-role]').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(value)?'':'none');return}else return;refreshDirty()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.report){setReport(t.dataset.report,t.checked);return}if(t.dataset.reportgroup){reportBulk(t.dataset.reportgroup,t.checked);return}if(t.dataset.action){draft.actions[t.dataset.action]=t.checked;redraw();return}if(t.dataset.threshold){let n=Number(t.value);draft.thresholds[t.dataset.threshold]=Math.min(100,Math.max(0,isFinite(n)?n:0));redraw();return}});
document.addEventListener('click',e=>{
 const role=e.target.closest('[data-row-role]');if(role&&!open){openEdit(role.dataset.rowRole);return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id,val=b.dataset.value;
 if(a==='newrole'){startNew();return}
 if(a==='close'||a==='scrim'){tryClose();return}
 if(a==='tab'){activeTab=val;search='';expanded='';showCoverage=false;expandedReports.clear();expandedActions.clear();expandedFinder.clear();redraw();return}
 if(a==='focusBack'){expanded='';showCoverage=false;renderAll(false);document.getElementById('drawerScroll').scrollTop=listScroll;return}
 if(a==='expand'){
  if(id!=='allReports'&&!GROUPS[id])return;
  if(expanded===id){expanded='';showCoverage=false;renderAll(false);document.getElementById('drawerScroll').scrollTop=listScroll;}
  else{listScroll=document.getElementById('drawerScroll')?.scrollTop||0;expanded=id;showCoverage=false;renderAll(false);}
  return;
 }
 if(a==='coverageToggle'){showCoverage=!showCoverage;redraw();return}
 if(a==='group'){setGroupLevel(id,val);return}
 if(a==='feature'){setFeature(id,val);return}
 if(a==='toggleAction'){draft.actions[id]=!Boolean(draft.actions[id]);redraw();return}
 if(a==='reportBulk'){reportBulk(id,val==='select');return}
 if(a==='reportsFold'){expandedReports.has(id)?expandedReports.delete(id):expandedReports.add(id);redraw();return}
 if(a==='finderFold'){expandedFinder.has(id)?expandedFinder.delete(id):expandedFinder.add(id);redraw();return}
 if(a==='actionFold'){expandedActions.has(id)?expandedActions.delete(id):expandedActions.add(id);redraw();return}
 if(a==='actionBulk'||a==='actionCategoryBulk'){actionBulk(id,b.dataset.sub||'',val==='select');return}
 if(a==='save'||a==='modalSave'){saveRole();return}
 if(a==='review'||a==='audit'||a==='scope'){modal=a;renderModal();return}
 if(a==='modalClose'){modal='';renderModal();return}
 if(a==='confirmClose'){modal='';open=false;renderAll(false);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';renderModal()}else if(e.key==='Escape'&&open)tryClose();const el=e.target.closest?.('[data-row-role]');if(el&&!open&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openEdit(el.dataset.rowRole)}});
renderAll(false);
</script></body></html>
