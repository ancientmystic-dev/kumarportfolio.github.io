function editorHead(){let g=grp();if(view==='search'||view==='finder'){return `<div class="editorHead"><div class="breadsm">Roles & permissions ${ico('chevron')} ${view==='search'?'Search results':'Report finder'}</div><div class="editorTitleRow"><div class="editorTitle"><h2>${view==='search'?'Find permissions':'All reports'}</h2><p>${view==='search'?'Search across features, reports and actions in every business area.':'Find any existing report, then go straight to its owning business area.'}</p></div><span class="badge blue">${view==='finder'?'45 existing reports':'Cross-category'}</span></div><div class="editorTabs"><button class="editorTab active" data-act="returnEditor">${ico('chevron')} Back to editor</button></div></div>`}
const tabs=tabOptions(g);if(!tabs.some(x=>x.id===tab))tab='overview';return `<div class="editorHead"><div class="breadsm">Roles & permissions ${ico('chevron')} ${h(DATA.areas.find(a=>a.domains.includes(domainId))?.label||'')} ${ico('chevron')}</div><div class="editorTitleRow"><div class="editorTitle"><h2>${h(g.label)}</h2><p>${h(g.subtitle)}</p></div><span class="badge ${getMode(g)==='custom'?'amber':'blue'}">${g.features.length?tagLabel(getMode(g)):g.actions.length?`${actionCount(g)}/${g.actions.length} allowed`:''}</span></div><div class="editorTabs">${tabs.map(t=>`<button class="editorTab ${tab===t.id?'active':''}" data-act="tab" data-id="${t.id}" aria-selected="${tab===t.id}">${h(t.label)}${t.n!==null?`<span class="number">${t.n}</span>`:''}</button>`).join('')}</div></div>`}
function overview(){const g=grp(),features=g.features.length>0,reports=g.reports.length>0,actions=g.actions.length>0;const mixed=features&&getMode(g)==='custom';return `<div class="overviewGrid">${features?`<section class="overviewCard ${!reports&&!actions?'primaryAccess':''}"><div class="topline"><span class="cardTitle">${g.id==='overview'?'Dashboard access':'Business access'}</span><span class="badge ${mixed?'amber':'blue'}">${mixed?'Customized':tagLabel(getMode(g))}</span></div><p class="cardDesc">${g.id==='other'?'This legacy permission needs an engineering definition before production rollout.':`Applies to ${g.features.length} supported feature${g.features.length===1?'':'s'} wherever available. Does not grant reports or special actions.`}</p>${segmented(featuresOpts,getMode(g),'bulkFeature','full')}<div class="miniStats"><span>${featureCount(g)} / ${g.features.length} features enabled</span><button class="rightlink" data-act="tab" data-id="features">Edit individual permissions ${ico('arrow')}</button></div>${mixed?`<p class="sectionCaption">A group-level change replaces individual customizations. We’ll confirm before applying it.</p>`:''}${g.features.some(f=>f.control==='manageonly')?'<p class="sectionCaption">Read-only and Manage-only permissions keep their existing restrictions.</p>':''}</section>`:''}
${reports?`<section class="overviewCard ${!features&&!actions?'primaryAccess':''}"><div class="topline"><span class="cardTitle">Related reports</span><span class="badge">${reportCount(g)} of ${g.reports.length}</span></div><p class="cardDesc">Reporting access is independent. Giving ${h(g.label)} access does not automatically allow any reports.</p><div class="flex" style="gap:7px;flex-wrap:wrap"><button class="button sm ${reportCount(g)===0?'soft':''}" data-act="reportsBulk" data-value="none">No reports</button><button class="button sm ${reportCount(g)===g.reports.length?'soft':''}" data-act="reportsBulk" data-value="all">View all</button></div><div class="miniStats"><button class="rightlink" data-act="tab" data-id="reports">Customize reports ${ico('arrow')}</button></div></section>`:''}
${actions?`<section class="overviewCard ${!features&&!reports?'primaryAccess':''}"><div class="topline"><span class="cardTitle">${g.id==='alerts'?'Register alert subscriptions':'Special actions'}</span><span class="badge ${actionCount(g)===g.actions.length?'blue':''}">${actionCount(g)} of ${g.actions.length} allowed</span></div><p class="cardDesc">${g.id==='alerts'?'Push notification subscriptions are separate from permission to perform the activity.':'Sensitive or workflow-specific actions are granted explicitly, not by business access.'}</p><div class="flex" style="gap:7px;flex-wrap:wrap"><button class="button sm" data-act="actionsBulk" data-value="none">Deny all</button><button class="button sm" data-act="actionsBulk" data-value="all">Allow all</button></div><div class="miniStats"><button class="rightlink" data-act="tab" data-id="actions">${g.id==='alerts'?'Configure alerts':'Review actions'} ${ico('arrow')}</button></div></section>`:''}</div><div class="softpanel"><div class="flex" style="align-items:flex-start">${ico('info')}<div><h3>Why these permissions are together</h3><p>All settings related to ${h(g.label.toLowerCase())} have one home. You can find related reports here without giving them away through a broader operational permission. ${actions?'Special actions keep their own independent on/off settings.':''}</p></div></div></div>${g.id==='products'?`<div style="height:12px"></div><div class="alertBanner">${ico('shield')} Product permissions are unified across supported apps in this concept; app sign-in and clock-in access are outside this editor. Existing app-specific differences require migration review.</div>`:''}${g.id==='other'?`<div style="height:12px"></div><div class="alertBanner amber">${ico('alert')} This is a legacy catch-all. Do not release its configuration until engineering documents which actions it controls.</div>`:''}`}
function featuresView(){const g=grp();let rows=g.features.filter(f=>!detailQuery||`${f.label} ${f.help}`.toLowerCase().includes(detailQuery.toLowerCase()));return `<div class="detailToolbar"><div><h3>Feature permissions</h3><p>Configure each capability without affecting related reports or special actions.</p></div><input class="searchTiny" id="detailSearch" type="search" placeholder="Filter features…" value="${h(detailQuery)}"></div><div class="featureList">${rows.map(f=>{let opts=f.control==='readonly'?[{id:'none',label:'None'},{id:'view',label:'View'}]:f.control==='manageonly'?[{id:'none',label:'None'},{id:'manage',label:'Manage'}]:[{id:'none',label:'None'},{id:'view',label:'View'},{id:'manage',label:'Manage'}];return `<div class="featureRow"><div class="itemLeft"><strong>${h(f.label)}${f.id==='aiApps'?'<span class="badge amber" style="margin-left:8px">Proposed</span>':''}</strong><small>${h(f.help)}</small></div><div class="rowRight">${segmented(opts,getPerm(f.id),'feature:'+f.id,'small')}</div></div>`}).join('')||'<div class="empty">No matching features</div>'}</div>`}
function reportsView(){const g=grp();let rows=g.reports.filter(r=>!detailQuery||`${r.name} ${r.sourceGroup}`.toLowerCase().includes(detailQuery.toLowerCase()));const bySource=Object.groupBy?Object.groupBy(rows,r=>r.sourceGroup):rows.reduce((acc,r)=>{(acc[r.sourceGroup]||=[]).push(r);return acc},{});return `<div class="detailToolbar"><div><h3>${h(g.label)} reports</h3><p>Viewing reports is independent from View or Manage access to ${h(g.label.toLowerCase())}.</p></div><input class="searchTiny" id="detailSearch" type="search" placeholder="Search reports…" value="${h(detailQuery)}"></div><div class="alertBanner">${ico('lock')} Giving someone access to orders or inventory does not automatically give them access to these reports. Select reporting permissions explicitly.</div><div class="flex between" style="margin:16px 0 10px;flex-wrap:wrap"><span class="muted" style="font-size:11px"><strong style="color:var(--ink)">${reportCount(g)} of ${g.reports.length}</strong> reports enabled</span><div class="flex" style="gap:7px"><button class="button sm" data-act="reportsBulk" data-value="none">Clear all</button><button class="button sm soft" data-act="reportsBulk" data-value="all">Select all</button></div></div>${rows.length?`<div class="reportList">${Object.entries(bySource).map(([source,entries])=>`<div class="reportHeader"><strong>${h(source)}</strong><span class="badge">${entries.filter(r=>getReport(r.name)).length}/${entries.length}</span></div>${entries.map(r=>`<label class="reportRow"><div class="itemLeft"><strong>${h(r.name)}${r.review?'<span class="badge amber" style="margin-left:8px">Review mapping</span>':''}</strong>${r.review?'<small>Proposed domain ownership needs PM confirmation.</small>':''}</div><input class="check" type="checkbox" data-act="reportItem" data-id="${h(r.name)}" aria-label="Allow ${h(r.name)}" ${getReport(r.name)?'checked':''}></label>`).join('')}`).join('')}</div>`:'<div class="empty">No matching reports in this category.</div>'}`}
function actionsView(){const g=grp();let rows=g.actions.filter(r=>!detailQuery||`${r.label} ${r.help} ${r.subgroup}`.toLowerCase().includes(detailQuery.toLowerCase()));let groups={};rows.forEach(r=>(groups[r.subgroup]||=[]).push(r));return `<div class="detailToolbar"><div><h3>${g.id==='alerts'?'Alert subscriptions':'Special actions'}</h3><p>${g.id==='alerts'?'Choose which push alerts this role receives.':'These abilities do not automatically follow the group’s View / Manage access.'}</p></div><input class="searchTiny" id="detailSearch" type="search" placeholder="Filter actions…" value="${h(detailQuery)}"></div><div class="flex between" style="margin-bottom:13px;flex-wrap:wrap"><span class="muted" style="font-size:11px"><strong style="color:var(--ink)">${actionCount(g)} of ${g.actions.length}</strong> allowed</span><div class="flex" style="gap:7px"><button class="button sm" data-act="actionsBulk" data-value="none">Deny all</button><button class="button sm soft" data-act="actionsBulk" data-value="all">Allow all</button></div></div><div class="actionList">${Object.entries(groups).map(([cat,items])=>`<div class="actionHeader"><strong>${h(cat)}</strong><span class="badge">${items.filter(x=>getAction(x.id)).length}/${items.length}</span></div>${items.map(a=>`<div class="actionRow"><div class="itemLeft"><strong>${h(a.label)}</strong><small>${h(a.help)}</small>${g.id==='alerts'&&a.id.startsWith('alert')&&(a.id==='alertProductDiscount'||a.id==='alertOrderDiscount')?`<div class="fieldline" style="margin-top:9px"><label for="input-${a.id}" style="color:#8390a6;font-size:10px">Alert above</label><input id="input-${a.id}" class="smallNumber" type="number" min="0" max="100" value="${a.id==='alertProductDiscount'?role().thresholds.product:role().thresholds.order}" data-act="threshold" data-id="${a.id==='alertProductDiscount'?'product':'order'}"> <span class="muted">% discount</span></div>`:''}</div>${toggleAccess(getAction(a.id),'actionItem',a.id,`Allow ${a.label}`)}</div>`).join('')}`).join('')||'<div class="empty">No matching actions.</div>'}</div>`}
function finderView(){const filtered=allReports.filter(name=>!search||`${name} ${DATA.reports[name].sourceGroup} ${DATA.groups[DATA.reports[name].owner].label}`.toLowerCase().includes(search.toLowerCase()));return `<div class="detailToolbar"><div><h3>All 45 original reports</h3><p>Every report has one permission home. Select a result to configure it in its business group.</p></div><span class="badge blue">${filtered.length} found</span></div><div class="alertBanner">${ico('info')} Reports appear within their related areas, but enabling the business module does not automatically enable its reports.</div><div style="height:14px"></div>${filtered.map(n=>{let r=DATA.reports[n],g=DATA.groups[r.owner];return `<button class="linkResult" data-act="goReport" data-id="${h(r.owner)}" data-target="${h(n)}"><span>${ico('report')}</span><span style="flex:1;min-width:0"><strong>${h(n)}</strong><small>${h(g.label)} · Originally: ${h(r.sourceGroup)} ${r.review?'· Ownership to confirm':''}</small></span><span class="badge ${getReport(n)?'green':''}">${getReport(n)?'Allowed':'No access'}</span>${ico('chevron')}</button>`}).join('')||'<div class="empty">No reports found.</div>'}`}
function searchView(){const q=search.trim().toLowerCase();const filt=allItems.filter(x=>(!q||`${x.label} ${x.help||''} ${x.subgroup||''} ${DATA.groups[x.group].label} ${x.sourceGroup||''}`.toLowerCase().includes(q))&&(searchKind==='all'||x.type===searchKind));const display=filt.slice(0,80);return `<div class="detailToolbar"><div><h3>${q?`${filt.length} matching permissions`:'Search the full permission library'}</h3><p>Open a result to edit it in the right business area, regardless of where it came from originally.</p></div></div><div class="flex" style="margin-bottom:14px;flex-wrap:wrap">${[['all','All'],['feature','Features'],['report','Reports'],['action','Actions & alerts']].map(([id,label])=>`<button class="button sm ${searchKind===id?'soft':''}" data-act="searchKind" data-id="${id}">${label}</button>`).join('')}</div>${display.map(x=>`<button class="linkResult" data-act="goResult" data-id="${x.group}" data-type="${x.type}" data-target="${h(x.type==='report'?x.name:x.id)}"><span>${ico(x.type==='report'?'report':x.type==='action'?'shield':'file')}</span><span style="flex:1;min-width:0"><strong>${h(x.label)}</strong><small>${h(DATA.groups[x.group].label)} · ${x.type==='report'?'Report':x.type==='action'?'Special action':'Feature permission'}</small></span><span class="badge ${x.type==='feature'?(getPerm(x.id)==='none'?'':'blue'):x.type==='report'?(getReport(x.name)?'green':''):(getAction(x.id)?'green':'')}">${x.type==='feature'?tagLabel(getPerm(x.id)):x.type==='report'?(getReport(x.name)?'Allowed':'No access'):(getAction(x.id)?'Allowed':'Blocked')}</span>${ico('chevron')}</button>`).join('')||'<div class="empty">No matches. Try “refund”, “sales”, or “customer”.</div>'}${filt.length>80?'<p class="sectionCaption">Showing first 80 results. Narrow your search for more specific matches.</p>':''}`}
function editorContent(){if(view==='search')return searchView();if(view==='finder')return finderView();if(tab==='features')return featuresView();if(tab==='reports')return reportsView();if(tab==='actions')return actionsView();return overview()}
function footer(){const count=getPending().length;return `<footer class="stickyFooter"><div class="footerStatus"><span class="dot ${count?'amber':'green'}"></span><span class="label">${count?`${count} unsaved permission ${count===1?'change':'changes'}`:'All changes saved (browser demo)'}</span><span class="badge">135 source entries mapped</span></div><div class="footBtns"><button class="button sm" data-act="undo" ${!undo.length?'disabled':''}>${ico('undo')} Undo</button><button class="button sm" data-act="discard" ${!count?'disabled':''}>Discard</button><button class="button sm primary" data-act="review" ${!count?'disabled':''}>Review & save ${count?`<span style="background:#fff3;padding:1px 6px;border-radius:4px">${count}</span>`:''}</button></div></footer>`}
function render(reset=true){const node=document.getElementById('root'),scrollPane=document.querySelector('.editorContent'),oldScroll=scrollPane?.scrollTop||0,focused=document.activeElement?.id||'';node.innerHTML=`<div class="shell">${topRail()}<div class="main">${topBar()}${pageHead()}<div class="workspace">${categories()}<div class="editorPane">${mobileNav()}${editorHead()}<div class="editorContent">${editorContent()}</div></div></div>${footer()}</div></div>`;requestAnimationFrame(()=>{const el=document.querySelector('.editorContent');if(el&&!reset)el.scrollTop=oldScroll;if(focused==='globalSearch'||focused==='detailSearch'){const n=document.getElementById(focused);n?.focus();if(n?.setSelectionRange)try{n.setSelectionRange(n.value.length,n.value.length)}catch(_){} }});renderOverlay()}
function overlayHeader(title,desc){return `<div class="dialogHeader"><div><h2>${h(title)}</h2>${desc?`<p>${h(desc)}</p>`:''}</div><button class="iconBtn" data-act="closeModal" aria-label="Close">${ico('close')}</button></div>`}
function overlayFooter(content){return `<div class="dialogFooter">${content}</div>`}
function overlayContent(){if(!modal)return '';const type=modal.type;let title='',desc='',body='',footer='',center=true;
if(type==='review'){center=false;title='Review role changes';desc=`${getPending().length} changes · ${role().assigned} employees assigned to this role`;const changes=getPending();body=`<div class="alertBanner amber">${ico('info')} Saving updates this role for all ${role().assigned} assigned employees. This is a local prototype; no live access changes occur.</div><div class="summaryList"><div class="summaryTile"><strong>${changes.length}</strong><small>Permission changes</small></div><div class="summaryTile"><strong>${new Set(changes.map(x=>x.owner)).size}</strong><small>Groups affected</small></div><div class="summaryTile"><strong>${role().assigned}</strong><small>Employees affected</small></div></div><h3 style="font-size:13px;margin:21px 0 5px">Changes to review</h3>${changes.map((x,i)=>`<div class="changeEntry"><div><strong>${h(x.label)}</strong><small>${h(x.owner?DATA.groups[x.owner].label:'Role details')} · ${h(x.type)}</small><span class="reviewDiff"><span class="from">${h(tagLabel(x.before))}</span>${ico('arrow')}<span class="to">${h(tagLabel(x.after))}</span></span></div><button class="button sm" data-act="revertChange" data-idx="${i}">Revert</button></div>`).join('')}`;footer=`<button class="button" data-act="closeModal">Continue editing</button><button class="button primary" data-act="save" ${changes.length?'':'disabled'}>Confirm save</button>`;}
else if(type==='bulkConfirm'){title='Replace customized permissions?';desc=`${grp().label} has individual access levels.`;body=`<p>Setting the group to <strong>${h(tagLabel(modal.level))}</strong> will update its supported feature permissions. Related reports and special actions will remain unchanged.</p><div style="height:12px"></div><div class="alertBanner">${ico('info')} You can undo this change before saving.</div>`;footer=`<button class="button" data-act="closeModal">Cancel</button><button class="button primary" data-act="confirmBulk">Apply to group</button>`}
else if(type==='actionsConfirm'){title='Allow all special actions?';desc=`This will enable ${grp().actions.length} actions in ${grp().label}.`;body=`<div class="alertBanner amber">${ico('alert')} This category may contain discounts, refunds, bypasses, cash drawer controls, or alert subscriptions. Check that this role needs them all.</div>`;footer=`<button class="button" data-act="closeModal">Cancel</button><button class="button primary" data-act="confirmActions">Allow all</button>`}
else if(type==='discard'){title='Discard your edits?';desc='Unsaved role changes will be lost.';body='<p>Any changes made since the last save will be discarded.</p>';footer='<button class="button" data-act="closeModal">Continue editing</button><button class="button danger" data-act="confirmDiscard">Discard changes</button>'}
else if(type==='switch'){title='Switch roles without saving?';desc='There are unsaved edits in the current role.';body='<p>You can keep editing the current role or discard these edits before switching.</p>';footer='<button class="button" data-act="closeModal">Keep editing</button><button class="button danger" data-act="confirmSwitch">Discard and switch</button>'}
else if(type==='editRole'){title='Role details';desc='Update the role name or description.';body=`<div class="formField"><label for="editName">Role name</label><input id="editName" maxlength="70" value="${h(role().name)}"></div><div class="formField"><label for="editDesc">Description</label><textarea id="editDesc" rows="3">${h(role().description)}</textarea></div>`;footer='<button class="button" data-act="closeModal">Cancel</button><button class="button primary" data-act="confirmRole">Apply details</button>'}
else if(type==='audit'){title='Existing permission inventory';desc='135 current entries mapped to the new business-first configuration.';center=false;const pairs=DATA.legacy.map((x,i)=>{let group=x.kind==='report'?DATA.reports[x.label]?.owner:Object.values(DATA.groups).find(g=>g.features.some(f=>f.id===x.key)||g.actions.some(a=>a.id===x.key))?.id;return {i,app:x.app,section:x.section,label:x.label,group:group||'other'}});body=`<div class="flex" style="flex-wrap:wrap;margin-bottom:11px"><span class="badge green">135 / 135 accounted for</span><span class="badge">50 Back Office</span><span class="badge">45 reports</span><span class="badge">21 register</span><span class="badge">19 OctoYard</span></div><div class="alertBanner">${ico('info')} This is a design traceability map, not a verified backend authorization migration. Shared permission behavior must be validated before shipping.</div><div style="margin-top:14px;overflow:auto"><table class="auditTable"><thead><tr><th>Current app</th><th>Current permission</th><th>New group</th></tr></thead><tbody>${pairs.map(x=>`<tr><td>${h(x.app)}</td><td>${h(x.label)}<small style="display:block;color:#93a0b2">${h(x.section)}</small></td><td>${h(DATA.groups[x.group]?.label||'Needs review')}</td></tr>`).join('')}</tbody></table></div>`;footer='<button class="button primary" data-act="closeModal">Done</button>'}
else if(type==='restoreDemo'){title='Restore example roles?';desc='This resets your local prototype data.';body='<p>All saved demo edits will be replaced with the original Store Manager, Cashier and Stock Associate examples.</p>';footer='<button class="button" data-act="closeModal">Cancel</button><button class="button danger" data-act="confirmRestore">Restore examples</button>'}
return `<div class="overlay ${center?'center':''}" data-act="outside"><div class="${center?'modal':'drawer'}" role="dialog" aria-modal="true" aria-label="${h(title)}">${overlayHeader(title,desc)}<div class="dialogBody">${body}</div>${overlayFooter(footer)}</div></div>`;
}
function renderOverlay(){document.getElementById('overlayRoot').innerHTML=overlayContent()}
function applyPendingRevert(x){if(x.type==='feature')role().perms[x.id]=saved[roleId].perms[x.id]||'none';else if(x.type==='action')role().actions[x.id]=!!saved[roleId].actions[x.id];else if(x.type==='report'){let set=new Set(role().reports);saved[roleId].reports.includes(x.id)?set.add(x.id):set.delete(x.id);role().reports=[...set]}else if(x.type==='threshold')role().thresholds[x.id.split('-')[1]]=saved[roleId].thresholds[x.id.split('-')[1]];else if(x.id==='roleName')role().name=saved[roleId].name;else if(x.id==='roleDesc')role().description=saved[roleId].description}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,id=b.dataset.id,val=b.dataset.value;
if(a==='outside'){if(e.target===b){modal=null;renderOverlay()}return}
if(a==='navDummy'){toast('Prototype navigation stays within Roles & permissions.');return}
if(a==='navDomain'){nav(id);return}
if(a==='tab'){tab=id;detailQuery='';render();return}
if(a==='returnEditor'){view='editor';search='';render();return}
if(a==='allReports'){openReportFinder();return}
if(a==='audit'){modal={type:'audit'};renderOverlay();return}
if(a==='searchKind'){searchKind=id;render(false);return}
if(a==='goReport'||a==='goResult'){domainId=id;tab=a==='goReport'?'reports':b.dataset.type==='feature'?'features':b.dataset.type==='action'?'actions':'reports';detailQuery=a==='goReport'?b.dataset.target:(b.dataset.type==='report'?b.dataset.target:'');view='editor';search='';render();return}
if(a==='bulkFeature'){setBulkFeatures(val);return}
if(a.startsWith('feature:')){toggleFeature(a.slice(8),val);return}
if(a==='reportsBulk'){bulkReports(val==='all');return}
if(a==='actionsBulk'){bulkActions(val==='all');return}
if(a==='undo'){if(undo.length){roles[roleId]=undo.pop();render();toast('Last edit undone.')}return}
if(a==='discard'){modal={type:'discard'};renderOverlay();return}
if(a==='review'){modal={type:'review'};renderOverlay();return}
if(a==='save'){save();return}
if(a==='closeModal'){modal=null;renderOverlay();return}
if(a==='confirmBulk'){const lvl=modal.level;modal=null;applyBulkFeatures(lvl);return}
if(a==='confirmActions'){modal=null;applyBulkActions(true);return}
if(a==='confirmDiscard'){roles[roleId]=clone(saved[roleId]);undo=[];modal=null;render();toast('Unsaved edits discarded.');return}
if(a==='confirmSwitch'){const target=modal.target;roles[roleId]=clone(saved[roleId]);undo=[];modal=null;roleId=target;domainId='sales';tab='overview';view='editor';search='';render();return}
if(a==='editRole'){modal={type:'editRole'};renderOverlay();return}
if(a==='confirmRole'){const name=document.getElementById('editName')?.value.trim(),desc=document.getElementById('editDesc')?.value.trim();if(!name){toast('Role name is required.');return}mark();role().name=name;role().description=desc;modal=null;render();return}
if(a==='revertChange'){const x=getPending()[Number(b.dataset.idx)];if(x){mark();applyPendingRevert(x)}render();modal={type:'review'};renderOverlay();return}
if(a==='restoreDemo'){modal={type:'restoreDemo'};renderOverlay();return}
if(a==='confirmRestore'){saved=defaultRoles();roles=clone(saved);try{localStorage.removeItem(STORAGE_KEY)}catch(e){}undo=[];modal=null;domainId='sales';tab='overview';view='editor';render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){search=e.target.value;view=search?'search':'editor';const node=document.querySelector('.editorPane');if(node)node.innerHTML=mobileNav()+editorHead()+`<div class="editorContent">${editorContent()}</div>`;return}if(e.target.id==='detailSearch'){detailQuery=e.target.value;const content=document.querySelector('.editorContent');if(content){let was=content.scrollTop;content.innerHTML=editorContent();content.scrollTop=was;let el=document.getElementById('detailSearch');el?.focus();try{el?.setSelectionRange(el.value.length,el.value.length)}catch(_){} }return}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='rolePick'){doSwitch(t.value);return}if(t.id==='mobileDomain'){t.value==='allReports'?openReportFinder():nav(t.value);return}if(t.dataset.act==='reportItem'){toggleReport(t.dataset.id,t.checked);return}if(t.dataset.act==='actionItem'){toggleAction(t.dataset.id,t.checked);return}if(t.dataset.act==='threshold'){const k=t.dataset.id,v=Math.max(0,Math.min(100,Number(t.value)||0));mutate(()=>role().thresholds[k]=v);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderOverlay();return}if((e.metaKey||e.ctrlKey)&&e.key==='z'&&undo.length&&!modal){e.preventDefault();roles[roleId]=undo.pop();render();toast('Last edit undone.')}});
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
render();
</script>
</body></html>
