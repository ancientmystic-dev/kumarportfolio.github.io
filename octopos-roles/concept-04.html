function searchPanel(){const found=ALL.filter(matches),filtered=found.filter(p=>searchScope==='all'||p.app===searchScope);return `<section class="searchpage" aria-label="Permission search results"><header class="searchheader"><div class="detailtitle"><h2>${filtered.length} ${filtered.length===1?'result':'results'} for “${e(query.trim())}”</h2><button class="btn text compact" data-act="clearSearch">Exit search ${ic('close')}</button></div><p>Each result shows its scope. Editing one result never changes another application's permission.</p><div class="facets">${[{id:'all',name:'All results'},...APPS,...(found.some(p=>p.app==='proposal')?[{id:'proposal',name:'Design proposals'}]:[])].map(a=>`<button class="facet ${searchScope===a.id?'active':''}" data-act="searchScope" data-id="${a.id}">${e(a.name)} <span class="muted">${a.id==='all'?found.length:found.filter(p=>p.app===a.id).length}</span></button>`).join('')}</div></header><div class="results" id="permissionScroll">${filtered.length?filtered.map(p=>row(p,{result:true})).join(''):`<div class="empty">${ic('search')}<strong>No matching permissions</strong><p>Try “refund”, “product”, “cash drawer” or an original permission name.</p><button class="btn" data-act="clearSearch">Back to permissions</button></div>`}</div></section>`;}
function shell(){const cc=changes();return `<div class="shell"><aside class="apprail"><div class="brand"><span class="logomark"></span>octopos</div><div class="eyebrow">Maple Street Market</div>${[['grid','Dashboard'],['users','Human Resources'],['package','Products'],['receipt','Sales'],['truck','Purchasing'],['chart','Reports'],['settings','Settings']].map(([icon,t])=>`<button class="navitem ${t==='Human Resources'?'selected':''}" data-act="placeholder">${ic(icon)}<span>${t}</span></button>${t==='Human Resources'?'<div class="navsub">Roles & permissions</div>':''}`).join('')}<div class="profile"><div class="avatar">AM</div><div class="copy"><strong>Alex Morgan</strong><small>Store administrator</small></div></div></aside><main class="main"><div class="topbar"><div class="breadcrumbs"><span>Human Resources</span><span>›</span><span>Roles & permissions</span></div><div class="topright"><span class="version">CONCEPT 04</span><button class="iconbtn" data-act="notes" aria-label="About this prototype">${ic('info')}</button><div class="avatar">AM</div></div></div><header class="pagehead"><div class="headrow"><div><div class="titleline"><h1>Edit role</h1><select id="rolePicker" class="rolepicker" aria-label="Choose example role">${Object.keys(roles).map(id=>`<option value="${id}" ${id===roleId?'selected':''}>${e(roles[id].name)}</option>`).join('')}</select></div><p class="muted">${role().assigned} employees assigned <span style="padding:0 5px">·</span> <button class="editdetails" data-act="details">Edit role details</button></p></div><div class="headingbuttons"><button class="btn previewbtn" data-act="preview">${ic('eye')} Preview access</button><button class="btn" data-act="notes">${ic('shield')}<span>Coverage & notes</span></button></div></div><div class="controlsrow"><nav class="scopetabs" role="tablist" aria-label="Permission scope">${APPS.map(a=>`<button role="tab" aria-selected="${!query&&app===a.id}" class="scopetab ${!query&&app===a.id?'active':''}" data-act="app" data-id="${a.id}" data-focus="app-${a.id}">${ic(a.icon)} ${a.name} ${PERMS.some(p=>p.app===a.id&&hasRowChange(p))?'<span class="dot changed" title="Unsaved changes"></span>':''}</button>`).join('')}</nav><label class="searchbox">${ic('search')}<input id="globalSearch" type="search" autocomplete="off" value="${e(query)}" placeholder="Search across all permissions…" aria-label="Search across all permissions">${query?'<button type="button" class="clearSearch" data-act="clearSearch" aria-label="Clear search">×</button>':'<span class="key">⌘ K</span>'}</label></div></header><div class="workarea" id="workspace">${query.trim()?searchPanel():categoryPanel()}</div><footer class="footer"><div class="savestatus"><span class="dot ${cc.length?'changed':''}"></span><span>${cc.length?`<strong>${cc.length} unsaved ${cc.length===1?'change':'changes'}</strong> · ${e(role().name)}`:'All changes saved'}</span><span class="localhint">Demo · saved in this browser</span></div><div class="savebuttons">${undoStack.length?'<button class="btn text undoBtn" data-act="undo">'+ic('undo')+' Undo</button>':''}<button class="btn danger" data-act="discard" ${!cc.length?'disabled':''}>Discard</button><button class="btn primary" data-act="review" ${!cc.length?'disabled':''}>Review & save${cc.length?' <span>('+cc.length+')</span>':''} ${ic('arrow')}</button></div></footer></main></div>`;}
function updateMixed(){document.querySelectorAll('input[data-mixed]').forEach(x=>x.indeterminate=x.dataset.mixed==='true')}
function render(resetScroll=false){const active=document.activeElement;const focusKey=active?.dataset?.focus;const isSearch=active?.id==='globalSearch';const caret=isSearch?active.selectionStart:null;const scr=$('#permissionScroll')?.scrollTop||0;const navScr=$('.catlist')?.scrollTop||0;$('#root').innerHTML=shell();updateMixed();if(!resetScroll){if($('#permissionScroll'))$('#permissionScroll').scrollTop=scr;if($('.catlist'))$('.catlist').scrollTop=navScr;}if(dialog)renderDialog(false);if(isSearch){$('#globalSearch').focus();try{$('#globalSearch').setSelectionRange(caret,caret)}catch(_){}}else if(focusKey){document.querySelector(`[data-focus="${CSS.escape(focusKey)}"]`)?.focus({preventScroll:true})}}
function appChange(id){if(!APP[id])return;categoryMemory[app]=category;app=id;category=categoryMemory[id]||CAT_ORDER[id][0];query='';searchScope='all';rowFilter='all';helpId=null;render(true);}

function reviewBody(){const diffs=changes(),sensitive=diffs.filter(x=>!x.details&&x.p.sensitive&&enabled(x.p));return `<div class="note" style="margin:0 0 18px">${ic('users')}<span>Saving updates the <strong>${e(role().name)}</strong> example role for <strong>${role().assigned} assigned employees</strong>. This demo does not change production access.</span></div>${sensitive.length?`<div class="note warn">${ic('shield')}<span>${sensitive.length} changed ${sensitive.length===1?'permission is':'permissions are'} sensitive. Review the resulting access below.</span></div>`:''}${[...APPS,{id:'proposal',name:'Design proposal only'}].map(a=>{const list=diffs.filter(x=>x.p?.app===a.id);return list.length?`<h3>${a.name}</h3>${list.map(x=>`<div class="reviewrow"><div class="copy"><small>${e(x.p.category)}</small><strong>${e(x.p.name)}</strong><div class="diff"><span class="before">${label(x.p,x.before)}</span>${ic('arrow')}<span class="after">${label(x.p,x.after)}</span></div>${x.threshold&&role().thresholds[x.threshold]!==original().thresholds[x.threshold]?`<div class="diff">Threshold: ${original().thresholds[x.threshold]}% → ${role().thresholds[x.threshold]}%</div>`:''}</div><button class="iconbtn" data-act="undoOne" data-id="${x.p.id}" aria-label="${e('Undo change to '+x.p.name)}">${ic('undo')}</button></div>`).join('')}`:''}).join('')}${diffs.some(x=>x.details)?`<h3>Role details</h3><div class="reviewrow"><div class="copy"><strong>${e(role().name)}</strong><small>${e(role().description)}</small></div><button class="iconbtn" data-act="undoDetails" aria-label="Undo role details">${ic('undo')}</button></div>`:''}${!diffs.length?'<div class="empty"><strong>No unsaved changes</strong><p>Everything matches the saved role.</p></div>':''}`;}
function notesBody(){return `<h3>A focused alternative to V3</h3><div class="noteitem"><strong>Keep scope. Reduce navigation effort.</strong><p>Application tabs are navigation, not access switches. Categories remain visible while only one short permission list is shown. Editing a permission here never changes the same feature in a different application.</p></div><table class="coverage"><thead><tr><th>Original source</th><th>Preserved entries</th></tr></thead><tbody>${APPS.map(a=>`<tr><td>${a.name}</td><td>${PERMS.filter(p=>p.app===a.id).length}</td></tr>`).join('')}<tr><td><strong>Total</strong></td><td>135 / 135</td></tr></tbody></table><button class="btn" data-act="audit">${ic('search')} Inspect permission inventory</button><div class="line"></div><div class="noteitem"><strong>What is deliberately unchanged</strong><p>Original permission labels, category membership, app boundaries and supported levels are retained. Read remains Read; no extra powers are inferred from a simplified label. Notifications remain separate from actions.</p></div><div class="noteitem"><strong>A different policy direction, not a silent V3 update</strong><p>V3 has unified business permissions. This concept preserves existing independent app permissions and does not migrate V3 roles. Back Office and OctoYard product permissions are stored separately.</p></div><div class="noteitem"><strong>Prototype values are illustrative</strong><p>Store Manager, Cashier and Stock Associate are example roles, not imported production grants. Device sign-in, attendance and checkout eligibility are outside this editor. Backend enforcement is not implemented.</p></div><h3>V3-only proposal · retained for review</h3><p class="muted" style="font-size:11px;margin-bottom:8px">Inventory visibility was added in V3, not in the screenshots. It stays separate until its app scope and backend mapping are agreed.</p>${row(PROPOSAL)}<div class="note warn">${ic('info')}<span>Other is intentionally retained until its scope is understood. AI assistants is still Proposed. Edit Employees Work-time remains in Reports exactly as in the source, without a read-only assumption.</span></div><div class="line"></div><button class="btn danger" data-act="resetExamples">Reset sample roles</button><p class="muted" style="font-size:10px;margin-top:9px">Only clears this prototype's saved demo roles.</p>`;}
function previewBody(){return `<div class="note" style="margin:0 0 18px">${ic('info')}<span>This is a summary of selected permissions—not a backend-computed authorization check. Login, attendance and checkout eligibility are not modeled.</span></div>${APPS.map(a=>{const rows=PERMS.filter(p=>p.app===a.id),active=rows.filter(enabled);return `<details class="previewlist" open><summary>${a.name} <span class="muted">· ${active.length} of ${rows.length} enabled</span></summary>${CAT_ORDER[a.id].map(c=>{const list=active.filter(p=>p.category===c);return list.length?`<p><strong>${e(c)}</strong><br>${list.map(p=>e(p.name)+(p.kind==='binary'?'':` (${label(p,current(p.id))})`)).join(', ')}</p>`:''}).join('')||'<p>No feature permissions selected. This is not a login restriction.</p>'}</details>`}).join('')}`;}
function auditItems(needle=''){const q=needle.toLowerCase();return PERMS.filter(p=>[p.name,p.category,p.appOriginal].join(' ').toLowerCase().includes(q)).map(p=>`<div class="auditrow"><strong>${e(p.name)}</strong><small>${e(p.appOriginal)} → ${e(p.category)}</small><small>${p.kind==='binary'?'Binary on / off':options(p).map(v=>label(p,v)).join(' / ')} · V3: ${e(p.v3Group)}</small><small>Source: ${e(p.source)}</small></div>`).join('')||'<p class="muted">No matching source permissions.</p>';}
function renderDialog(focus=true){if(!dialog){$('#overlayMount').innerHTML='';return;}let title='',sub='',body='',foot='',center=false;
 if(dialog==='review'){title='Review changes';sub=`${changes().length} changes to ${role().name}`;body=reviewBody();foot=`<button class="btn" data-act="close">Keep editing</button><button class="btn primary" data-act="commit" ${!dirty()?'disabled':''}>${ic('check')} Save ${changes().length} changes</button>`;}
 else if(dialog==='notes'){title='Coverage & design notes';sub='Concept 04 · original app-scoped permissions';body=notesBody();foot='<button class="btn primary" data-act="close">Back to editor</button>';}
 else if(dialog==='preview'){title='Selected access';sub=role().name+' · '+role().assigned+' assigned employees';body=previewBody();foot='<button class="btn primary" data-act="close">Done</button>';}
 else if(dialog==='audit'){title='Permission inventory';sub='135 original entries + 1 separate V3 proposal';body=`<div class="field"><label for="auditSearch">Find an original permission</label><input id="auditSearch" placeholder="Search name, category or application"></div><div id="auditRows">${auditItems()}</div>`;foot='<button class="btn" data-act="notes">Design notes</button><button class="btn primary" data-act="close">Done</button>';}
 else if(dialog==='details'){title='Edit role details';sub='These changes apply to the role, not one employee.';body=`<div class="field"><label for="roleName">Role name</label><input id="roleName" maxlength="70" value="${e(role().name)}"></div><div class="field"><label for="roleDesc">Description</label><textarea id="roleDesc">${e(role().description)}</textarea></div><p class="muted">${role().assigned} employees assigned in this example.</p>`;foot='<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="applyDetails">Apply to draft</button>';}
 else if(dialog==='discard'){center=true;title='Discard unsaved changes?';body='<p>Your last saved role configuration will be restored. This does not affect the other example roles.</p>';foot='<button class="btn" data-act="close">Keep editing</button><button class="btn danger" data-act="confirmDiscard">Discard changes</button>';}
 else if(dialog==='switch'){center=true;title='You have unsaved changes';body=`<p>Finish editing ${e(role().name)} or discard its draft before switching roles.</p>`;foot='<button class="btn" data-act="close">Keep editing</button><button class="btn danger" data-act="confirmSwitch">Discard & switch</button>';}
 else if(dialog==='reset'){center=true;title='Reset the demo?';body='<p>This restores all three example roles and clears this prototype’s local saved changes. Other prototypes are unaffected.</p>';foot='<button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="confirmReset">Reset examples</button>';}
 else if(dialog==='bulkConfirm'){center=true;title='Enable sensitive permissions?';body=`<p>This category update enables ${payload.risks.length} sensitive ${payload.risks.length===1?'permission':'permissions'} in <strong>${e(APP[app].name)} → ${e(category)}</strong>.</p><ul>${payload.risks.map(p=>`<li>${e(p.name)}</li>`).join('')}</ul><p>The update stays in your draft until you review and save it.</p>`;foot='<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="confirmBulk">Apply to this category</button>';}
 const old=$('.drawercontent')?.scrollTop||0;$('#overlayMount').innerHTML=`<div class="overlay ${center?'modalcenter':''}" data-overlay="true"><section class="${center?'dialog':'drawer'}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">${center?`<div class="dialogbody"><h2 id="dialogTitle">${title}</h2>${body}</div><div class="dialogfooter">${foot}</div>`:`<div class="drawerhead"><div><h2 id="dialogTitle">${title}</h2><p>${sub}</p></div><button class="iconbtn" data-act="close" aria-label="Close dialog">${ic('close')}</button></div><div class="drawercontent">${body}</div><div class="drawerfoot">${foot}</div>`}</section></div>`;if(!focus&&$('.drawercontent'))$('.drawercontent').scrollTop=old;updateMixed();if(focus)setTimeout(()=>document.querySelector('[role=dialog] button, [role=dialog] input')?.focus(),0);}
function doBulk(value,confirmed=false){const items=catItems();if(rowFilter!=='all')return;let updates=[],skipped=0;for(const p of items){let v=value;if(p.kind==='binary')v=value===true;else if(value==='manage'&&p.kind==='readonly')v='view';else if(value==='view'&&p.kind==='manageonly'){skipped++;continue;}if(options(p).includes(v)&&current(p.id)!==v)updates.push({p,v});}if(!updates.length){notify(skipped?'Write-only permissions left unchanged.':'This category already has that access.');return}const risks=updates.filter(x=>x.p.sensitive&&(x.v===true||x.v==='manage')).map(x=>x.p);if(risks.length&&!confirmed){render();openDialog('bulkConfirm',{value,risks});return}saveHistory();for(const x of updates)role().values[x.p.id]=x.v;closeDialog();render();notify(`${updates.length} permissions updated in ${APP[app].name} only.${skipped?' Write-only permission unchanged.':''}`,true);}
function commit(){if(!dirty())return;try{const saved=clone(baseline);saved[roleId]=clone(role());localStorage.setItem(STORAGE,JSON.stringify({schema:1,roles:saved}));baseline[roleId]=clone(role());undoStack=[];closeDialog();render();notify('Saved in this browser. No production permissions changed.')}catch(_){notify('Browser storage is unavailable. Your draft is still here; it has not been saved.',false,'warning');}}
function switchRole(id){if(!roles[id]||id===roleId)return;if(dirty()){openDialog('switch',{role:id});$('#rolePicker').value=roleId;return}roleId=id;undoStack=[];render();}
function locate(id){const p=BY_ID[id];if(p.app==='proposal'){query='';render();openDialog('notes');return}query='';searchScope='all';app=p.app;category=p.category;categoryMemory[app]=category;rowFilter='all';render(true);requestAnimationFrame(()=>{const el=document.querySelector(`[data-row="${id}"]`);el?.classList.add('highlight');el?.scrollIntoView({block:'center',behavior:'smooth'});el?.querySelector('button,input')?.focus({preventScroll:true})});}
document.addEventListener('click',ev=>{if(ev.target.dataset.overlay){closeDialog();return}const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.value;if(['binary','bulkcheck','threshold','mobileCategory'].includes(a))return;
 if(a==='app')appChange(id);else if(a==='category')chooseCategory(id);else if(a==='level')editPermission(id,v);else if(a==='bulk')doBulk(v==='true'?true:v==='false'?false:v);else if(a==='confirmBulk'){const val=payload.value;doBulk(val,true)}else if(a==='help'){helpId=helpId===id?null:id;render()}else if(a==='jumpYard'){appChange('yard');chooseCategory('Products & labels')}else if(a==='clearFilter'){rowFilter='all';render(true)}else if(a==='clearSearch')clearSearch();else if(a==='searchScope'){searchScope=id;render(true)}else if(a==='locate')locate(id);else if(['notes','audit','preview','details','review'].includes(a))openDialog(a);else if(a==='close')closeDialog();else if(a==='discard')openDialog('discard');else if(a==='confirmDiscard'){roles[roleId]=clone(original());undoStack=[];closeDialog();render();notify('Unsaved changes discarded.')}else if(a==='confirmSwitch'){const target=payload.role;roles[roleId]=clone(original());roleId=target;undoStack=[];closeDialog();render();}else if(a==='commit')commit();else if(a==='undo'){if(undoStack.length){roles[roleId]=undoStack.pop();render();notify('Last edit undone.')}}else if(a==='undoOne'){saveHistory();role().values[id]=original().values[id];const t=thresholdKey(BY_ID[id]);if(t)role().thresholds[t]=original().thresholds[t];render();}else if(a==='undoDetails'){saveHistory();role().name=original().name;role().description=original().description;render();}else if(a==='applyDetails'){const name=$('#roleName').value.trim();if(!name){$('#roleName').setCustomValidity('Enter a role name.');$('#roleName').reportValidity();return}saveHistory();role().name=name;role().description=$('#roleDesc').value.trim();closeDialog();render();}else if(a==='resetExamples')openDialog('reset');else if(a==='confirmReset'){roles=clone(DATA.roles);baseline=clone(roles);roleId='manager';undoStack=[];try{localStorage.removeItem(STORAGE)}catch(_){}closeDialog();render();notify('Example roles restored.')}else if(a==='placeholder')notify('This prototype focuses on Roles & permissions.');
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='globalSearch'){query=t.value;searchScope='all';render(true)}else if(t.id==='auditSearch')$('#auditRows').innerHTML=auditItems(t.value);else if(t.id==='roleName')t.setCustomValidity('')});
document.addEventListener('change',ev=>{const t=ev.target,a=t.dataset.act;if(t.id==='rolePicker'){switchRole(t.value);return}if(t.id==='rowFilter'){rowFilter=t.value;render(true);return}if(a==='mobileCategory'){chooseCategory(t.value);return}if(a==='binary'){editPermission(t.dataset.id,t.checked);return}if(a==='bulkcheck'){doBulk(!stats(catItems()).all);return}if(a==='threshold'){const p=BY_ID[t.dataset.id],key=thresholdKey(p),val=Number(t.value);if(!Number.isFinite(val)||val<0||val>100||t.value.trim()===''){t.value=role().thresholds[key];notify('Enter a percentage between 0 and 100.',false,'warning');return}if(role().thresholds[key]!==val){saveHistory();role().thresholds[key]=val;render()}}});
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'&&!dialog){ev.preventDefault();$('#globalSearch').focus();$('#globalSearch').select()}if(ev.key==='Escape'){if(dialog)closeDialog();else if(query)clearSearch();}if(dialog&&ev.key==='Tab'){const focusables=[...document.querySelectorAll('[role=dialog] button:not(:disabled),[role=dialog] input:not(:disabled),[role=dialog] select,[role=dialog] textarea,[role=dialog] summary')];if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(ev.shiftKey&&(document.activeElement===first||!focusables.includes(document.activeElement))){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&(document.activeElement===last||!focusables.includes(document.activeElement))){ev.preventDefault();first.focus()}}if(ev.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(ev.key)){ev.preventDefault();let i=APPS.findIndex(a=>a.id===app);i=ev.key==='Home'?0:ev.key==='End'?APPS.length-1:(i+(ev.key==='ArrowRight'?1:-1)+APPS.length)%APPS.length;appChange(APPS[i].id);document.querySelector(`[data-act=app][data-id=${APPS[i].id}]`)?.focus()}});

for(const [a,n]of Object.entries({bo:50,reports:45,pos:21,yard:19}))if(PERMS.filter(p=>p.app===a).length!==n)throw Error('Source count mismatch');
window.prototypeAudit=()=>({originalEntries:PERMS.length,byApp:Object.fromEntries(APPS.map(a=>[a.id,PERMS.filter(p=>p.app===a.id).length])),v3Proposal:PROPOSAL.name,allIndependent:new Set(PERMS.map(p=>p.id)).size===135,changes:changes().length});
