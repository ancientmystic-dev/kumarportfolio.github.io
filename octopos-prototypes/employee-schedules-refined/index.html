ew needed':'Attendance flag'}">${icon('alert',12)}</span>`:good?`<span class="calBarOkay" title="Recorded">${icon('check',12)}</span>`:''}</button>`}).join('');const label=`<button class="calDayLabel" data-act="openDay" data-day="${day}"><span class="calDateCircle${isToday(day)?' today':''}">${parseDay(day).getDate()}</span><span class="calDayWords"><strong>${dayName(day)}</strong><small>${closed?'Store closed':`${uniqCount(all)} scheduled`}</small></span>${gaps.length&&!closed?`<span class="calTinyWarning" title="${gaps.map(g=>fmtTime(g.start)+'–'+fmtTime(g.end)).join(', ')}">${icon('alert',13)}</span>`:''}</button>`;return `<div class="calWeekRow"><div class="calWeekDay">${label}${closed?`<span class="calClosedMini">${icon('lock',12)} Store closed</span>`:''}</div><div class="calWeekTime" style="height:${h}px">${timelineGrid(b)}${shades}${now}${closed?`<span class="calClosedLane">Store closed · ${escapeHTML(S.closures.find(c=>c.date===day)?.name||'Scheduled closure')}</span>`:''}${grouphtml}${!gs.length&&!closed?`<button class="calEmptyDay" data-act="addShift" data-day="${day}">${icon('plus',13)} Add shift</button>`:''}</div></div>`}).join('');return `<div class="calIntro"><div><b>Week timeline</b><span>One bar per shift group · Select a day to see each employee</span></div><span class="calLegend"><i class="legendChip"></i>Scheduled <i class="legendChip one"></i>One-time <i class="legendChip past"></i>Past</span></div><div class="calWrap"><div class="calWeekAxis"><div class="calWeekAxisSide">DAY</div>${timelineAxis(b)}</div>${dayRows}</div><div class="calFoot"><span>${icon('info',13)} Light red areas show time with no scheduled coverage during store hours. Breaks do not affect coverage.</span><button class="btn ghost small" data-act="view" data-val="overview">See weekly summary ${icon('chevRight',13)}</button></div>`}

function dayView(){const day=S.day,sh=visibleShifts(day);if(S.scenario==='empty')return emptyPanel('No schedules to show','Set employees’ usual working hours in Employees → Shift Details to start planning.','Go to Employees','employees');if(!visiblePeople().length)return emptyPanel('No employees found','Try another name or clear your role filter.','Clear filters','clearFilters');const b=timelineBounds(day),closed=hasClosure(day),people=visiblePeople();const groups=groupOf(sh),gaps=gapList(day,S.role||null),timeWidth=b.end-b.start;const gapStr=closed?'':gaps.map(g=>`<span class="calGap" style="left:${timePct(g.start,b)}%;width:${timePct(g.end,b)-timePct(g.start,b)}%"></span>`).join('');const now=isToday(day)?`<span class="calNow" style="left:${timePct(demoNow,b)}%" title="Now · ${fmtTime(demoNow)}"></span>`:'';const past=isToday(day)?`<span class="calPast" style="width:${timePct(demoNow,b)}%"></span>`:'';const row=(s)=>{const e=staffByID(s.emp);const time=span(s.s,s.e),w=(s.e-s.s)/timeWidth*100;const islit=!S.highlights.length||isHighlighted(e.id);return `<div class="dayEmployeeRow${islit?'':' dim'}"><div class="dayEmpInfo"><button class="plainName" data-act="employee" data-emp="${e.id}">${avatar(e)}<span class="nameDetails"><strong>${escapeHTML(e.name)}</strong><small>${escapeHTML(e.roles[0])}</small></span></button></div><div class="dayEmployeeLine">${timelineGrid(b)}${gapStr}${past}${now}<button class="dayShiftBar${s.type==='one-time'?' oneTime':''}${isPast(day)?' isPast':''}" style="left:calc(${timePct(s.s,b)}% + 2px);width:calc(${w}% - 4px)" data-act="shift" data-id="${s.id}" title="${escapeHTML(e.name)} · ${time}"><span>${time}</span>${attendanceStatus(s)==='review'||attendanceStatus(s)==='flag'?`<span class="calBarFlag">${icon('alert',12)}</span>`:attendanceStatus(s)==='ok'?`<span class="calBarOkay">${icon('check',12)}</span>`:''}</button></div></div>`};const lines=groups.map(g=>`<div class="dayGroupHeading"><span>${fmtTime(g.s)}–${fmtTime(g.e)}</span><span>${g.items.length} ${g.items.length===1?'employee':'employees'}${g.type==='one-time'?' · One-time':''}</span></div>${g.items.map(row).join('')}`).join('');const off=day==='2026-11-12'&&S.week===anchorWeek?[EMPLOYEES.find(e=>e.id==='k')].filter(Boolean):[];const free=people.filter(e=>!sh.some(s=>s.emp===e.id)&&!off.some(x=>x.id===e.id));const offRows=off.length?`<div class="dayGroupHeading">Time off <span>${off.length}</span></div>${off.map(e=>`<div class="dayEmployeeRow"><div class="dayEmpInfo">${avatar(e)} <span style="font-size:12px">${escapeHTML(e.name)}</span></div><div class="dayEmployeeLine">${timelineGrid(b)}<span class="timeOffBar">Time off</span></div></div>`).join('')}`:'';const freeRows=`<div class="dayGroupHeading freeGroup"><span>Not scheduled</span><button class="btn ghost small" data-act="viewFree">${free.length} employees · ${S.showFree?'Hide':'Show'} ${icon('chevDown',13)}</button></div>${S.showFree?free.map(e=>`<div class="dayEmployeeRow"><div class="dayEmpInfo">${avatar(e)} <span style="font-size:12px">${escapeHTML(e.name)}</span></div><div class="dayEmployeeLine">${timelineGrid(b)}<button class="dayAddRow" data-act="addShift" data-day="${day}" data-emp="${e.id}">${icon('plus',13)} Add shift</button></div></div>`).join(''):''}`;const slots=groups.length?lines:'<div class="dayNoGroups">No shifts scheduled for this day. <button class="btn small soft" data-act="addShift">Add shift</button></div>';const header=`<div class="dayCalendarTitle">${dayHeader(day)}<div class="calDayActions"><span class="miniWeekDate">${store} · ${fmtTime(b.start,false)}–${fmtTime(b.end,false)}</span><button class="btn soft small" data-act="addShift" data-day="${day}">${icon('plus',13)} Add shift</button></div></div>`;return `${header}${closed?`<div class="dayClosureNote">${icon('lock',15)} Store closed today. Any one-time shifts are shown as exceptions.</div>`:''}<div class="dayCalendarWrap"><div class="dayCalendarAxis"><span>EMPLOYEE</span>${timelineAxis(b,day)}</div><div class="dayCalendarRows">${slots}${offRows}${freeRows}</div></div><div class="daySlotBar"><div><strong>${fmtTime(S.slot)} · ${uniqCount(sh.filter(s=>s.s<=S.slot&&s.e>S.slot))} scheduled</strong><span> Select an hour above to inspect coverage</span></div><button class="btn small ${S.showSlotRoster?'soft':'ghost'}" data-act="slotRoster">${S.showSlotRoster?'Hide employees':'View employees'} ${icon('chevDown',14)}</button></div>${S.showSlotRoster?`<div class="calRoster">${timeRoster(day)}</div>`:''}<div class="calFoot"><span>${icon('info',13)} Bars represent planned shifts. Historical attendance and corrections live in Time Cards.</span><button class="btn ghost small" data-act="view" data-val="list">Switch to Table ${icon('chevRight',13)}</button></div>`}

function emptyPanel(title,sub,cta,action){return `<div class="emptyPanel"><div class="emptyIcon">${icon('calendar',25)}</div><h3>${title}</h3><p>${sub}</p>${cta?`<button class="btn soft" data-act="${action}">${cta}</button>`:''}</div>`}
function dayHeader(day){const sh=visibleShifts(day),cnt=uniqCount(sh),gs=groupOf(sh);const gap=gapList(day,S.role||null);return `<div class="daytitle"><button class="btn icon" data-act="dayPrev">${icon('chevLeft')}</button><button class="btn icon" data-act="dayNext">${icon('chevRight')}</button><h2>${parseDay(day).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</h2>${isToday(day)?`<span class="pill blue">Today</span>`:''}<div class="daymeta"><span><b>${cnt}</b> scheduled</span><span><b>${gs.length}</b> shift groups</span>${gap.length?`<span class="gapTag">${icon('alert',13)} ${gap.length} coverage gap${gap.length>1?'s':''}</span>`:''}</div></div>`}
function timeCoverage(day){const cov=coverage(day,S.role||null),start=S.hours.start,end=S.hours.end,blocks=[];for(let t=start;t<end;t+=15){const n=(S.role?shiftsOf(day).filter(s=>staffByID(s.emp)?.roles.includes(S.role)):shiftsOf(day)).filter(s=>s.s<t+15&&s.e>t).length;blocks.push(`<button type="button" class="timeslot${n===0?' zero':n<2?' low':n<5?' medium':' high'}${S.slot===t?' selected':''}" title="${fmtTime(t)}: ${n} scheduled" data-act="slot" data-time="${t}" aria-label="${fmtTime(t)}: ${n} scheduled"></button>`)}const labels=[start,start+(end-start)/4,start+(end-start)/2,start+3*(end-start)/4,end];return `<section class="timeline"><div class="twoItems"><div><div class="blockTitle">Coverage throughout the day</div><p class="blockSub">Select a time to see exactly who's scheduled.</p></div><span class="pill">Store hours: ${fmtTime(start,false)}–${fmtTime(end,false)}</span></div><div class="timeLabels" style="margin-top:20px">${labels.map(t=>`<span>${fmtTime(Math.round(t),false)}</span>`).join('')}</div><div class="timebar">${blocks.join('')}</div><div class="timelineFoot"><span class="micro">Darker blue means more scheduled · Rose means none${S.role?' in '+escapeHTML(S.role)+' role':''}</span>${cov.gaps.length?`<span class="micro warning">${cov.gaps.map(g=>`${fmtTime(g.start)}–${fmtTime(g.end)}`).join(' · ')} unstaffed</span>`:`<span class="micro">No coverage gaps${S.role?' for '+escapeHTML(S.role):''}</span>`}</div></section>`}
function timeRoster(day){const cand=visibleShifts(day).filter(s=>s.s<=S.slot&&s.e>S.slot);const unique=[...new Map(cand.map(s=>[s.emp,s])).values()].sort((a,b)=>staffByID(a.emp).name.localeCompare(staffByID(b.emp).name));const heading=`<div class="rosterHead"><div><div class="blockTitle">At ${fmtTime(S.slot)}</div><div class="blockSub">${unique.length} ${unique.length===1?'employee':'employees'} scheduled</div></div><button class="btn small soft" data-act="addShift" data-day="${day}" data-start="${S.slot}">${icon('plus',13)} Add shift</button></div>`;return `<div class="block">${heading}<div class="rosterList">${unique.length?unique.map(s=>{const e=staffByID(s.emp);return `<div class="rosterRow${isHighlighted(e.id)?' hilite':''}">${avatar(e)}<div class="who"><strong>${escapeHTML(e.name)}</strong><span>${escapeHTML(e.roles[0])}</span></div><div class="rosterTime">${fmtTime(s.s)}–${fmtTime(s.e)}</div><button class="btn icon small" data-act="shift" data-id="${s.id}" aria-label="View ${escapeHTML(e.name)} shift">${icon('chevRight',14)}</button></div>`}).join(''):`<div class="emptyPanel" style="min-height:190px;padding:18px"><h3 style="font-size:14px">No one scheduled at ${fmtTime(S.slot)}</h3><p>Choose another time or add a shift to cover this period.</p></div>`}</div></div>`}
function shiftGroups(day){const gr=groupOf(visibleShifts(day));return `<div class="block"><div class="rosterHead"><div><div class="blockTitle">Shift groups</div><div class="blockSub">${gr.length} groups · Select one to see employees</div></div></div><div class="groupList">${gr.length?gr.map(g=>{const isOpen=S.openGroup===g.key;const lit=highlightMatch(g.items);return `<div class="grpItem"><button class="grpTrigger${lit?'':' dim'}" data-act="expand" data-key="${g.key}"><div class="grpPeople"><span class="avgroup">${g.items.slice(0,4).map(s=>avatar(staffByID(s.emp),true)).join('')}</span><div><div class="grpTime">${fmtTime(g.s)}–${fmtTime(g.e)}</div><div class="grpSub">${g.items.length} employees ${g.type==='one-time'?'· One-time':''}${g.items.some(s=>s.reported&&!S.reportedResolved)?' · Needs review':''}</div></div></div>${icon(isOpen?'chevDown':'chevRight',15)}</button>${isOpen?`<div class="grpListExpanded">${g.items.map(s=>{const e=staffByID(s.emp);return `<div class="personRow">${avatar(e)}<div class="who"><strong>${escapeHTML(e.name)}</strong><span>${escapeHTML(e.roles.join(', '))}</span></div><button class="btn small" data-act="shift" data-id="${s.id}">${isPast(day)?'Time Card':'Edit'}</button></div>`}).join('')}</div>`:''}</div>`}).join(''):`<div style="padding:25px 18px;color:var(--muted);font-size:12px">No shift groups for this day.</div>`}</div></div>`}
function listView(){const days=weekDays(),people=visiblePeople();if(S.scenario==='empty')return emptyPanel('No schedules yet','Set usual working hours in Employees → Shift Details. You can still create individual shifts.','Add shift','addShift');if(!people.length)return emptyPanel('No employees found','Try another employee name or clear the role filter.','Clear filters','clearFilters');let head=`<thead><tr><th>Employee</th>${days.map(d=>`<th>${dayName(d)} ${parseDay(d).getDate()}${hasClosure(d)?' · Closed':''}</th>`).join('')}</tr></thead>`;let rows=people.map(e=>{return `<tr><td><button class="btn ghost small" style="padding-left:0" data-act="employee" data-emp="${e.id}">${avatar(e,true)} <span style="color:var(--ink)">${escapeHTML(e.name)}</span></button><div style="font-size:11px;color:var(--muted);padding-left:1px">${escapeHTML(e.roles.join(', '))}</div></td>${days.map(day=>{const ss=shiftsOf(day).filter(s=>s.emp===e.id).sort((a,b)=>a.s-b.s);return `<td>${ss.length?ss.slice(0,2).map(s=>`<button class="listCellBtn hasShift${S.highlights.length&&!isHighlighted(e.id)?' dim':''}" data-act="shift" data-id="${s.id}">${fmtShort(s.s)}–${fmtShort(s.e)} ${s.type==='one-time'?'⋅':''}${attendanceStatus(s)==='review'||attendanceStatus(s)==='flag'?' ⚠':attendanceStatus(s)==='ok'?' ✓':''}</button>`).join('<div></div>')+(ss.length>2?`<span class="pill">+${ss.length-2} more</span>`:''):`<button class="tinyBtn" data-act="addShift" data-day="${day}" data-emp="${e.id}" aria-label="Add shift for ${escapeHTML(e.name)} on ${day}">${hasClosure(day)?'Closed':'+'}</button>`}</td>`}).join('')}</tr>`}).join('');return `<div class="listBox"><table class="listtable">${head}<tbody>${rows}</tbody></table></div><div class="hint" style="margin-top:13px">Select a shift to open its details. Historical shifts open Time Cards; upcoming shifts open the shift editor.</div>`}
function closureView(){return `<div class="hrow" style="margin:4px 0 22px"><div><h2 class="heading" style="font-size:19px">Store closures</h2><p class="subheading">Add holidays or dates when ${store} isn't open.</p></div><button class="btn primary" data-act="addClosure">${icon('plus',15)} Add store closure</button></div><div class="block">${S.closures.length?S.closures.map((c,i)=>`<div class="closureRow"><div class="dateNum" style="width:42px;height:44px;font-size:15px">${parseDay(c.date).getDate()}</div><div style="flex:1"><div class="closureTitle">${escapeHTML(c.name)}</div><span class="muted" style="font-size:12px">${longDay(c.date)}</span></div>${c.recurring?'<span class="pill">Every year</span>':''}<button class="btn small" data-act="deleteClosure" data-i="${i}">Remove</button></div>`).join(''):emptyPanel('No store closures','Add holidays, maintenance days or other dates when the location will be closed.','Add store closure','addClosure')}</div>`}
function modalHeader(title,sub=''){return `<div class="modalHead"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="btn icon ghost" aria-label="Close" data-act="closeModal">${icon('x',18)}</button></div>`}
function groupModal(day,key){const g=groupOf(visibleShifts(day)).find(g=>g.key===key);if(!g)return'';return `<div class="modal">${modalHeader(`${g.items.length} employees scheduled`,`${longDay(day)} · ${span(g.s,g.e)}`)}<div class="modalBody"><div class="modalList">${g.items.map(s=>{const e=staffByID(s.emp);return `<div class="personRow">${avatar(e)}<div class="who"><strong>${escapeHTML(e.name)}</strong><span>${escapeHTML(e.roles.join(' · '))}</span></div><button class="btn small" data-act="shift" data-id="${s.id}">${isPast(day)?'Time Card':'Edit shift'}</button></div>`}).join('')}</div><div class="infonote">Employees with the same shift hours are grouped to keep the week easy to scan.</div></div><div class="modalFoot"><button class="btn" data-act="closeModal">Done</button><button class="btn soft" data-act="openDay" data-day="${day}">Open day ${icon('chevRight',14)}</button></div></div>`}
function findShift(id){for(let d of weekDays()){const s=shiftsOf(d).find(s=>s.id===id);if(s)return s}return null}
function shiftSummaryModal(id){const s=findShift(id);if(!s)return'';const e=staffByID(s.emp),past=isPast(s.day);const actual=s.actual||[{s:s.s,e:s.e}];const mins=actual.reduce((m,r)=>m+(r.e-r.s),0)-(s.unpaidBreak||0);const read=`<div class="detailSplit"><div class="metric"><small>${past?'Recorded paid hours':'Scheduled hours'}</small><strong>${fmtDur(past?mins:s.e-s.s)}</strong></div><div class="metric"><small>Scheduled time</small><strong style="font-size:15px;margin-top:8px">${span(s.s,s.e)}</strong></div></div><div class="detailLine"><span>Shift type</span><b>${s.type==='one-time'?'One-time':'Recurring schedule'}</b></div>`;if(!past)return `<div class="modal">${modalHeader('Shift details',`${escapeHTML(e.name)} · ${longDay(s.day)}`)}<div class="modalBody">${read}<div class="detailLine"><span>Location</span><b>${store}</b></div>${hasClosure(s.day)?`<div class="warnline">This shift is scheduled on a store-closed day.</div>`:''}</div><div class="modalFoot"><button class="btn danger" data-act="confirmDelete" data-id="${id}">Delete</button><button class="btn" data-act="closeModal">Close</button><button class="btn primary" data-act="editShift" data-id="${id}">${icon('edit',14)} Edit shift</button></div></div>`;
const report=s.reported&&!S.reportedResolved?`<div class="reportLine" style="margin-top:14px"><strong>${icon('alert',13)} Employee reported a later clock-out</strong><span style="font-size:12px">Reported ${fmtTime(s.reported.reported)} · ${fmtDur(s.reported.reported-s.reported.autoOut)} later</span><span style="font-size:11px;color:var(--muted)">Update the recorded clock-out if correct. Not included in paid hours yet.</span></div>`:'';return `<div class="modal wide">${modalHeader('Time Card',`${escapeHTML(e.name)} · ${longDay(s.day)} · ${store}`)}<div class="modalBody">${read}${actual.map((v,i)=>`<div class="detailLine"><span>Work session ${i+1}</span><b>${span(v.s,v.e)} · ${fmtDur(v.e-v.s)}</b></div>`).join('')}<div class="detailLine"><span>Actual unpaid breaks</span><b>${fmtDur(s.unpaidBreak||0)}</b></div><div class="detailLine"><span>Paid breaks recorded</span><b>${fmtDur(s.paidBreak||0)}</b></div>${s.completed&&s.actual?.[0]?.s>s.s?`<div class="warnline">Clocked in ${fmtDur(s.actual[0].s-s.s)} late.</div>`:''}${report}<div class="infonote">Scheduled times remain unchanged. Only actual work sessions and unpaid breaks determine paid hours.</div></div><div class="modalFoot"><button class="btn" data-act="closeModal">Close</button>${report?`<button class="btn primary" data-act="reviewReport" data-id="${id}">Review correction</button>`:`<button class="btn soft" data-act="editTimecard" data-id="${id}">${icon('edit',14)} Correct time</button>`}</div></div>`}
function editTimecardModal(id){const s=findShift(id),e=staffByID(s.emp);return `<div class="modal">${modalHeader('Correct Time Card',`${escapeHTML(e.name)} · ${longDay(s.day)}`)}<form data-form="timecard" data-id="${id}"><div class="modalBody"><div class="formGroup"><label for="newout">Recorded clock-out time</label><input class="input" type="time" id="newout" name="out" value="${two(Math.floor((s.actual?.at(-1)?.e??s.e)/60))}:${two((s.actual?.at(-1)?.e??s.e)%60)}" required></div>${s.reported&&!S.reportedResolved?`<div class="warnline">Employee reported working until ${fmtTime(s.reported.reported)}. This has not changed payroll.</div>`:''}<div class="infonote">Manager corrections update recorded hours. The original POS event remains in the audit trail.</div></div><div class="modalFoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Save correction</button></div></form></div>`}
function editShiftModal(id,day,emp,start){const s=id?findShift(id):null;const d=s?.day||day||S.day;const st=s?.s??(Number(start)||9*60),en=s?.e??Math.min(st+240,23*60+59);return `<div class="modal">${modalHeader(s?'Edit shift':'Add shift',`${store} · Scheduled hours`)}<form data-form="shift" data-id="${s?.id||''}"><div class="modalBody"><div class="formGroup"><label>Employee</label><select class="input" name="employee" ${s?'disabled':''}>${staff().map(e=>`<option value="${e.id}"${(s?s.emp:emp||'a')===e.id?' selected':''}>${escapeHTML(e.name)}</option>`).join('')}</select>${s?`<input name="employee" type="hidden" value="${s.emp}">`:''}</div><div class="grid2" style="margin-top:13px"><div class="formGroup"><label>Date</label><input class="input" type="date" name="day" value="${d}" ${s?'readonly':''} required></div><div class="formGroup"><label>Shift type</label><input class="input" readonly value="${s?s.type==='one-time'?'One-time':'Scheduled':'One-time'}"></div><div class="formGroup"><label>Start time</label><input class="input" type="time" name="start" value="${two(Math.floor(st/60))}:${two(st%60)}" required></div><div class="formGroup"><label>End time</label><input class="input" type="time" name="end" value="${two(Math.floor(en/60))}:${two(en%60)}" required></div></div><div class="infonote">Future shift changes won't modify previously recorded Time Cards. Overnight shifts aren't supported in this V1.</div><div id="formError" role="alert" class="warnline hidden"></div></div><div class="modalFoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">${s?'Save changes':'Add shift'}</button></div></form></div>`}
function addClosureModal(){return `<div class="modal">${modalHeader('Add store closure',`Add a closure for ${store}`)}<form data-form="closure"><div class="modalBody"><div class="formGroup"><label>Occasion</label><input class="input" required name="occasion" placeholder="e.g. Maintenance day"></div><div class="formGroup" style="margin-top:14px"><label>Date</label><input type="date" class="input" name="date" value="${S.day}" required></div><label style="display:flex;align-items:center;gap:7px;margin-top:15px;color:var(--text)"><input type="checkbox" name="recurring"> Repeats every year</label><div class="infonote">Existing one-time shifts on this date remain visible as closure exceptions.</div></div><div class="modalFoot"><button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Save closure</button></div></form></div>`}
function confirmDeleteModal(id){const s=findShift(id),e=staffByID(s.emp);return `<div class="modal">${modalHeader('Delete this shift?',`${escapeHTML(e.name)} · ${longDay(s.day)}`)}<div class="modalBody"><p style="margin:0;color:var(--text)">Remove the scheduled ${span(s.s,s.e)} shift? Historical Time Card records will not be changed.</p></div><div class="modalFoot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="deleteShift" data-id="${id}">Delete shift</button></div></div>`}
function showModal(){if(!S.modal)return'';const m=S.modal;let html='';switch(m.type){case'group':html=groupModal(m.day,m.key);break;case'shift':html=shiftSummaryModal(m.id);break;case'editShift':html=editShiftModal(m.id,m.day,m.emp,m.start);break;case'timecard':html=editTimecardModal(m.id);break;case'employee':html=employeeModal(m.id);break;case'closure':html=addClosureModal();break;case'delete':html=confirmDeleteModal(m.id);break;}return html?`<div class="overlay" data-act="overlay"><div role="dialog" aria-modal="true" aria-label="${m.type}" class="modalWrap">${html}</div></div>`:''}
function page(){let body=S.closurePage?closureView():S.view==='overview'?overviewView():S.view==='week'?weekView():S.view==='day'?dayView():listView();return `<div class="shell">${sidebar()}<div style="min-width:0"><div class="topbar"><div class="searchTop">${icon('search',14)} Search <span style="margin-left:auto;font-size:10px">⌘ K</span></div><button class="btn icon" aria-label="Scan" data-act="nav">${icon('users',17)}</button><div class="avatarSelf">K</div></div><div class="main"><main class="page">${S.closurePage?`<div class="twoItems" style="padding-bottom:20px;border-bottom:1px solid var(--line)"><h1 class="heading">Employee Schedules</h1><button class="btn soft" data-act="backSchedule">${icon('chevLeft',15)} Back to schedules</button></div>`:toolbar()}${S.closurePage?'':filters()}${body}<div class="footerNote"><span>Design exploration · Planning uses scheduled hours; Time Cards use recorded work sessions.</span><div class="scenarios"><span>Preview team</span><select id="scenario"><option value="5" ${S.team===5?'selected':''}>5 employees</option><option value="12" ${S.team===12&&S.scenario!=='empty'?'selected':''}>12 employees</option><option value="72" ${S.team===72?'selected':''}>72 employees</option><option value="empty" ${S.scenario==='empty'?'selected':''}>No usual hours</option></select></div></div></main></div></div></div>${showModal()}${S.toast?`<div class="toast" role="status">${escapeHTML(S.toast)}</div>`:''}`}
function render(){const active=document.activeElement;const preserve=active&&['empSearch','hlSearch'].includes(active.id)?{id:active.id,start:active.selectionStart,end:active.selectionEnd}:null;const hlList=root.querySelector('#hlPickerList');const oldPickerScroll=hlList?hlList.scrollTop:0;const oldScroll=root.querySelector('.calWrap, .dayCalendarRows, .listBox');const oldType=window._octoposRenderedView;const previousScroll=oldScroll?{top:oldScroll.scrollTop,left:oldScroll.scrollLeft}:null;root.innerHTML=page();const nextScroll=root.querySelector('.calWrap, .dayCalendarRows, .listBox');if(nextScroll&&previousScroll&&S.view===oldType){nextScroll.scrollTop=previousScroll.top;nextScroll.scrollLeft=previousScroll.left}else if(nextScroll&&S.view==='week'&&S.week===anchorWeek){const todayRow=nextScroll.querySelectorAll('.calWeekRow')[1];if(todayRow)nextScroll.scrollTop=Math.max(0,todayRow.offsetTop-100)}window._octoposRenderedView=S.view;const newHL=root.querySelector('#hlPickerList');if(newHL&&S.hlOverflow)newHL.scrollTop=oldPickerScroll;if(preserve){const el=document.getElementById(preserve.id);if(el){el.focus();el.setSelectionRange(preserve.start,preserve.end)}}}
function openDay(day){S.day=day;S.slot=14*60;S.openGroup='';S.modal=null;S.view='day';S.closurePage=false;setView('day')}
function exportCSV(){const rows=[['Date','Employee','Role','Start','End','Type']];weekDays().forEach(day=>shiftsOf(day).forEach(s=>{const e=staffByID(s.emp);rows.push([day,e.name,e.roles.join('; '),fmtTime(s.s),fmtTime(s.e),s.type])}));const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const file=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=`octopos-schedule-${S.week}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Schedule CSV downloaded')}
function onClick(evt){const b=evt.target.closest('[data-act]');if(!b){if(S.hlOverflow&&!evt.target.closest('.hlPicker')){S.hlOverflow=false;render()}return;}if(S.hlOverflow&&!evt.target.closest('.hlPicker'))S.hlOverflow=false;if(b.getAttribute('data-act')==='overlay'){if(evt.target===b){S.modal=null;render()}return}evt.preventDefault();const act=b.dataset.act;switch(act){case'nav':toast('Navigation is a visual mock; schedule interactions are functional.');break;case'location':toast('Demo location: Grocery Mart');break;case'menu':S.menu=!S.menu;render();break;case'closures':S.menu=false;S.closurePage=true;render();break;case'backSchedule':S.closurePage=false;render();break;case'addClosure':S.modal={type:'closure'};render();break;case'deleteClosure':S.closures.splice(Number(b.dataset.i),1);toast('Store closure removed');break;case'weekPrev':S.week=dateAdd(S.week,-7);S.day=S.week;S.slot=14*60;render();break;case'weekNext':S.week=dateAdd(S.week,7);S.day=S.week;S.slot=14*60;render();break;case'thisWeek':S.week=anchorWeek;S.day=demoToday;S.slot=14*60;render();break;case'view':S.closurePage=false;S.showSlotRoster=false;setView(b.dataset.val);break;case'openDay':openDay(b.dataset.day);break;case'dayPrev':{const day=dateAdd(S.day,-1);if(day<S.week){S.week=dateAdd(S.week,-7)}S.day=day;S.openGroup='';render();break}case'dayNext':{const day=dateAdd(S.day,1);if(day>dateAdd(S.week,6)){S.week=dateAdd(S.week,7)}S.day=day;S.openGroup='';render();break}case'group':S.modal={type:'group',day:b.dataset.day,key:b.dataset.key};render();break;case'shift':S.modal={type:'shift',id:b.dataset.id};render();break;case'editShift':S.modal={type:'editShift',id:b.dataset.id};render();break;case'editTimecard':case'reviewReport':S.modal={type:'timecard',id:b.dataset.id};render();break;case'addShift':S.modal={type:'editShift',day:b.dataset.day||S.day,emp:b.dataset.emp,start:b.dataset.start};render();break;case'confirmDelete':S.modal={type:'delete',id:b.dataset.id};render();break;case'deleteShift':S.deleted.add(b.dataset.id);S.modal=null;toast('Shift deleted');break;case'employee':S.modal={type:'employee',id:b.dataset.emp};render();break;case'toggleHighlightOverflow':S.hlOverflow=!S.hlOverflow;S.hlQuery='';render();break;case'toggleHighlight':{const id=String(b.dataset.emp);S.highlights=isHighlighted(id)?S.highlights.filter(x=>x!==id):[...S.highlights,id];render();break}case'clearHighlight':S.highlights=[];S.hlOverflow=false;S.hlQuery='';render();break;case'color':S.colors[b.dataset.emp]=b.dataset.color;try{localStorage.setItem(LSKEY,JSON.stringify({view:S.view,colors:S.colors}))}catch{}render();break;case'closeModal':S.modal=null;render();break;case'expand':S.openGroup=S.openGroup===b.dataset.key?'':b.dataset.key;render();break;case'slot':S.slot=Number(b.dataset.time);S.showSlotRoster=true;render();break;case'slotRoster':S.showSlotRoster=!S.showSlotRoster;render();break;case'viewFree':S.showFree=!S.showFree;render();break;case'clearFilters':S.role='';S.text='';render();break;case'employees':toast('In OctoPOS, set usual hours under Employees → Shift Details.');break;case'export':S.menu=false;exportCSV();break;case'print':S.menu=false;window.print();break;default:break}}
function toMin(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function onSubmit(evt){const form=evt.target.closest('form[data-form]');if(!form)return;evt.preventDefault();const kind=form.dataset.form,fd=new FormData(form);if(kind==='shift'){const start=toMin(fd.get('start')),end=toMin(fd.get('end')),day=fd.get('day'),emp=fd.get('employee'),id=form.dataset.id;const error=document.getElementById('formError');if(start>=end||end-start<30||end>1439){if(error){error.textContent=start>=end?'End time must be after the start time.':end-start<30?'Shift must be at least 30 minutes.':'Shift must end before midnight.';error.classList.remove('hidden')}return}const existing=shiftsOf(day).find(v=>v.emp===emp&&v.id!==id&&start<v.e&&end>v.s);if(existing){if(error){error.textContent='This shift overlaps another scheduled shift for this employee.';error.classList.remove('hidden')}return}if(id){S.overrides[id]={s:start,e:end};S.modal=null;toast('Shift updated')}else{S.edits.push({id:'manual-'+Date.now(),day,emp,s:start,e:end,type:'one-time',source:'manual'});S.modal=null;toast('One-time shift added')}return}if(kind==='closure'){const name=String(fd.get('occasion')||'').trim(),day=fd.get('date'),repeating=fd.get('recurring')==='on';if(!name||!day)return;S.closures.push({date:day,name,recurring:repeating});S.modal=null;toast('Store closure added');return}if(kind==='timecard'){const shift=findShift(form.dataset.id),updatedOut=toMin(fd.get('out')),sessions=(shift.actual||[{s:shift.s,e:shift.e}]).map(x=>({...x}));if(updatedOut<=sessions.at(-1).s){toast('Clock-out must be after clock-in.');return}sessions.at(-1).e=updatedOut;S.overrides[shift.id]={...(S.overrides[shift.id]||{}),actual:sessions,reported:null};S.reportedResolved=true;S.modal=null;toast('Time Card updated; paid hours recalculated');return}}
function onInput(evt){if(evt.target.id==='empSearch'){S.text=evt.target.value;const cur=evt.target.selectionStart;render();const i=document.getElementById('empSearch');if(i){i.focus();i.setSelectionRange(cur,cur)}return}if(evt.target.id==='hlSearch'){S.hlQuery=evt.target.value;const list=document.getElementById('hlPickerList');if(list)list.innerHTML=highlightOverflowItems()}}

function onChange(evt){if(evt.target.id==='roleFilter'){S.role=evt.target.value;render()}if(evt.target.id==='scenario'){if(evt.target.value==='empty'){S.scenario='empty';S.team=12}else{S.scenario='normal';S.team=Number(evt.target.value)}S.highlights=[];S.hlOverflow=false;S.hlQuery='';render()}}
root.addEventListener('click',onClick);root.addEventListener('submit',onSubmit);root.addEventListener('input',onInput);root.addEventListener('change',onChange);document.addEventListener('keydown',evt=>{if(evt.key==='Escape'){if(S.hlOverflow){S.hlOverflow=false;S.hlQuery='';render()}else if(S.modal){S.modal=null;render()}}});window.addEventListener('resize',()=>{if(!S.modal&&!S.closurePage)render()});
render();
})();
</script>
</body></html>
