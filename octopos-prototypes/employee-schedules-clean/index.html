function dayView(){const day=S.day,closed=hasClosure(day);const sh=visibleShifts(day);if(S.scenario==='empty')return emptyPanel('No schedules to show','Set usual working hours in Employees → Shift Details to start planning.','Go to Employees','employees');const head=dayHeader(day);if(closed)return `${head}<div class="closedBox" style="min-height:180px">${icon('lock',23)}<div><strong style="color:var(--ink);display:block">Store closed</strong><span>This location is closed on ${parseDay(day).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}. Schedule exceptions separately if employees need to work.</span><div style="margin-top:14px"><button class="btn soft" data-act="addShift" data-day="${day}">${icon('plus',15)} Add exception shift</button></div></div></div>${sh.length?`<div style="margin-top:18px">${shiftGroups(day)}</div>`:''}`;
const free=visiblePeople().filter(e=>!sh.some(s=>s.emp===e.id));const off=day==='2026-11-12'?[EMPLOYEES.find(e=>e.id==='k')]:[];return `${head}${timeCoverage(day)}<div class="splitGrid">${timeRoster(day)}${shiftGroups(day)}</div><div class="belowDay"><div class="block smallSection"><div class="twoItems"><div><div class="blockTitle">Not scheduled <span class="pill">${free.length}</span></div><div class="blockSub">Employees without a shift on this day</div></div><button class="btn small ghost" data-act="viewFree">${S.showFree?'Hide':'Show'} ${icon('chevDown',14)}</button></div>${S.showFree?`<div style="padding-top:13px;display:flex;gap:8px;flex-wrap:wrap">${free.slice(0,18).map(e=>`<button class="btn small" data-act="addShift" data-day="${day}" data-emp="${e.id}">${avatar(e,true)} ${escapeHTML(e.name)} ${icon('plus',12)}</button>`).join('')}${free.length>18?`<span class="hint">+${free.length-18} more</span>`:''}</div>`:''}</div><div class="block smallSection"><div class="blockTitle">Time off and notes</div><div style="margin-top:10px;color:var(--muted);font-size:12px">${off.length&&S.week===anchorWeek?`Mia Chen · Time off`: 'No time-off entries or notes for this day.'}</div></div></div>`}
function listView(){const days=weekDays(),people=visiblePeople();if(S.scenario==='empty')return emptyPanel('No schedules yet','Set usual working hours in Employees → Shift Details. You can still create individual shifts.','Add shift','addShift');if(!people.length)return emptyPanel('No employees found','Try another employee name or clear the role filter.','Clear filters','clearFilters');let head=`<thead><tr><th>Employee</th>${days.map(d=>`<th>${dayName(d)} ${parseDay(d).getDate()}${hasClosure(d)?' · Closed':''}</th>`).join('')}</tr></thead>`;let rows=people.map(e=>{return `<tr><td><button class="btn ghost small" style="padding-left:0" data-act="employee" data-emp="${e.id}">${avatar(e,true)} <span style="color:var(--ink)">${escapeHTML(e.name)}</span></button><div style="font-size:11px;color:var(--muted);padding-left:1px">${escapeHTML(e.roles.join(', '))}</div></td>${days.map(day=>{const ss=shiftsOf(day).filter(s=>s.emp===e.id).sort((a,b)=>a.s-b.s);return `<td>${ss.length?ss.slice(0,2).map(s=>`<button class="listCellBtn hasShift${S.highlight&&S.highlight!==e.id?' dim':''}" data-act="shift" data-id="${s.id}">${fmtShort(s.s)}–${fmtShort(s.e)} ${s.type==='one-time'?'⋅':''}${s.reported&&!S.reportedResolved?' ⚠':''}</button>`).join('<div></div>')+(ss.length>2?`<span class="pill">+${ss.length-2} more</span>`:''):`<button class="tinyBtn" data-act="addShift" data-day="${day}" data-emp="${e.id}" aria-label="Add shift for ${escapeHTML(e.name)} on ${day}">${hasClosure(day)?'Closed':'+'}</button>`}</td>`}).join('')}</tr>`}).join('');return `<div class="listBox"><table class="listtable">${head}<tbody>${rows}</tbody></table></div><div class="hint" style="margin-top:13px">Select a shift to open its details. Historical shifts open Time Cards; upcoming shifts open the shift editor.</div>`}
function closureView(){return `<div class="hrow" style="margin:4px 0 22px"><div><h2 class="heading" style="font-size:19px">Store closures</h2><p class="subheading">Add holidays or dates when ${store} isn't open.</p></div><button class="btn primary" data-act="addClosure">${icon('plus',15)} Add store closure</button></div><div class="block">${S.closures.length?S.closures.map((c,i)=>`<div class="closureRow"><div class="dateNum" style="width:42px;height:44px;font-size:15px">${parseDay(c.date).getDate()}</div><div style="flex:1"><div class="closureTitle">${escapeHTML(c.name)}</div><span class="muted" style="font-size:12px">${longDay(c.date)}</span></div>${c.recurring?'<span class="pill">Every year</span>':''}<button class="btn small" data-act="deleteClosure" data-i="${i}">Remove</button></div>`).join(''):emptyPanel('No store closures','Add holidays, maintenance days or other dates when the location will be closed.','Add store closure','addClosure')}</div>`}
function modalHeader(title,sub=''){return `<div class="modalHead"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="btn icon ghost" aria-label="Close" data-act="closeModal">${icon('x',18)}</button></div>`}
function groupModal(day,key){const g=groupOf(visibleShifts(day)).find(g=>g.key===key);if(!g)return'';return `<div class="modal">${modalHeader(`${g.items.length} employees scheduled`,`${longDay(day)} · ${span(g.s,g.e)}`)}<div class="modalBody"><div class="modalList">${g.items.map(s=>{const e=staffByID(s.emp);return `<div class="personRow">${avatar(e)}<div class="who"><strong>${escapeHTML(e.name)}</strong><span>${escapeHTML(e.roles.join(' · '))}</span></div><button class="btn small" data-act="shift" data-id="${s.id}">${isPast(day)?'Time Card':'Edit shift'}</button></div>`}).join('')}</div><div class="infonote">Employees with the same shift hours are grouped to keep the week easy to scan.</div></div><div class="modalFoot"><button class="btn" data-act="closeModal">Done</button><button class="btn soft" data-act="openDay" data-day="${day}">Open day ${icon('chevRight',14)}</button></div></div>`}
function findShift(id){for(let d of weekDays()){const s=shiftsOf(d).find(s=>s.id===id);if(s)return s}return null}
function shiftSummaryModal(id){const s=findShift(id);if(!s)return'';const e=staffByID(s.emp),past=isPast(s.day);const actual=s.actual||[{s:s.s,e:s.e}];const mins=actual.reduce((m,r)=>m+(r.e-r.s),0)-(s.unpaidBreak||0);const read=`<div class="detailSplit"><div class="metric"><small>${past?'Recorded paid hours':'Scheduled hours'}</small><strong>${fmtDur(past?mins:s.e-s.s)}</strong></div><div class="metric"><small>Scheduled time</small><strong style="font-size:15px;margin-top:8px">${span(s.s,s.e)}</strong></div></div><div class="detailLine"><span>Shift type</span><b>${s.type==='one-time'?'One-time':'Recurring schedule'}</b></div>`;if(!past)return `<div class="modal">${modalHeader('Shift details',`${escapeHTML(e.name)} · ${longDay(s.day)}`)}<div class="modalBody">${read}<div class="detailLine"><span>Location</span><b>${store}</b></div>${hasClosure(s.day)?`<div class="warnline">This shift is scheduled on a store-closed day.</div>`:''}</div><div class="modalFoot"><button class="btn danger" data-act="confirmDelete" data-id="${id}">Delete</button><button class="btn" data-act="closeModal">Close</button><button class="btn primary" data-act="editShift" data-id="${id}">${icon('edit',14)} Edit shift</button></div></div>`;
const report=s.reported&&!S.reportedResolved?`<div class="reportLine" style="margin-top:14px"><strong>${icon('alert',13)} Employee reported a later clock-out</strong><span style="font-size:12px">Reported ${fmtTime(s.reported.reported)} · ${fmtDur(s.reported.reported-s.reported.autoOut)} later</span><span style="font-size:11px;color:var(--muted)">Update the recorded clock-out if correct. Not included in paid hours yet.</span></div>`:'';return `<div class="modal wide">${modalHeader('Time Card',`${escapeHTML(e.name)} · ${longDay(s.day)} · ${store}`)}<div class="modalBody">${read}${actual.map((v,i)=>`<div class="detailLine"><span>Work session ${i+1}</span><b>${span(v.s,v.e)} · ${fmtDur(v.e-v.s)}</b></div>`).join('')}<div class="detailLine"><span>Actual unpaid breaks</span><b>${fmtDur(s.unpaidBreak||0)}</b></div><div class="detailLine"><span>Paid breaks recorded</span><b>${fmtDur(s.paidBreak||0)}</b></div>${s.completed&&s.actual?.[0]?.s>s.s?`<div class="warnline">Clocked in ${fmtDur(s.actual[0].s-s.s)} late.</div>`:''}${report}<div class="infonote">Scheduled times remain unchanged. Only actual work sessions and unpaid breaks determine paid hours.</div></div><div class="modalFoot"><button class="btn" data-act="closeModal">Close</button>${report?`<button class="btn primary" data-act="reviewReport" data-id="${id}">Review correction</button>`:`<button class="btn soft" data-act="editTimecard" data-id="${id}">${icon('edit',14)} Correct time</button>`}</div></div>`}
function editTimecardModal(id){const s=findShift(id),e=staffByID(s.emp);return `<div class="modal">${modalHeader('Correct Time Card',`${escapeHTML(e.name)} · ${longDay(s.day)}`)}<form data-form="timecard" data-id="${id}"><div class="modalBody"><div class="formGroup"><label for="newout">Recorded clock-out time</label><input class="input" type="time" id="newout" name="out" value="${two(Math.floor((s.actual?.at(-1)?.e??s.e)/60))}:${two((s.actual?.at(-1)?.e??s.e)%60)}" required></div>${s.reported&&!S.reportedResolved?`<div class="warnline">Employee reported working until ${fmtTime(s.reported.reported)}. This has not changed payroll.</div>`:''}<div class="infonote">Manager corrections update recorded hours. The original POS event remains in the audit trail.</div></div><div class="modalFoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Save correction</button></div></form></div>`}
function editShiftModal(id,day,emp,start){const s=id?findShift(id):null;const d=s?.day||day||S.day;const st=s?.s??(Number(start)||9*60),en=s?.e??Math.min(st+240,23*60+59);return `<div class="modal">${modalHeader(s?'Edit shift':'Add shift',`${store} · Scheduled hours`)}<form data-form="shift" data-id="${s?.id||''}"><div class="modalBody"><div class="formGroup"><label>Employee</label><select class="input" name="employee" ${s?'disabled':''}>${staff().map(e=>`<option value="${e.id}"${(s?s.emp:emp||'a')===e.id?' selected':''}>${escapeHTML(e.name)}</option>`).join('')}</select>${s?`<input name="employee" type="hidden" value="${s.emp}">`:''}</div><div class="grid2" style="margin-top:13px"><div class="formGroup"><label>Date</label><input class="input" type="date" name="day" value="${d}" ${s?'readonly':''} required></div><div class="formGroup"><label>Shift type</label><input class="input" readonly value="${s?s.type==='one-time'?'One-time':'Scheduled':'One-time'}"></div><div class="formGroup"><label>Start time</label><input class="input" type="time" name="start" value="${two(Math.floor(st/60))}:${two(st%60)}" required></div><div class="formGroup"><label>End time</label><input class="input" type="time" name="end" value="${two(Math.floor(en/60))}:${two(en%60)}" required></div></div><div class="infonote">Future shift changes won't modify previously recorded Time Cards. Overnight shifts aren't supported in this V1.</div><div id="formError" role="alert" class="warnline hidden"></div></div><div class="modalFoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">${s?'Save changes':'Add shift'}</button></div></form></div>`}
function employeePicker(){const sorted=visiblePeople();return `<div class="modal">${modalHeader('Highlight an employee','Keep one person visible across Week, Day and List.')}<div class="modalBody"><input id="highlightSearch" class="input" placeholder="Search employees" autocomplete="off" aria-label="Search employee to highlight"><div class="rosterList" style="max-height:300px;margin-top:10px" id="highlightResults">${sorted.map(e=>`<button type="button" class="rosterRow" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" data-act="setHighlight" data-emp="${e.id}">${avatar(e)}<div class="who"><strong>${escapeHTML(e.name)}</strong><span>${escapeHTML(e.roles.join(', '))}</span></div></button>`).join('')}</div></div></div>`}
function employeeModal(id){const e=staffByID(id),c=avColor(e);return `<div class="modal">${modalHeader('Employee appearance',`${escapeHTML(e.name)} · Basic Details`)}<div class="modalBody"><div class="memberAvatar">${avatar(e)}<div><strong style="color:var(--ink)">${escapeHTML(e.name)}</strong><div class="muted" style="font-size:12px">Choose their optional schedule color.</div></div></div><div class="swatches">${COLORS.map((color,i)=>`<button class="swatch${color===c?' selected':''}" style="background:${color}" title="Color ${i+1}" aria-label="Choose schedule color ${i+1}" data-act="color" data-emp="${id}" data-color="${color}"></button>`).join('')}</div><p class="infonote">Color helps identify employees. Their initials and names remain visible, even when colors repeat.</p></div><div class="modalFoot"><button class="btn primary" data-act="closeModal">Done</button></div></div>`}
function addClosureModal(){return `<div class="modal">${modalHeader('Add store closure',`Add a closure for ${store}`)}<form data-form="closure"><div class="modalBody"><div class="formGroup"><label>Occasion</label><input class="input" required name="occasion" placeholder="e.g. Maintenance day"></div><div class="formGroup" style="margin-top:14px"><label>Date</label><input type="date" class="input" name="date" value="${S.day}" required></div><label style="display:flex;align-items:center;gap:7px;margin-top:15px;color:var(--text)"><input type="checkbox" name="recurring"> Repeats every year</label><div class="infonote">Existing one-time shifts on this date remain visible as closure exceptions.</div></div><div class="modalFoot"><button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Save closure</button></div></form></div>`}
function confirmDeleteModal(id){const s=findShift(id),e=staffByID(s.emp);return `<div class="modal">${modalHeader('Delete this shift?',`${escapeHTML(e.name)} · ${longDay(s.day)}`)}<div class="modalBody"><p style="margin:0;color:var(--text)">Remove the scheduled ${span(s.s,s.e)} shift? Historical Time Card records will not be changed.</p></div><div class="modalFoot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="deleteShift" data-id="${id}">Delete shift</button></div></div>`}
function showModal(){if(!S.modal)return'';const m=S.modal;let html='';switch(m.type){case'group':html=groupModal(m.day,m.key);break;case'shift':html=shiftSummaryModal(m.id);break;case'editShift':html=editShiftModal(m.id,m.day,m.emp,m.start);break;case'timecard':html=editTimecardModal(m.id);break;case'employee':html=employeeModal(m.id);break;case'picker':html=employeePicker();break;case'closure':html=addClosureModal();break;case'delete':html=confirmDeleteModal(m.id);break;}return html?`<div class="overlay" data-act="overlay"><div role="dialog" aria-modal="true" aria-label="${m.type}" class="modalWrap">${html}</div></div>`:''}
function page(){let body=S.closurePage?closureView():S.view==='week'?weekView():S.view==='day'?dayView():listView();return `<div class="shell">${sidebar()}<div style="min-width:0"><div class="topbar"><div class="searchTop">${icon('search',14)} Search <span style="margin-left:auto;font-size:10px">⌘ K</span></div><button class="btn icon" aria-label="Scan" data-act="nav">${icon('users',17)}</button><div class="avatarSelf">K</div></div><div class="main"><main class="page">${S.closurePage?`<div class="twoItems" style="padding-bottom:20px;border-bottom:1px solid var(--line)"><h1 class="heading">Employee Schedules</h1><button class="btn soft" data-act="backSchedule">${icon('chevLeft',15)} Back to schedules</button></div>`:toolbar()}${S.closurePage?'':filters()}${body}<div class="footerNote"><span>Design exploration · Planning uses scheduled hours; Time Cards use recorded work sessions.</span><div class="scenarios"><span>Preview team</span><select id="scenario"><option value="12" ${S.team===12&&S.scenario!=='empty'?'selected':''}>12 employees</option><option value="72" ${S.team===72?'selected':''}>72 employees</option><option value="empty" ${S.scenario==='empty'?'selected':''}>No usual hours</option></select></div></div></main></div></div></div>${showModal()}${S.toast?`<div class="toast" role="status">${escapeHTML(S.toast)}</div>`:''}`}
function render(){const active=document.activeElement;const preserve=active&&active.id==='empSearch'?{id:active.id,start:active.selectionStart,end:active.selectionEnd}:null;root.innerHTML=page();if(preserve){const el=document.getElementById(preserve.id);if(el){el.focus();el.setSelectionRange(preserve.start,preserve.end)}}}
function openDay(day){S.day=day;S.slot=14*60;S.openGroup='';S.modal=null;S.view='day';S.closurePage=false;setView('day')}
function exportCSV(){const rows=[['Date','Employee','Role','Start','End','Type']];weekDays().forEach(day=>shiftsOf(day).forEach(s=>{const e=staffByID(s.emp);rows.push([day,e.name,e.roles.join('; '),fmtTime(s.s),fmtTime(s.e),s.type])}));const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const file=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=`octopos-schedule-${S.week}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Schedule CSV downloaded')}
function onClick(evt){const b=evt.target.closest('[data-act]');if(!b)return;if(b.getAttribute('data-act')==='overlay'){if(evt.target===b){S.modal=null;render()}return}evt.preventDefault();const act=b.dataset.act;switch(act){case'nav':toast('Navigation is a visual mock; schedule interactions are functional.');break;case'location':toast('Demo location: Grocery Mart');break;case'menu':S.menu=!S.menu;render();break;case'closures':S.menu=false;S.closurePage=true;render();break;case'backSchedule':S.closurePage=false;render();break;case'addClosure':S.modal={type:'closure'};render();break;case'deleteClosure':S.closures.splice(Number(b.dataset.i),1);toast('Store closure removed');break;case'weekPrev':S.week=dateAdd(S.week,-7);S.day=S.week;S.slot=14*60;render();break;case'weekNext':S.week=dateAdd(S.week,7);S.day=S.week;S.slot=14*60;render();break;case'thisWeek':S.week=anchorWeek;S.day=demoToday;S.slot=14*60;render();break;case'view':S.closurePage=false;setView(b.dataset.val);break;case'openDay':openDay(b.dataset.day);break;case'dayPrev':{const day=dateAdd(S.day,-1);if(day<S.week){S.week=dateAdd(S.week,-7)}S.day=day;S.openGroup='';render();break}case'dayNext':{const day=dateAdd(S.day,1);if(day>dateAdd(S.week,6)){S.week=dateAdd(S.week,7)}S.day=day;S.openGroup='';render();break}case'group':S.modal={type:'group',day:b.dataset.day,key:b.dataset.key};render();break;case'shift':S.modal={type:'shift',id:b.dataset.id};render();break;case'editShift':S.modal={type:'editShift',id:b.dataset.id};render();break;case'editTimecard':case'reviewReport':S.modal={type:'timecard',id:b.dataset.id};render();break;case'addShift':S.modal={type:'editShift',day:b.dataset.day||S.day,emp:b.dataset.emp,start:b.dataset.start};render();break;case'confirmDelete':S.modal={type:'delete',id:b.dataset.id};render();break;case'deleteShift':S.deleted.add(b.dataset.id);S.modal=null;toast('Shift deleted');break;case'employee':S.modal={type:'employee',id:b.dataset.emp};render();break;case'findEmployee':S.modal={type:'picker'};render();setTimeout(()=>document.getElementById('highlightSearch')?.focus(),0);break;case'setHighlight':S.highlight=b.dataset.emp;S.modal=null;render();break;case'clearHighlight':S.highlight='';render();break;case'color':S.colors[b.dataset.emp]=b.dataset.color;try{localStorage.setItem(LSKEY,JSON.stringify({view:S.view,colors:S.colors}))}catch{}render();break;case'closeModal':S.modal=null;render();break;case'expand':S.openGroup=S.openGroup===b.dataset.key?'':b.dataset.key;render();break;case'slot':S.slot=Number(b.dataset.time);render();break;case'viewFree':S.showFree=!S.showFree;render();break;case'clearFilters':S.role='';S.text='';render();break;case'employees':toast('In OctoPOS, set usual hours under Employees → Shift Details.');break;case'export':S.menu=false;exportCSV();break;case'print':S.menu=false;window.print();break;default:break}}
function toMin(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function onSubmit(evt){const form=evt.target.closest('form[data-form]');if(!form)return;evt.preventDefault();const kind=form.dataset.form,fd=new FormData(form);if(kind==='shift'){const start=toMin(fd.get('start')),end=toMin(fd.get('end')),day=fd.get('day'),emp=fd.get('employee'),id=form.dataset.id;const error=document.getElementById('formError');if(start>=end||end-start<30||end>1439){if(error){error.textContent=start>=end?'End time must be after the start time.':end-start<30?'Shift must be at least 30 minutes.':'Shift must end before midnight.';error.classList.remove('hidden')}return}const existing=shiftsOf(day).find(v=>v.emp===emp&&v.id!==id&&start<v.e&&end>v.s);if(existing){if(error){error.textContent='This shift overlaps another scheduled shift for this employee.';error.classList.remove('hidden')}return}if(id){S.overrides[id]={s:start,e:end};S.modal=null;toast('Shift updated')}else{S.edits.push({id:'manual-'+Date.now(),day,emp,s:start,e:end,type:'one-time',source:'manual'});S.modal=null;toast('One-time shift added')}return}if(kind==='closure'){const name=String(fd.get('occasion')||'').trim(),day=fd.get('date'),repeating=fd.get('recurring')==='on';if(!name||!day)return;S.closures.push({date:day,name,recurring:repeating});S.modal=null;toast('Store closure added');return}if(kind==='timecard'){const shift=findShift(form.dataset.id),updatedOut=toMin(fd.get('out')),sessions=(shift.actual||[{s:shift.s,e:shift.e}]).map(x=>({...x}));if(updatedOut<=sessions.at(-1).s){toast('Clock-out must be after clock-in.');return}sessions.at(-1).e=updatedOut;S.overrides[shift.id]={...(S.overrides[shift.id]||{}),actual:sessions,reported:null};S.reportedResolved=true;S.modal=null;toast('Time Card updated; paid hours recalculated');return}}
function onInput(evt){if(evt.target.id==='empSearch'){S.text=evt.target.value;const cur=evt.target.selectionStart;render();const i=document.getElementById('empSearch');if(i){i.focus();i.setSelectionRange(cur,cur)}return}if(evt.target.id==='highlightSearch'){const list=document.getElementById('highlightResults');const q=evt.target.value.toLowerCase();list.innerHTML=visiblePeople().filter(e=>e.name.toLowerCase().includes(q)).map(e=>`<button type="button" class="rosterRow" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" data-act="setHighlight" data-emp="${e.id}">${avatar(e)}<div class="who"><strong>${escapeHTML(e.name)}</strong><span>${escapeHTML(e.roles.join(', '))}</span></div></button>`).join('')||'<p style="padding:12px;color:var(--muted)">No employees found</p>'}}
function onChange(evt){if(evt.target.id==='roleFilter'){S.role=evt.target.value;render()}if(evt.target.id==='scenario'){if(evt.target.value==='empty'){S.scenario='empty';S.team=12}else{S.scenario='normal';S.team=Number(evt.target.value)}S.highlight='';render()}}
root.addEventListener('click',onClick);root.addEventListener('submit',onSubmit);root.addEventListener('input',onInput);root.addEventListener('change',onChange);document.addEventListener('keydown',evt=>{if(evt.key==='Escape'&&S.modal){S.modal=null;render()}});
render();
})();
</script>
</body></html>
