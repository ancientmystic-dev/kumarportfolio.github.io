/* V2: one clear three-step language for processes; choice tiles remain for independent starting points. */
.bottom{width:100%}
.stepper-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative}
.stepper-item{position:relative;display:flex;align-items:flex-start;gap:13px;text-align:left;background:#fff;border:1px solid #e1e1e9;border-radius:9px;min-height:150px;padding:17px 16px;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.stepper-item:hover{border-color:#afc3f6;box-shadow:0 4px 18px #234eaa0c}
.stepper-item:not(:last-child):after{content:"→";position:absolute;right:-14px;top:45%;z-index:2;width:16px;height:20px;display:grid;place-items:center;color:#7f99d7;background:#fafbfe;border-radius:5px;font-weight:800}
.stepper-num{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;background:#e9f1ff;color:#2255c8;font-size:12px;font-weight:850;letter-spacing:.03em}
.stepper-body{display:flex;flex-direction:column;gap:7px;min-width:0}
.stepper-body strong{font-size:14px;line-height:1.3;font-weight:750}
.stepper-body>span{font-size:12px;line-height:1.5;color:#827b96}
.stepper-body em{font-style:normal;font-weight:750;color:#2155cb;font-size:11px;margin-top:auto;padding-top:3px}
.stepper-item.stepper-done .stepper-num{background:#e8f8f0;color:#12865a}
.stepper-shortcuts{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-top:14px;color:#807a94;font-size:12px}
.stepper-shortcuts .button{min-height:31px;font-size:11px}
.setup-hero-vertical{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:17px}
.setup-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setup-heading strong{font-size:16px}
.setup-heading p{font-size:12px;margin-top:4px;color:#827c97}
.setup-hero-vertical .stepper-item{min-height:115px;padding:14px 12px}
.setup-hero-vertical .stepper-body em{display:none}
.setup-hero-vertical .stepper-body strong{font-size:12px}
.setup-hero-vertical .stepper-body>span{font-size:11px}
.overview-methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.method-item{border:1px solid #e6e4ec;background:#fff;border-radius:8px;padding:11px 10px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.method-item:hover{border-color:#b7caf7;background:#fbfcff}
.method-item b{font-size:12px}
.method-item small{font-size:11px;color:#857e99;line-height:1.45}
.method-item>span:last-child{color:#2155c8;font-size:10px;font-weight:700;margin-top:auto}
.method-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.method-picker button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid #e1e2eb;border-radius:9px;background:#fff;padding:15px 10px;text-align:left}
.method-picker button:hover{border-color:#aebfec;background:#fcfdff}
.method-picker strong{font-size:12px}
.method-picker small{font-size:11px;color:#827c99}
.guide-numbers{display:flex;gap:8px;margin:4px 0 15px}
.guide-numbers span{width:30px;height:30px;border:1px solid #e0e3ee;border-radius:50%;display:grid;place-items:center;color:#8b87a0;font-size:12px;font-weight:700;background:#fff}
.guide-numbers span.current{background:#2155cf;color:#fff;border-color:#2155cf}
.guide-numbers span.done{background:#e9f7f0;color:#158b56;border-color:#cdeedb}
.guide-helper{font-size:11px;line-height:1.5;color:#857e98;margin-top:13px}
.barcode-panel{border:1px solid #dce6fd;background:#f7faff;border-radius:9px;padding:13px;display:grid;gap:8px;margin:13px 0}
.barcode-panel label{font-weight:740;font-size:12px}
.barcode-panel>div{display:flex;gap:8px;flex-wrap:wrap}
.barcode-panel input{flex:1;min-width:160px;padding:9px 10px;border:1px solid #dadce7;border-radius:6px}
.barcode-panel p{color:#85809b;font-size:11px}
#aiReview[hidden]{display:none}
@media(max-width:1090px){.stepper-row{grid-template-columns:1fr}.stepper-item{min-height:95px}.stepper-item:not(:last-child):after{right:50%;top:auto;bottom:-16px;transform:rotate(90deg)}.overview-methods{grid-template-columns:1fr}.method-picker{grid-template-columns:1fr}}
@media(max-width:720px){.setup-heading{flex-direction:column;align-items:flex-start}.stepper-item{padding:12px}.stepper-body strong{font-size:13px}}

@media(max-width:460px){.scene .stage{transform:translate(-50%,-50%) scale(.52)}}

function field(name,value='',kind='text',options=[]){return `<div class="field"><label>${esc(name)}</label>${kind==='select'?`<select name="${esc(name)}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${esc(name)}">${esc(value)}</textarea>`:`<input name="${esc(name)}" ${kind==='number'?'type="number"':kind==='email'?'type="email"':'type="text"'} value="${esc(value)}" ${['Name','Full name','Role name','Department name','Tax name'].includes(name)?'required':''}>`}</div>`}
const roles=['Cashier','Store manager','Stockroom staff'];
function buildFields(id,preset){switch(id){case 'taxes':return field('Tax name','Default sales tax')+field('Rate','8.25%')+field('Applies to','Most products','select',['Most products','Custom','Selected departments']);case 'roles':return field('Role name',preset||'Cashier')+field('Description','Access for store staff');case 'employees':return field('Full name','Maria Garcia')+field('Email','maria@example.com','email')+field('Role',preset||state.roles[0]?.name,'select',state.roles.map(r=>r.name));case 'schedules':return field('Employee',state.employees[0]?.name,'select',state.employees.map(r=>r.name))+field('Day','Monday','select',['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'])+field('Start','09:00')+field('End','17:00');case 'departments':return field('Department name',preset||'Beverages')+field('Tax','Default sales tax','select',['Default sales tax','No tax']);case 'products':return field('Name',preset==='Barcode'?'Coca-Cola 2 L':preset==='Manual'?'My first product':'Coca-Cola 2 L')+field('Barcode',preset==='Barcode'?'049000000443':'')+field('Price','$2.99')+field('Cost','$1.68')+field('Department',state.records.departments[0]?.name||'Beverages','select',state.records.departments.map(d=>d.name));case 'vendors':return field('Name','Coca-Cola Bottling Co.')+field('Email','orders@example.com','email')+field('Phone','(555) 018-2400');case 'customers':return field('Name','Maria Gonzalez')+field('Email','maria@example.com','email')+field('Phone','(555) 018-4400');case 'promotions':return field('Name',preset?`${preset} · Weekend offer`:'Weekend offer')+field('Type',preset||'Buy X, Get 1 Free','select',['Buy X, Get 1 Free','Buy X, Get a Discount','Tiered Pricing','Discounted Price'])+field('Product',state.records.products[0]?.name||'', 'select',state.records.products.map(p=>p.name));case 'posorders':return field('Product',state.records.products[0]?.name||'', 'select',state.records.products.map(p=>p.name))+field('Quantity','1','number')+field('Payment method','Card','select',['Card','Cash','EBT']);case 'purchaseOrders':return field('Vendor',state.records.vendors[0]?.name||'','select',state.records.vendors.map(r=>r.name))+field('Product',state.records.products[0]?.name||'','select',state.records.products.map(r=>r.name))+field('Quantity','12','number');case 'purchaseReceipts':return field('Source',preset||'Manual','select',['Manual','From PO'])+field('Vendor',state.records.vendors[0]?.name||'','select',state.records.vendors.map(r=>r.name))+field('Received quantity','11','number');case 'purchaseBills':return field('Vendor',state.records.vendors[0]?.name||'','select',state.records.vendors.map(r=>r.name))+field('Source',preset||'Manual','select',['Manual','From receipt'])+field('Amount','$211.80');case 'payments':return field('Bill',state.records.purchaseBills[0]?.name||'','select',state.records.purchaseBills.map(r=>r.name))+field('Amount','$100.00')+field('Method','Cash','select',['Cash','Cheque','Bank Transfer']);case 'quotes':case 'invoices':return field('Customer',state.records.customers[0]?.name||'','select',state.records.customers.map(r=>r.name))+field('Reference',id==='quotes'?'Q-001':'INV-001')+field('Amount','$59.96');case 'invoicePayments':return field('Invoice',state.records.invoices[0]?.name||'','select',state.records.invoices.map(r=>r.name))+field('Amount','$59.96');case 'transfers':return field('Source','Phoenix','select',['Phoenix','Mesa'])+field('Destination','Mesa','select',['Mesa','Phoenix'])+field('Product',state.records.products[0]?.name||'','select',state.records.products.map(r=>r.name));case 'campaigns':return field('Name',preset||'Weekend offer')+field('Channel','Text','select',['Text','Email','Both'])+field('Message','Visit us this weekend!','textarea');case 'rewards':return field('Name',preset||'Store rewards')+field('Earning rule',preset||'Spend','select',['Spend','Visits','Products'])+field('Reward','$5 off at 100 points');case 'segments':return field('Name',preset||'Top spenders')+field('Type','Smart','select',['Smart','Custom','Manual']);case 'giftCards':return field('Name','Store gift cards')+field('Starting amount','$50');case 'locations':return field('Location name','Mesa');case 'communications':return field('Sender email','hello@maplestreet.example','email');case 'hardware':return field('Platform',preset||'Android','select',['Android','Windows'])+field('Model','POS device');default:return field('Name',preset||C[id]?.title||'New record')}}
function form(id,preset=''){
 const titles={taxes:'Set up taxes',roles:'Create role',employees:'Add employee',schedules:'Set a shift',products:preset==='Barcode'?'Scan a barcode with AI':preset==='Manual'?'Create product manually':'Add product',departments:'Create department',promotions:'Create promotion',pricebooks:'Create price book',tags:'Create tag',brands:'Create brand',modifiers:'Create modifier set',vendors:'Add vendor',customers:'Add customer',posorders:'Make a demo sale',quotes:'Create quote',invoices:'Create invoice',invoicePayments:'Record invoice payment',purchaseOrders:'Create purchase order',purchaseReceipts:'Record receipt',purchaseBills:'Record purchase bill',payments:'Record vendor payment',transfers:'Create transfer order',campaigns:'Create campaign',segments:'Create customer segment',giftCards:'Set up gift cards',communications:'Enable messaging',locations:'Add location'};
 const title=titles[id]||'Create record';
 let note='Local design prototype. No production data is changed.';
 if(id==='products'&&preset==='Barcode')note='Scan or type a barcode, then use the AI-assisted suggestion. Review every field before saving.';
 if(state.pending?.id!==id)note+=' Saving this step continues your selected flow.';
 let formMarkup=`<form id="recordForm"><div class="inputrow">${buildFields(id,preset)}</div></form>`;
 let body=`<div class="info">${esc(note)}</div>`;
 if(id==='products'&&preset==='Barcode')body+=`<div class="barcode-panel"><label>Scan or enter a barcode</label><div><input id="barcodeEntry" placeholder="Enter product barcode" value="049000000443" aria-label="Product barcode"><button class="button" data-action="autofill">Look up product</button></div><p id="aiStatus">Suggestions will appear after lookup.</p></div><div id="aiReview" hidden>${formMarkup}</div>`;
 else body+=formMarkup;
 if(id==='roles')body+=`<h3 style="font-size:14px;margin:13px 0 9px">Permissions · Review before saving</h3>${['Back Office','Reports','Register app','OctoYard'].map(s=>`<div class="permgroup"><span>${s}</span><select name="Permission: ${s}"><option>No access</option><option ${preset==='Cashier'||preset==='Store manager'?'selected':''}>Read</option><option ${preset==='Store manager'?'selected':''}>Read & Write</option></select></div>`).join('')}`;
 if(id==='schedules')body='<div class="steps"><span class="step done">1 Role</span><span class="step done">2 Employee</span><span class="step current">3 Schedule</span></div>'+body;
 const saveLabel=id==='taxes'?'Save taxes':id==='roles'?'Save role':id==='employees'?'Add employee':id==='products'?'Add product':'Save';
 const saveButton=btn(saveLabel,'save',id+'|'+preset,'blue');
 const footer=btn('Cancel','close')+(id==='products'&&preset==='Barcode'?saveButton.replace('data-action="save"','id="saveProductBtn" disabled data-action="save"'):saveButton);
 openDialog(title,id==='products'?'Products · '+(preset||'Choose a method'):id==='roles'?'Step 1 · Review role access':'First-use creation flow',body,footer);
}
function start(id,preset=''){
 if(!id||id==='undefined')return;
 // The overview CTA always starts the complete setup, rather than skipping a prerequisite.
 if(id==='productsOverview'){
   state.pending={id:'products',preset:''};state.productChain=true;startPrereq('products');return;
 }
 if(id==='hrOverview'){state.hrChain=true;id=!state.roles.length?'roles':!state.employees.length?'employees':'schedules'}
 if(id==='engagementOverview')id='customers';
 if(id==='purchasingOverview')id=!has('vendors')?'vendors':'purchaseOrders';
 if(id==='mainDashboard'||id==='salesOverview')id='posorders';
 if(id==='reports'){guide('reports');return}
 if(id==='roles'&&(state.page==='employees'||state.page==='hrOverview'||state.page==='schedules'))state.hrChain=true;
 if(id==='employees'&&!roleReady()){state.pending={id:'employees',preset};state.hrChain=true;form('roles',roles.includes(preset)?preset:'Cashier');return}
 if(id==='schedules'){
   if(!roleReady()){state.pending={id:'schedules',preset};state.hrChain=true;form('roles','Cashier');return}
   if(!state.employees.length){state.pending={id:'schedules',preset};state.hrChain=true;form('employees');return}
   if(!state.shiftTracking){state.pending={id:'schedules',preset};openDialog('Turn on Shift Tracking','Required before scheduling',`<div class="info">Enable Shift Tracking for this location to plan shifts.</div>`,btn('Cancel','close')+btn('Enable Shift Tracking','enable','', 'blue'));return}
 }
 if(id==='purchaseReceipts'&&preset==='From PO'&&!has('purchaseOrders')){state.afterCreate={after:'purchaseOrders',id:'purchaseReceipts',preset};start('purchaseOrders');return}
 if(id==='purchaseBills'&&preset==='From receipt'&&!has('purchaseReceipts')){state.afterCreate={after:'purchaseReceipts',id:'purchaseBills',preset};start('purchaseReceipts','Manual');return}
 if(id==='products'&&preset==='Import'){importFlow();return}
 const need=firstNeed(id);
 if(need){state.pending={id,preset};if(need==='taxes'||need==='locations'||need==='communications')form(need);else startPrereq(need);return}
 if(id==='products'&&!preset){methodPicker();return}
 form(id,preset);
}
function startPrereq(id){const deep=firstNeed(id);if(deep){if(deep==='taxes'||deep==='locations'||deep==='communications')form(deep);else startPrereq(deep);return}if(id==='products')methodPicker();else form(id)}
function methodPicker(){
 const body=`<p class="muted" style="margin-bottom:12px">Taxes and departments are ready. Choose how you'd like to add products.</p><div class="method-picker"><button data-action="method" data-target="Barcode"><span class="tile-icon">▦</span><strong>Scan a barcode</strong><small>AI suggests fields for you to review</small></button><button data-action="method" data-target="Manual"><span class="tile-icon">＋</span><strong>Create manually</strong><small>Enter the product details yourself</small></button><button data-action="method" data-target="Import"><span class="tile-icon">▤</span><strong>Import a sheet</strong><small>Bring in a prepared CSV catalog</small></button></div>`;
 openDialog('Add your first product','Products · Choose a creation method',body,btn('Back to catalog','close'));
}
function suggestProduct(){
 const barcode=$('#barcodeEntry')?.value.trim();if(!barcode){toast('Scan or enter a barcode first.');return}
 const name=barcode==='049000000443'?'Coca-Cola 2 L':'Product '+barcode;
 const fld=$('#recordForm');if(!fld)return;
 const set=(field,val)=>{const el=[...fld.elements].find(e=>e.name===field);if(el)el.value=val};
 set('Barcode',barcode);set('Name',name);set('Price',barcode==='049000000443'?'$2.99':'$0.00');set('Cost',barcode==='049000000443'?'$1.68':'$0.00');
 $('#aiReview').hidden=false;$('#saveProductBtn').disabled=false;
 $('#aiStatus').textContent='Suggested fields are ready. Review them before saving.';
}
function importFlow(){const need=firstNeed('products');if(need){state.pending={id:'products',preset:'Import'};startPrereq(need);return}openDialog('Import products from a sheet','Products · Bulk catalog setup',`<div class="info">Choose a CSV file. The prototype can import product names, prices, and departments; nothing is uploaded to a server.</div><div class="field"><label>Choose CSV file</label><input id="csvInput" type="file" accept=".csv,text/csv"></div><div class="info">Or import a small sample catalog to preview the flow.</div>`,btn('Cancel','close')+btn('Import sample catalog','import-sample','','blue')+btn('Import selected CSV','import-csv'))}
function finishNeed(){
 const p=state.pending;if(!p)return;
 const next=p.id==='schedules'&&!state.roles.length?'roles':p.id==='schedules'&&!state.employees.length?'employees':firstNeed(p.id);
 if(next){startPrereq(next);return}
 state.pending=null;
 if(p.id==='employees'&&!state.employees.length){form('employees',p.preset);return}
 if(p.id==='schedules'){start('schedules');return}
 if(p.id==='products'){p.preset==='Import'?importFlow():p.preset?form('products',p.preset):methodPicker();return}
 form(p.id,p.preset);
}
function save(id,preset){
 const formEl=$('#recordForm');if(formEl&&!formEl.reportValidity()){toast('Please complete the required fields.');return}
 let data={};if(formEl)new FormData(formEl).forEach((v,k)=>data[k]=v);
 if(id==='taxes')state.taxes=true;
 else if(id==='locations')state.locations=2;
 else if(id==='communications')state.communications=true;
 else if(id==='roles'){
  let permissions={};document.querySelectorAll('.permgroup select').forEach(sel=>permissions[sel.name]=sel.value);
  state.roles.push({name:data['Role name']||preset||'Cashier',type:'Role',status:'Active',permissions});
 }else if(id==='employees')state.employees.push({name:data['Full name']||'New employee',role:data['Role']||state.roles[0]?.name||'Cashier',status:'Active'});
 else if(id==='schedules')state.shifts.push({name:data['Employee']||'Employee shift',type:data['Day']||'Monday',status:'Scheduled'});
 else{
  if(id==='hardware')state.hardware=true;if(!state.records[id])state.records[id]=[];
  const name=data['Name']||data['Reference']||data['Vendor']||('New '+id);
  state.records[id].push({name,id,type:preset||data['Type']||data['Source']||data['Department']||'Standard',status:id==='posorders'?'Paid':'Active',...data});
 }
 close();toast(`${displayName(id)} saved in the demo.`);
 if(id==='roles'&&state.hrChain){state.pending=null;state.page='employees';form('employees',preset);return}
 if(id==='employees'&&state.hrChain){state.hrChain=false;state.page='schedules';start('schedules');return}
 if(id==='schedules'){state.page='schedules';state.pending=null;render();return}
 if(state.pending&&state.pending.id!==id){finishNeed();return}
 if(state.afterCreate?.after===id){const next=state.afterCreate;state.afterCreate=null;state.pending=null;start(next.id,next.preset);return}
 if(state.productChain){
  if(id==='taxes'){startPrereq('departments');return}
  if(id==='departments'){methodPicker();return}
  if(id==='products'){state.productChain=false;state.pending=null;state.page='productsOverview';render();return}
 }
 if(id==='products'&&state.pending?.id==='products'){state.pending=null;state.page='products';render();return}
 if(C[id])state.page=id;
 state.pending=null;render();
}
function guide(id,startStep=0){id=C[id]?id:state.page;state.guide={id,step:Math.max(0,Math.min(2,Number(startStep)||0))};drawGuide()}
function drawGuide(){
 const g=state.guide,c=C[g.id],f=flowFor(g.id),i=g.step,s=f.steps[i];
 const number=`<div class="guide-numbers">${f.steps.map((a,j)=>`<span class="${i===j?'current':j<i?'done':''}">${j<i?'✓':j+1}</span>`).join('')}</div>`;
 const note=g.id==='purchasingOverview'||g.id==='purchaseBills'||g.id==='payments'?'The actual purchasing workflow is flexible; billing or payment may happen before receiving.':'Sample content is only for preview. Your data changes after you save.';
 const buttons=(i===0?btn('Close','close'):btn('← Back','guide-back'))+btn(i===f.steps.length-1?'Start creating':'Next step →',i===f.steps.length-1?'guide-end':'guide-next','','blue');
 openDialog(f.heading,`Step ${i+1} of ${f.steps.length}`,`${number}<div class="guidebox"><div class="guide-num">0${i+1}</div><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p><div class="guide-helper">${esc(note)}</div></div>`,buttons);
}
function cardClick(i){
 const c=C[state.page],x=state.page==='employees'&&!roleReady()?C.roles.cards[i]:c.cards[i];if(!x)return;
 if(x.kind==='route'){state.page=x.action;render();return}
 if(x.kind==='import'){start('products','Import');return}
 if(x.kind==='create'||x.kind==='preset'){
  if(x.action==='employee')start('employees',x.preset);
  else if(x.action==='role'){state.hrChain=state.page==='employees';form('roles',x.preset)}
  else start(x.action,x.preset);
  return;
 }
 guide(state.page,Math.min(2,i));
}
async function importCSV(){const f=$('#csvInput')?.files?.[0];if(!f){toast('Select a CSV file first.');return}const lines=(await f.text()).trim().split(/\r?\n/);const header=lines.shift().split(',').map(s=>s.toLowerCase().trim());const get=(a,k)=>a[header.indexOf(k)]||'';let n=0;for(const line of lines.slice(0,200)){const a=line.split(',');const name=get(a,'name')||get(a,'product');if(name){state.records.products.push({name,type:'CSV import',price:get(a,'price'),department:get(a,'department'),status:'Active'});n++}}close();state.page='products';state.pending=null;toast(`${n} products imported into local demo.`);render()}
function sampleCatalog(){
 state.records.products.push({name:'Coca-Cola 2 L',price:'$2.99',department:'Beverages',type:'Sheet import',status:'Active'},{name:'Whole Milk',price:'$4.49',department:'Dairy',type:'Sheet import',status:'Active'},{name:'Potato Chips',price:'$3.49',department:'Snacks',type:'Sheet import',status:'Active'});
 close();state.page=state.productChain?'productsOverview':'products';state.productChain=false;state.pending=null;toast('3 sample products imported.');render();
}
function eventAction(act,target='',index=0){switch(act){
 case 'navigate':state.page=target;state.mode='auto';render();return;
 case 'panel':panel();return;
 case 'mode':state.mode=target;render();return;
 case 'reset':reset();return;
 case 'seed':seed();return;
 case 'start':{let [id,preset='']=target.split('|');start(id,preset);return}
 case 'overview-step':{if(state.page==='productsOverview'){start('productsOverview');return}start(target);return}
 case 'flow-step':guide(state.page,Number(index));return;
 case 'card':cardClick(Number(index));return;
 case 'guide':guide(target);return;
 case 'guide-next':state.guide.step=Math.min(2,state.guide.step+1);drawGuide();return;
 case 'guide-back':state.guide.step=Math.max(0,state.guide.step-1);drawGuide();return;
 case 'guide-end':{const id=state.guide.id;close();if(id==='reports'){start('posorders');return}start(id);return}
 case 'method':{const mode=target||'Manual';if(mode==='Import'){importFlow();return}form('products',mode);return}
 case 'autofill':suggestProduct();return;
 case 'close':close();state.productChain=false;state.pending=null;state.hrChain=false;return;
 case 'save':{const [id,preset='']=target.split('|');save(id,preset);return}
 case 'enable':state.shiftTracking=true;close();start('schedules');return;
 case 'import-sample':sampleCatalog();return;
 case 'import-csv':importCSV();return;
 case 'noresults':state.mode='noresults';render();return;
 case 'jump':jump();return;
 }}
function reset(){
 state.roles=[];state.employees=[];state.shifts=[];state.records=Object.fromEntries(Object.keys(C).map(k=>[k,[]]));state.taxes=false;state.shiftTracking=false;state.locations=1;state.communications=false;state.hardware=false;state.pending=null;state.hrChain=false;state.productChain=false;state.afterCreate=null;state.mode='auto';state.page='mainDashboard';$('#panel').classList.remove('open');close();render();toast('Reset to a new store.');
}
function seed(){state.taxes=true;state.roles.push({name:'Cashier',status:'Active'});state.employees.push({name:'Maria Garcia',role:'Cashier',status:'Active'});state.records.departments.push({name:'Beverages',status:'Active'});state.records.products.push({name:'Coca-Cola 2 L',price:'$2.99',status:'Active'});state.records.vendors.push({name:'Coca-Cola Bottling Co.',status:'Active'});state.records.customers.push({name:'Maria Gonzalez',status:'Active'});state.locations=2;state.communications=true;state.mode='auto';render();toast('Sample setup added to local demo.')}
function jump(){let choices=Object.entries(C).map(([id,c])=>`<button class="button" style="justify-content:flex-start;text-align:left" data-action="navigate" data-target="${id}">${esc(G.flatMap(g=>g[3]||[]).find(x=>x[0]===id)?.[1]||c.title)}</button>`).join('');openDialog('Jump to a page','Choose any module to explore',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">${choices}</div>`,btn('Close','close'))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){eventAction(b.dataset.action,b.dataset.target||'',b.dataset.index||'0');return}if(e.target.id==='scrim')close()});$('#mode').addEventListener('change',e=>{state.mode=e.target.value;render()});document.addEventListener('input',e=>{if(e.target.id==='listSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('#rows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();jump()}});render();
})();</script></body></html>
