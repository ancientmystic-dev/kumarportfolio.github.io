function itemNoteHtml(note){return note?`<div class="item-note ${isCriticalNote(note)?'critical':''}">${isCriticalNote(note)?icon('alert','xs'):''}${esc(note)}</div>`:''}
function ticketCard(t){
 const sev=severity(t.createdAt),doneCount=t.items.filter(i=>i.done).length;
 return `<article class="ticket ${sev}${t.recalled?' recalled':''}" data-ticket-card="${t.id}">
 <button type="button" class="ticket-header" data-action="complete-ticket" data-ticket="${t.id}" title="Tap to complete order #${t.id}" aria-label="Complete order ${t.id}. Tap the ticket header to finish the entire order.">
  <span class="ticket-heading"><span class="ticket-num">#${t.id}</span><span class="ticket-type">${esc(t.type)}${t.recalled?`<span class="recalled-badge">Recalled</span>`:''}</span></span>
  <span class="ticket-heading-right"><span class="elapsed ${sev}" data-elapsed="${t.createdAt}">${icon('clock','xs')} ${mm(t.createdAt)}</span><span class="ticket-header-hint" aria-hidden="true">${icon('check','xs')}</span></span>
  <span class="ticket-success" role="status">${icon('checkCircle','lg')} Marked complete</span>
 </button>
 <div class="ticket-items" data-ticket-scroll="${t.id}">${t.items.map(i=>`<button type="button" class="ticket-item ${i.done?'done':''}" data-action="toggle-item" data-ticket="${t.id}" data-item="${esc(i.id)}" title="${i.done?'Mark as not done':'Mark item done'}"><span class="check-circle">${i.done?icon('check','xs'):''}</span><span><span class="item-name">${esc(i.name)}</span>${itemNoteHtml(i.note)}</span></button>`).join('')}</div>
 <div class="ticket-bottom"><div class="ticket-bottom-left">${doneCount===t.items.length?`<div class="all-done">${icon('checkCircle','xs')} All items finished</div>`:''}<span class="ticket-overflow-note">↓ More items below</span></div>${buttonAction('ticket-detail',icon('more','sm'),'ticket-detail-btn',`data-ticket="${t.id}" title="View all order details" aria-label="View details for order ${t.id}"`)}</div>
 </article>`;
}
function renderOrderDetails(){const t=state.activeTickets.find(t=>t.id===state.ticketId)||state.completedTickets.find(t=>t.id===state.ticketId);if(!t)return `<div class="order-detail-screen">${buttonAction('back-to-orders',`${icon('arrowLeft','sm')} Back to orders`,'detail-back')}<div class="empty"><h2>Order not found</h2></div></div>`;const complete=state.completedTickets.some(x=>x.id===t.id);const done=t.items.filter(i=>i.done).length;return `<div class="order-detail-screen"><button class="detail-back" data-action="back-to-orders">${icon('arrowLeft','sm')} Back to ${state.detailOrigin==='completed'?'completed':'active'} orders</button><div class="detail-page-head"><div><div class="detail-eyebrow">ORDER DETAILS</div><h1>Order #${t.id}</h1><p>${esc(t.type)} · ${esc(t.source)}${t.recalled?' · Recalled':''}</p></div><div class="detail-page-actions"><span class="pill ${complete?'good':'neutral'}">${complete?'Completed':'Preparing'}</span>${complete?buttonAction('recall',`${icon('rotate','sm')} Recall order`,'button blue',`data-ticket="${t.id}"`):buttonAction('complete-ticket',`${icon('check','sm')} Mark complete`,'button blue',`data-ticket="${t.id}"`)}</div></div><div class="detail-layout"><section class="detail-items-panel"><div class="detail-section-header"><h2>Items to prepare <span>${t.items.length}</span></h2>${!complete?`<small>${done} of ${t.items.length} checked</small>`:''}</div><div class="detail-item-list">${t.items.map(i=>`<button class="detail-item ${i.done?'done':''}" data-action="toggle-item" data-ticket="${t.id}" data-item="${esc(i.id)}" ${complete?'disabled':''}><span class="check-circle">${i.done?icon('check','xs'):''}</span><span><strong>${esc(i.name)}</strong>${itemNoteHtml(i.note)}</span></button>`).join('')}</div></section><aside class="detail-summary"><h3>Order information</h3><div><span>Status</span><strong>${complete?'Completed':'Preparing'}</strong></div><div><span>Order type</span><strong>${esc(t.type)}</strong></div><div><span>From</span><strong>${esc(t.source)}</strong></div><div><span>Received</span><strong>${formatFullDate(t.createdAt)}</strong></div><div><span>${complete?'Preparation time':'Elapsed time'}</span><strong ${complete?'':`data-elapsed-detail="${t.createdAt}"`}>${complete?durationBetween(t.createdAt,t.completedAt):mm(t.createdAt)}</strong></div>${complete?`<div><span>Completed</span><strong>${formatFullDate(t.completedAt)}</strong></div>`:''}<p class="detail-footnote">${complete?'Use Recall to send this order back to the active kitchen board.':'Tap individual items as they are prepared. The whole order stays active until you mark it complete.'}</p></aside></div></div>`}
function durationBetween(a,b){const s=Math.max(0,Math.round((b-a)/1000)),m=Math.floor(s/60);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m ${String(s%60).padStart(2,'0')}s`}
function renderCompleted(){const q=state.searchOrders.toLowerCase().trim();let list=[...state.completedTickets].sort((a,b)=>b.completedAt-a.completedAt).filter(t=>!q||String(t.id).includes(q)||t.items.some(i=>i.name.toLowerCase().includes(q)));if(state.orderFilter==='today')list=list.filter(t=>new Date(t.completedAt).toDateString()===new Date(now()).toDateString());return `<div class="completed-toolbar"><label class="completed-search">${icon('search','sm')}<input data-input="searchOrders" value="${esc(state.searchOrders)}" placeholder="Search orders" aria-label="Search completed orders" /></label><select class="small-select" data-change="orderFilter" aria-label="Filter completed orders"><option value="all" ${state.orderFilter==='all'?'selected':''}>All completed orders</option><option value="today" ${state.orderFilter==='today'?'selected':''}>Today</option></select></div>${list.length?`<div class="completed-list redesigned-completed">${list.map(t=>`<div class="completed-row"><div class="completed-main"><div style="min-width:0"><div class="completed-name">#${t.id} <span class="completed-status">COMPLETED</span></div><div class="completed-meta">${formatFullDate(t.completedAt)} · ${esc(t.type)}</div></div></div><div class="completed-trailing">${buttonAction('recall',`${icon('rotate','sm')} Recall`,'recall-btn',`data-ticket="${t.id}"`)}${buttonAction('ticket-detail',`${icon('eye','sm')} View`,'completed-view-btn',`data-ticket="${t.id}" aria-label="View order ${t.id}"`)}</div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-illustration">${icon('receipt','xl')}</div><h2>${state.searchOrders?'No orders found':'No completed orders yet'}</h2><p>${state.searchOrders?'Try a different order number or item name.':'Orders you mark complete will appear here, where you can view or recall them.'}</p>${state.searchOrders?buttonAction('clear-search','Clear search','button'):buttonAction('kds-active','Back to active orders','button')}</div>`}`}
function formatFullDate(date){return new Date(date).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})}
function renderPairing(){return `<section class="onboard-shell" aria-label="Activate display">${connectSetupHeader(1)}<main class="onboard-center"><div class="onboard-card">${onboardProgress(1)}<h1>Connect your kitchen display</h1><p>Enter the 12-character activation code from Octopos Back Office. You'll connect your POS in the next step.</p><input class="onboard-code" id="pair-input" data-input="pairCode" aria-label="12-character activation code" type="text" value="${esc(state.pairCode)}" maxlength="14" placeholder="XXXX XXXX XXXX" autocomplete="off" spellcheck="false" aria-invalid="${!!state.pairError}"/>${state.pairError?`<div class="field-error">${esc(state.pairError)}</div>`:''}<div class="onboard-guidance">Find your code in <strong>Back Office → Settings → Terminals → Kitchen displays.</strong></div><div class="onboard-actions">${buttonAction('pair-device',`Activate display ${icon('arrowRight','sm')}`,'button blue full')}</div><div class="onboard-demo-links">${buttonAction('use-demo-code','Use demo activation code','text-button')}${buttonAction('open-bo','Find code in Back Office','text-button')}</div></div></main></section>`}
function posTotals(){const subtotal=state.posCart.reduce((sum,line)=>{const p=products.find(x=>x.id===line.id);return sum+(p?p.price*line.qty:0)},0);const tax=Math.round(subtotal*.075*100)/100;return {subtotal,tax,total:subtotal+tax}}
function renderPos(){
 const filtered=products.filter(p=>(state.posCategory==='all'||p.dept===state.posCategory)&&(!state.searchProducts||p.name.toLowerCase().includes(state.searchProducts.toLowerCase())));
 const ct=posTotals();
 const main=state.posView==='receipt'?renderReceipt():renderPosSale(filtered,ct);
 return `<div class="pos-app"><header class="pos-top"><div class="pos-top-left">${logo()}<div><div class="pos-title">Octopos POS</div><div class="pos-small">Grocery Mart · Register 01</div></div></div><div class="pos-top-right">${buttonAction('pos-routing',`${icon('monitor','sm')} Menu · Add KDS details`,'button medium')}${buttonAction('pos-new',`${icon('plus','sm')} New sale`,'button medium')}</div></header>${main}</div>`;
}
function renderPosSale(filtered,ct){
 const categories=[{id:'all',name:'All items'},...departments.map(d=>({id:d.id,name:d.name}))];
 const productCards=filtered.map(p=>`<button class="product-tile" data-action="add-product" data-product="${p.id}"><div><div class="product-name">${esc(p.name)}</div><div class="product-dept">${esc(departments.find(d=>d.id===p.dept)?.name||'')}</div></div><div class="product-bottom"><span>${money(p.price)}</span><span class="plus-mini">${icon('plus','sm')}</span></div></button>`).join('') || `<div style="grid-column:1/-1;color:#8b96a2;padding:30px 0;font-size:13px">No matching products.</div>`;
 const cartLines=state.posCart.map(line=>{
  const p=products.find(x=>x.id===line.id);
  return `<div class="cart-line"><div><div class="cart-item-name">${esc(p.name)}</div><div class="cart-item-meta">${money(p.price)} each</div><div class="qty-control">${buttonAction('decrease-qty',icon('minus','sm'),'',`data-product="${p.id}" aria-label="Remove one ${esc(p.name)}"`)}<strong>${line.qty}</strong>${buttonAction('increase-qty',icon('plus','sm'),'',`data-product="${p.id}" aria-label="Add one ${esc(p.name)}"`)}</div></div><div class="cart-price">${money(p.price*line.qty)}</div></div>`;
 }).join('');
 let cart;
 if(state.posCart.length){
  cart=`<div class="cart-items">${cartLines}</div><div class="cart-total"><div class="total-row"><span>Subtotal</span><b>${money(ct.subtotal)}</b></div><div class="total-row"><span>Estimated tax (7.5%)</span><b>${money(ct.tax)}</b></div><div class="total-row big"><span>Total</span><span>${money(ct.total)}</span></div>${buttonAction('checkout',`Charge ${money(ct.total)} ${icon('arrowRight','sm')}`,'button dark full')}</div>`;
 }else{
  cart=`<div class="cart-empty">${icon('cart','xl')}<b>No items added</b><span>Choose products to build a sale.<br>Checkout will send eligible prep items to the KDS.</span></div>${buttonAction('checkout','Charge','button dark full','disabled')}`;
 }
 return `<div class="pos-body"><section class="pos-products"><div class="pos-heading"><div><h1>New sale</h1><div class="p" style="margin-top:6px;font-size:12px">Add products, then complete checkout</div></div><div class="pos-search">${icon('search','sm')}<input data-input="searchProducts" value="${esc(state.searchProducts)}" placeholder="Search products" aria-label="Search products" /></div></div><div class="category-row">${categories.map(d=>`<button data-action="pos-category" data-category="${d.id}" class="category-chip ${state.posCategory===d.id?'active':''}">${esc(d.name)}</button>`).join('')}</div><div class="product-grid">${productCards}</div></section><aside class="pos-cart"><div class="cart-header"><h2>Current sale</h2><span class="cart-count">${state.posCart.reduce((v,i)=>v+i.qty,0)} items</span></div>${cart}</aside></div>`;
}
function renderReceipt(){const r=state.posReceipt;if(!r)return `<div class="pos-receipt">No recent sale found. ${buttonAction('pos-new','Start new sale')}</div>`;return `<main class="pos-receipt"><div class="receipt-icon">${icon('check','xl')}</div><h1 class="receipt-title">Payment complete</h1><p class="receipt-desc">Order #${r.id} was paid by ${r.method==='cash'?'cash':'card'}. Your sale has been recorded.</p><div class="receipt-panel"><div class="receipt-row"><span>Order</span><b>#${r.id}</b></div><div class="receipt-row"><span>Items sold</span><b>${r.items.length} product${r.items.length===1?'':'s'}</b></div><div class="receipt-row"><span>Total paid</span><b>${money(r.total)}</b></div><div class="receipt-result ${r.status!=='sent'?'warn':''}">${icon(r.status==='sent'?'checkCircle':'info','lg')}<div>${r.status==='sent'?`<b>Kitchen ticket sent</b><div>${r.kitchenCount} preparation item${r.kitchenCount===1?'':'s'} sent to ${esc(state.stationName)}.</div>`:r.status==='queued'?`<b>Ticket waiting to send</b><div>The kitchen display is disconnected. This ticket will be delivered when it reconnects.</div>`:r.status==='unpaired'?`<b>Kitchen display not connected</b><div>Activate the KDS, then enter its IP address under Menu → Add KDS details on the POS to receive orders.</div>`:`<b>No kitchen ticket required</b><div>None of these items need preparation on the connected KDS.</div>`}</div></div></div><div style="display:flex;gap:10px;flex-wrap:wrap">${buttonAction('pos-new',`${icon('plus','sm')} New sale`,'button dark')}${r.status==='sent'||r.status==='queued'?buttonAction('go-kds',`${icon('monitor','sm')} View KDS`,'button'):buttonAction('pos-routing',`${icon('settings','sm')} Kitchen connection`,'button')}</div></main>`}
function renderBackOffice(){
 const num=state.stations.length,paired=state.stations.filter(s=>s.posConnected).length;
 const kdsNav=buttonAction('bo-kds',`${icon('monitor')} Kitchen displays`,state.boView==='kds'?'bo-link active':'bo-link');

 return `<div class="bo-app"><aside class="bo-sidebar"><div class="bo-brand">${logo()}octopos</div><div class="bo-group-label">STORE SETTINGS</div>${kdsNav}${routingNav}<div class="bo-bottom"><span class="bo-avatar">GM</span><div><div style="font-size:12px;font-weight:720">Grocery Mart</div><div style="font-size:11px;color:#9ca6b1;margin-top:2px">Store admin</div></div></div></aside><main class="bo-main">${state.boView==='kds'?renderBoKds(num,paired):renderBoRouting()}</main></div>`;
}
function renderBoKds(num,paired){return `<div class="bo-breadcrumb">Settings ${icon('chevronRight','xs')} Terminals ${icon('chevronRight','xs')} Kitchen displays</div><div class="bo-main-head"><div><h1>Kitchen displays</h1><p class="bo-main-desc">Connect displays to prepare orders from your POS, without a separate kitchen printer.</p></div>${buttonAction('create-station',`${icon('plus','sm')} Add display`,'button dark')}</div><div class="bo-tip"><span class="tip-icon">${icon('info','lg')}</span><div><div class="bo-tip-title">Connect a display in two simple steps</div><div class="bo-tip-text">Create a display here and activate it in the KDS app. To deliver orders, enter the KDS IP address in your POS under Menu → Add KDS details. Both devices must be on the same local network.</div></div></div><div class="bo-toolbar"><h2>All displays <span style="color:#9aa4af;font-weight:550">(${num})</span></h2><span style="font-size:12px;color:#909aa7">${paired} POS connected</span></div><div class="bo-table"><div class="bo-th"><span>Display</span><span>Location</span><span>Shows items from</span><span>Status</span><span style="text-align:right">Actions</span></div>${state.stations.length?state.stations.map(s=>`<div class="bo-row"><div><div class="bo-device-name">${esc(s.name)}</div><div class="bo-device-sub">${esc(s.code)}</div></div><div class="bo-cell">${esc(s.location)}</div><div class="bo-cell">${esc(s.depts.map(id=>departments.find(d=>d.id===id)?.name||id).join(', ')||'None')}</div><div><span class="pill ${s.posConnected?'good':s.paired?'warn':'neutral'}">${s.posConnected?'POS connected':s.paired?'Waiting for POS':'Not activated'}</span></div><div class="bo-actions">${buttonAction('edit-station',icon('settings','sm'),'button icon-only tiny',`data-id="${s.id}" title="Manage display"`)}${buttonAction('show-station-code',icon('copy','sm'),'button icon-only tiny',`data-id="${s.id}" title="Show activation code"`)}</div></div>`).join(''):`<div class="bo-blank"><div class="empty-illustration">${icon('monitor','xl')}</div><h3>No kitchen displays yet</h3><div class="p">Add your first display to begin setup.</div></div>`}</div><div class="bo-table-note">A device code is generated for each kitchen display. Only preparation-enabled products from the selected departments appear on its tickets.</div><div class="bo-help-grid"><div class="bo-stat">${icon('monitor','lg')}<div class="bo-stat-title">One screen for food prep</div><div class="bo-stat-desc">A compact view of what needs to be made, how long it has been waiting, and what is ready.</div></div><div class="bo-stat">${icon('link','lg')}<div class="bo-stat-title">Connected to your POS</div><div class="bo-stat-desc">After you add the KDS IP address in the POS, eligible preparation tickets arrive when checkout is completed.</div></div></div>`}
function renderBoRouting(){return `<div class="bo-breadcrumb">Settings ${icon('chevronRight','xs')} POS connections</div><div class="bo-main-head"><div><h1>POS connections</h1><p class="bo-main-desc">Check which kitchen displays are connected to the POS at your store.</p></div>${buttonAction('open-pos-setup',`${icon('monitor','sm')} Add KDS details on POS`,'button dark')}</div><div class="bo-tip"><span class="tip-icon">${icon('info','lg')}</span><div><div class="bo-tip-title">Activation and POS connection are separate</div><div class="bo-tip-text">Activate a KDS using its device code, then enter its local IP address in Menu → Add KDS details on the POS. Both devices must share a local network.</div></div></div>${state.stations.map(s=>`<div class="bo-kds-panel"><div style="display:flex;align-items:center;gap:13px">${logo()}<div><h3>${esc(s.name)}</h3><p>${esc(s.location)} · ${esc(s.ip||'IP assigned after activation')}</p></div></div><span class="pill ${s.posConnected?'good':s.paired?'warn':'neutral'}">${s.posConnected?'POS connected':s.paired?'Waiting for POS':'Not activated'}</span></div>`).join('')}<div style="display:flex;gap:10px;margin-top:20px">${buttonAction('open-pos-setup',`${icon('external','sm')} Open POS setup`,'button')}${buttonAction('bo-kds',`${icon('settings','sm')} Manage displays`,'button')}</div></div>`}

on</span><strong>${available?'Activated':'Not activated'}</strong></div><div class="drawer-info">This prototype simulates local-network verification. Enter the IP shown on the KDS to see the connected state on both screens.</div></div><footer class="drawer-foot">${buttonAction('go-kds',`${icon('monitor','sm')} View kitchen display`,'button full')}${buttonAction('close-drawer','Done','button dark full')}</footer>`}

function renderModal(){if(!state.modal)return '';if(state.modal==='settings')return renderSettingsModal();const modal=state.modal;let head='',body='',foot='';if(modal==='checkout'){const total=posTotals().total;head=`<h2>Complete payment</h2><p>Choose a payment method to finish the sale.</p>`;body=`<div class="payment-big-total"><small>Amount due</small><b>${money(total)}</b></div><div class="payment-options">${[['cash','cash','Cash'],['card','credit','Card']].map(([id,ic,title])=>`<button class="payment-option ${state.payment===id?'active':''}" data-action="select-payment" data-payment="${id}">${icon(ic,'lg')}${title}</button>`).join('')}</div><div class="setup-info">${icon('info','sm')} Eligible prepared-food items will create a KDS ticket once the display is activated and connected to this POS.</div>`;foot=`${buttonAction('close-modal','Cancel','button')}${buttonAction('pay-and-send',`${icon('check','sm')} Complete payment`,'button dark')}`}
else if(modal==='create-station'){head=`<h2>Add kitchen display</h2><p>Set up a simple display for a food-prep counter.</p>`;body=`<div class="form-group"><label class="label">DISPLAY NAME</label><input class="field" data-input="stationDraftName" value="${esc(state.stationDraftName)}" placeholder="e.g. Deli counter 2" maxlength="48" /></div><div class="form-group"><label class="label">LOCATION</label><select class="field select" data-change="stationDraftLocation"><option ${state.stationDraftLocation==='Grocery Mart'?'selected':''}>Grocery Mart</option><option ${state.stationDraftLocation==='Downtown Market'?'selected':''}>Downtown Market</option></select></div><div class="form-group"><label class="label">SHOW ITEMS FROM</label><div class="modal-depts">${departments.map(d=>`<button class="modal-dept ${state.stationDraftDepts.includes(d.id)?'selected':''}" data-action="toggle-draft-dept" data-dept="${d.id}">${state.stationDraftDepts.includes(d.id)?icon('check','xs'):icon('plus','xs')} ${esc(d.name)}</button>`).join('')}</div></div>`;foot=`${buttonAction('close-modal','Cancel','button')}${buttonAction('create-station-save','Create display','button dark')}`}
else if(modal==='code-success'){const s=state.stations.find(x=>x.id===state.editStationId);head=`<h2>${esc(s?.name||'Display')} created</h2><p>Enter this code on your kitchen tablet to finish setup.</p>`;body=`<div class="code-box">${esc(s?.code||'')}</div><div style="display:flex;gap:10px">${buttonAction('copy-current-edit-code',`${icon('copy','sm')} Copy code`,'button full',`data-id="${s?.id||''}"`)}</div><div class="setup-info">${icon('info','sm')} Keep this code available until the display has been paired. It is not a staff PIN.</div>`;foot=`${buttonAction('close-modal','Done','button')}${buttonAction('pair-station','Pair this display','button dark',`data-id="${s?.id||''}"`)}`}
else if(modal==='unpair'){head=`<h2>Disconnect this tablet?</h2><p>This tablet will stop receiving kitchen tickets. You can reconnect using its activation code.</p>`;body=`<div class="setup-info">${icon('info','sm')} Your display configuration will remain in Back Office.</div>`;foot=`${buttonAction('close-modal','Cancel','button')}${buttonAction('confirm-unpair','Disconnect tablet','button dark')}`}
else if(modal==='reset'){head=`<h2>Reset prototype?</h2><p>This restores the original sample kitchen orders and all demo settings.</p>`;foot=`${buttonAction('close-modal','Cancel','button')}${buttonAction('confirm-reset','Reset demo','button dark')}`}
else if(modal==='show-code'){const s=state.stations.find(x=>x.id===state.editStationId);head=`<h2>Activation code</h2><p>${esc(s?.name||'Display')} · ${esc(s?.location||'')}</p>`;body=`<div class="code-box">${esc(s?.code||'')}</div><div class="helper">Enter this code on the KDS to link the tablet to this display.</div>`;foot=`${buttonAction('copy-current-edit-code',`${icon('copy','sm')} Copy code`,'button',`data-id="${s?.id||''}"`)}${buttonAction('pair-station','Open KDS setup','button dark',`data-id="${s?.id||''}"`)}`}
return `<div class="modal-backdrop" data-action="close-modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><div>${head}</div>${buttonAction('close-modal',icon('x','sm'),'drawer-x','aria-label="Close dialog"')}</header>${body?`<div class="modal-body">${body}</div>`:''}<footer class="modal-foot">${foot}</footer></section></div>`}
function updateStationFromPair(){const s=activeStation();if(s){state.stationName=s.name;state.location=s.location}}
function generateCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let a='';for(let i=0;i<12;i++)a+=chars[Math.floor(Math.random()*chars.length)];return a.match(/.{4}/g).join(' ')}
function syncPairing(){const active=activeStation();if(active){active.paired=true;state.stationName=active.name;state.location=active.location;active.depts=[...state.selectedDepts]}}
function sendSample(){if(!state.paired||!state.posConnected){state.route='kds';state.drawer=null;state.modal=null;showToast('Connect the KDS to your POS first.');return}let ticket={id:state.nextOrderNo++,type:'Pickup',createdAt:now(),source:'POS 01',items:[{id:'s'+Date.now()+'a',name:'2 × Chicken sandwich',note:'No pickles',done:false},{id:'s'+Date.now()+'b',name:'1 × French fries',note:'',done:false}]};if(state.offline){state.pendingTickets.push(ticket);showToast('Kitchen is offline. Test ticket queued until reconnect.')}else{state.activeTickets.push(ticket);state.page=Math.floor((state.activeTickets.length-1)/state.layout);beep();showToast('New deli order received.')}state.kdsView='active';render()}

function sendScenarioTicket(kind){if(!state.paired||!state.posConnected){state.drawer=null;state.route='kds';showToast('Connect the POS before sending test tickets.');return}

 const id=state.nextOrderNo++;
 const catalog=['Chicken sandwich','Turkey panini','French fries','Grilled cheese','Veg sandwich','Samosa','Croissant','Pizza slice','Deli wrap','Mozzarella toastie','Potato wedges','Bagel','Soup','Fresh roll','Mini quiche'];
 const items=kind==='long'?catalog.map((name,i)=>({id:`${id}-${i}`,name:`${i%3===0?2:1} × ${name}`,note:i===2?'No salt':i===8?'Extra toasted':'',done:false})):[{id:`${id}-a`,name:'2 × Turkey panini',note:'Peanut allergy — use clean utensils',done:false},{id:`${id}-b`,name:'1 × French fries',note:'No salt',done:false}];
 const ticket={id,type:'Pickup',createdAt:now(),source:'POS 01',items};
 if(state.offline){state.pendingTickets.push(ticket);showToast('Display is offline. Ticket queued until reconnection.')}else{state.activeTickets.push(ticket);beep();showToast(kind==='long'?'Long ticket received. Scroll inside the card to see every item.':'Allergy ticket received. Critical instructions are highlighted.')}
 state.drawer=null;state.route='kds';state.kdsView='active';
 const ordered=[...state.activeTickets].sort((a,b)=>a.createdAt-b.createdAt);
 state.page=Math.floor(ordered.findIndex(t=>t.id===id)/state.layout);
 render();
}
function reconnect(){if(!state.posConnected){state.modal='settings';state.settingsTab='device';render();return}state.offline=false;if(state.pendingTickets.length){const n=state.pendingTickets.length;state.activeTickets.push(...state.pendingTickets);state.pendingTickets=[];state.page=Math.max(0,Math.ceil(state.activeTickets.length/state.layout)-1);showToast(`${n} waiting ${n===1?'ticket':'tickets'} delivered to the kitchen.`);beep()}else showToast('Kitchen display connected.');render()}

const ticketsCompleting=new Set();
function animateTicketComplete(id,sourceEl){
 if(ticketsCompleting.has(id)||!state.activeTickets.some(t=>t.id===id))return;
 const card=sourceEl?.closest?.('.ticket');
 if(!card){completeTicket(id);return}
 ticketsCompleting.add(id);
 card.classList.add('is-confirmed');
 const reduceMotion=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
 const hold=reduceMotion?180:500;
 setTimeout(()=>{if(card.isConnected)card.classList.add('is-leaving')},hold);
 setTimeout(()=>{
  const previousRects=new Map([...root.querySelectorAll('[data-ticket-card]')].map(el=>[el.dataset.ticketCard,el.getBoundingClientRect()]));
  completeTicket(id);
  ticketsCompleting.delete(id);
  if(!reduceMotion&&state.route==='kds'&&state.kdsView==='active'){
   for(const el of root.querySelectorAll('[data-ticket-card]')){
    const before=previousRects.get(el.dataset.ticketCard);
    if(!before)continue;
    const after=el.getBoundingClientRect(),dx=before.left-after.left,dy=before.top-after.top;
    if(Math.abs(dx)>1||Math.abs(dy)>1){
     el.animate([{transform:`translate(${dx}px, ${dy}px)`},{transform:'translate(0,0)'}],{duration:360,easing:'cubic-bezier(.2,.75,.25,1)'})
    }
   }
  }
 },hold+(reduceMotion?0:390));
}

function completeTicket(id){const index=state.activeTickets.findIndex(t=>t.id===id);if(index===-1)return;let t=state.activeTickets.splice(index,1)[0];undoPayload={type:'complete',ticket:JSON.parse(JSON.stringify(t))};state.completedTickets.unshift({...t,items:t.items.map(i=>({...i,done:true})),completedAt:now()});state.drawer=null;showToast(`Order #${id} marked complete.`,'Undo','undo-ready')}
function undoReady(){if(!undoPayload||undoPayload.type!=='complete')return;let t=undoPayload.ticket;state.completedTickets=state.completedTickets.filter(c=>c.id!==t.id);state.activeTickets.push(t);state.kdsView='active';state.page=Math.floor((state.activeTickets.length-1)/state.layout);undoPayload=null;showToast(`Order #${t.id} moved back to active orders.`)}
function recallTicket(id){const index=state.completedTickets.findIndex(t=>t.id===id);if(index<0)return;let t=state.completedTickets.splice(index,1)[0];const items=t.items.map(i=>({...i,done:false}));state.activeTickets.push({...t,createdAt:now(),completedAt:undefined,recalled:true,items});state.kdsView='active';state.page=Math.max(0,Math.ceil(state.activeTickets.length/state.layout)-1);state.drawer=null;showToast(`Order #${id} returned to active orders.`)}
function pay(){const lines=[...state.posCart];if(!lines.length)return;const ct=posTotals(),id=state.nextOrderNo++;const kitchenItems=lines.map(line=>({line,p:products.find(p=>p.id===line.id)})).filter(x=>x.p?.kitchen&&state.selectedDepts.includes(x.p.dept));let status='none';if((!state.paired||!state.posConnected)&&kitchenItems.length)status='unpaired';else if(kitchenItems.length){const ticket={id,type:'Pickup',createdAt:now(),source:'POS 01',items:kitchenItems.map(({line,p})=>({id:`${id}-${p.id}`,name:`${line.qty} × ${p.name}`,note:'',done:false}))};if(state.offline){state.pendingTickets.push(ticket);status='queued'}else{state.activeTickets.push(ticket);beep();status='sent'}}state.posReceipt={id,method:state.payment,total:ct.total,kitchenCount:kitchenItems.length,status,items:lines};state.posCart=[];state.modal=null;state.posView='receipt';render()}
function setRoute(route){state.route=route;state.drawer=null;state.modal=null;state.toast=null;render()}
function unpair(){const s=activeStation();if(s){s.paired=false;s.posConnected=false}state.paired=false;state.posConnected=false;state.posIpInput='';state.posIpError='';state.onboarding=false;state.connectionSuccess=false;state.setupStep=1;state.testReceived=false;state.pairCode='';state.pairError='';state.drawer=null;state.modal=null;state.route='kds';render()}
function toggleDept(dept,arrName){const ids=state[arrName];if(ids.includes(dept)){if(ids.length===1){showToast('Keep at least one department selected.');return}state[arrName]=ids.filter(d=>d!==dept)}else state[arrName]=[...ids,dept];if(arrName==='selectedDepts'){const s=activeStation();if(s)s.depts=[...state.selectedDepts]}render()}
function clipboardWrite(text,label='Activation code'){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast(label+' copied.')).catch(()=>fallbackCopy(text,label))}else fallbackCopy(text,label)}
function fallbackCopy(text,label='Activation code'){const inp=document.createElement('textarea');inp.value=text;document.body.appendChild(inp);inp.select();let copied=false;try{copied=document.execCommand('copy')}catch(_){}inp.remove();showToast(copied?label+' copied.':`${label}: ${text}`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=Number(b.dataset.ticket),prod=b.dataset.product,dept=b.dataset.dept;if(action==='close-modal-backdrop'&&e.target!==b)return;e.preventDefault();switch(action){
case 'nav':setRoute(b.dataset.route);break;
case 'go-kds':state.kdsView='active';setRoute('kds');break;
case 'open-bo':state.boView='kds';setRoute('backoffice');break;
case 'bo-kds':state.boView='kds';setRoute('backoffice');break;
case 'bo-pos-routing':state.boView='routing';setRoute('backoffice');break;
case 'go-pos':state.posView='sell';setRoute('pos');break;
case 'toggle-immersive':immersive=!immersive;render();break;
case 'scenarios':state.drawer='scenarios';state.modal=null;render();break;
case 'help':state.drawer='help';render();break;
case 'settings':openSettings();break;
case 'cancel-settings':cancelSettings();break;
case 'apply-settings':applySettings();break;
case 'view-connection':case 'show-pos-onboarding':state.drawer=null;state.modal=null;state.onboarding=true;state.route='kds';render();break;
case 'skip-pos-onboarding':state.onboarding=false;state.route='kds';render();break;
case 'finish-pos-onboarding':if(!state.selectedDepts.length){showToast('Choose at least one department.');break}state.onboarding=false;state.connectionSuccess=true;state.kdsView='active';state.route='kds';state.drawer=null;syncPairing();render();break;
case 'toggle-onboarding-dept':toggleDept(dept,'selectedDepts');break;
case 'open-pos-setup':state.posView='sell';state.route='pos';state.drawer='pos-routing';state.modal=null;render();break;
case 'check-pos-connection':if(state.posConnected&&!state.offline)showToast('Connected to Grocery Mart · POS 01.');else showToast('Still waiting for POS. Enter this IP address in POS → Menu → Add KDS details.');break;
case 'copy-ip':clipboardWrite(kdsIp(),'IP address');break;
case 'dismiss-connected-success':state.connectionSuccess=false;render();break;
case 'save-pos-ip':{const input=state.posIpInput.trim();const octets=input.split('.');const valid=octets.length===4&&octets.every(x=>/^\d{1,3}$/.test(x)&&Number(x)<=255);if(!valid){state.posIpError='Enter a valid IPv4 address, such as 192.168.1.105.';render();break}if(!state.paired){state.posIpError='Activate your kitchen display using the device code first.';render();break}if(input!==kdsIp()){state.posConnected=false;const st=activeStation();if(st)st.posConnected=false;state.posIpError='Unable to reach this display. Check the IP address and make sure both devices are on the same local network.';render();break}state.posConnected=true;const st=activeStation();if(st)st.posConnected=true;state.offline=false;state.posIpError='';state.connectionSuccess=!state.onboarding;render();showToast('POS connected to '+state.stationName+'.');break}
case 'settings-tab':state.settingsTab=b.dataset.tab;render();break;
case 'kds-tab':state.kdsView=b.dataset.view;state.drawer=null;render();break;
case 'kds-active':state.kdsView='active';render();break;
case 'ticket-detail':state.ticketId=id;if(state.kdsView==='completed'){state.detailOrigin='completed';state.drawer='ticket'}else{state.detailOrigin='active';state.kdsView='detail';state.drawer=null}render();break;
case 'back-to-orders':state.kdsView=state.detailOrigin||'active';render();break;
case 'toggle-item':{let ticket=state.activeTickets.find(t=>t.id===id);if(!ticket)return;let item=ticket.items.find(i=>i.id===b.dataset.item);if(item)item.done=!item.done;render();break}
case 'complete-ticket':if(b.closest('.ticket-header'))animateTicketComplete(id,b);else{state.kdsView='active';completeTicket(id)}break;
case 'recall':recallTicket(id);break;
case 'undo-ready':undoReady();break;
case 'previous-page':state.page=Math.max(0,state.page-1);render();break;
case 'next-page':state.page++;render();break;
case 'clear-search':state.searchOrders='';render();break;
case 'close-drawer':state.drawer=null;render();break;
case 'close-modal':case 'close-modal-backdrop':if(state.modal==='settings'){cancelSettings();break}if(state.modal==='unpair'&&state.returnToSettings){state.modal='settings';state.returnToSettings=false}else{state.modal=null;state.returnToSettings=false}render();break;
case 'pair-device':{const normal=state.pairCode.replace(/\s/g,'').toUpperCase();const s=state.stations.find(st=>st.code.replace(/\s/g,'').toUpperCase()===normal);if(!s){state.pairError='That code does not match any kitchen display. Check Back Office and try again.';render();return}state.selectedStationId=s.id;state.selectedDepts=[...s.depts];state.stationName=s.name;state.location=s.location;state.pairError='';state.paired=true;s.paired=true;s.posConnected=false;state.posConnected=false;state.posIpInput='';state.posIpError='';state.onboarding=true;state.setupStep=2;state.connectionSuccess=false;state.activeTickets=[];state.completedTickets=[];state.pendingTickets=[];state.page=0;state.kdsView='active';state.modal=null;state.drawer=null;state.route='kds';render();break}
case 'use-demo-code':state.pairCode=activeStation()?.code||state.stations[0]?.code||'';state.pairError='';render();break;
case 'toggle-dept':{if(state.modal==='settings'&&settingsDraft){const ids=settingsDraft.selectedDepts;if(ids.includes(dept)){if(ids.length===1){showToast('Select at least one department.');break}settingsDraft.selectedDepts=ids.filter(x=>x!==dept)}else settingsDraft.selectedDepts=[...ids,dept];render()}else toggleDept(dept,'selectedDepts');break}
case 'setup-next':if(state.selectedDepts.length){state.setupStep=3;render()}else showToast('Select at least one department.');break;
case 'setup-back':state.setupStep=Math.max(1,state.setupStep-1);render();break;
case 'send-test':state.testReceived=true;beep();render();break;
case 'finish-setup':if(!state.testReceived)return;state.paired=true;syncPairing();state.setupStep=1;state.testReceived=false;state.kdsView='active';state.page=0;render();showToast(`${state.stationName} connected. Ready for orders.`);break;
case 'send-sample':state.drawer=null;state.route='kds';sendSample();break;
case 'send-long-ticket':sendScenarioTicket('long');break;
case 'send-allergy-ticket':sendScenarioTicket('allergy');break;
case 'advance-time':state.offsetMin+=5;state.drawer=null;render();showToast('Kitchen clock advanced by five minutes.');break;
case 'disconnect':state.drawer=null;if(!state.posConnected){showToast('Connect the POS first to simulate a disconnection.')}else if(state.offline)reconnect();else{state.offline=true;render();showToast('Connection interrupted. New tickets will be queued.')}break;
case 'reconnect':reconnect();break;
case 'change-ip':{const st=activeStation();if(st){const octets=kdsIp().split('.');octets[3]=String(Number(octets[3])===108?105:108);st.ip=octets.join('.');st.posConnected=false}state.posConnected=false;state.connectionSuccess=false;state.onboarding=true;state.offline=false;state.drawer=null;state.kdsView='active';state.route='kds';render();showToast('KDS IP changed. Update the IP address in your POS.');break}
case 'clear-active':state.activeTickets=[];state.page=0;state.kdsView='active';state.route='kds';state.drawer=null;render();break;
case 'try-setup':{const s=activeStation();if(s)s.paired=false;state.paired=false;state.posConnected=false;state.posIpInput='';state.posIpError='';state.connectionSuccess=false;state.onboarding=false;state.setupStep=1;state.testReceived=false;state.pairCode='';state.pairError='';state.activeTickets=[];state.completedTickets=[];state.page=0;state.drawer=null;state.route='kds';render();break}
case 'reset-all':state.drawer=null;state.modal='reset';render();break;
case 'confirm-reset':state=initial();undoPayload=null;try{localStorage.removeItem(STORAGE)}catch(_){}render();showToast('Demo restored to the starting state.');break;
case 'set-layout':if(settingsDraft)settingsDraft.layout=Number(b.dataset.layout);else {state.layout=Number(b.dataset.layout);state.page=0}render();break;
case 'toggle-sound':if(settingsDraft)settingsDraft.sound=!settingsDraft.sound;else state.sound=!state.sound;render();break;
case 'toggle-kds-sync-out':{const d=settingsDraft||state;d.pushCompletionToOtherKds=!d.pushCompletionToOtherKds;render();break}
case 'toggle-kds-sync-in':{const d=settingsDraft||state;d.syncCompletionFromOtherKds=!d.syncCompletionFromOtherKds;render();break}
case 'test-sound':beep();break;
case 'warn-minus':{const d=settingsDraft||state;d.warnMins=Math.max(1,d.warnMins-1);if(d.overdueMins<=d.warnMins)d.overdueMins=d.warnMins+1;render();break}
case 'warn-plus':{const d=settingsDraft||state;d.warnMins=Math.min(60,d.warnMins+1);if(d.overdueMins<=d.warnMins)d.overdueMins=d.warnMins+1;render();break}
case 'overdue-minus':{const d=settingsDraft||state;d.overdueMins=Math.max(d.warnMins+1,d.overdueMins-1);render();break}
case 'overdue-plus':{const d=settingsDraft||state;d.overdueMins=Math.min(120,d.overdueMins+1);render();break}
case 'copy-current-code':clipboardWrite(activeStation()?.code||'');break;
case 'copy-current-edit-code':{const s=state.stations.find(x=>x.id===b.dataset.id);clipboardWrite(s?.code||'');break}
case 'unpair-confirm':state.returnToSettings=true;state.modal='unpair';render();break;
case 'confirm-unpair':unpair();showToast('Tablet disconnected. Re-enter your activation code to reconnect.');break;
case 'pos-category':state.posCategory=b.dataset.category;render();break;
case 'add-product':case 'increase-qty':{const line=state.posCart.find(i=>i.id===prod);if(line)line.qty++;else state.posCart.push({id:prod,qty:1});render();break}
case 'decrease-qty':{let line=state.posCart.find(i=>i.id===prod);if(line){line.qty--;if(line.qty<=0)state.posCart=state.posCart.filter(i=>i.id!==prod)}render();break}
case 'pos-new':state.posCart=[];state.posReceipt=null;state.posView='sell';state.searchProducts='';state.posCategory='all';state.modal=null;render();break;
case 'checkout':if(state.posCart.length){state.payment='cash';state.modal='checkout';render()}break;
case 'select-payment':state.payment=b.dataset.payment;render();break;
case 'pay-and-send':pay();break;
case 'pos-routing':state.drawer='pos-routing';state.posIpError='';render();break;
case 'create-station':state.stationDraftName='';state.stationDraftLocation='Grocery Mart';state.stationDraftDepts=['deli','hot'];state.modal='create-station';render();break;
case 'toggle-draft-dept':toggleDept(dept,'stationDraftDepts');break;
case 'create-station-save':{const name=state.stationDraftName.trim();if(!name){showToast('Enter a name for your kitchen display.');return}if(!state.stationDraftDepts.length){showToast('Choose at least one department.');return}const newId=`kds-${state.stations.length+1}`;const s={id:newId,name,code:generateCode(),location:state.stationDraftLocation,depts:[...state.stationDraftDepts],paired:false,posConnected:false,ip:'192.168.1.'+(105+state.stations.length)};state.stations.push(s);state.editStationId=newId;state.modal='code-success';render();break}
case 'edit-station':{const s=state.stations.find(x=>x.id===b.dataset.id);if(!s)return;state.editStationId=s.id;state.editDraftName=s.name;state.editDraftDepts=[...s.depts];state.drawer='station';render();break}
case 'toggle-edit-dept':toggleDept(dept,'editDraftDepts');break;
case 'save-station':{const s=state.stations.find(x=>x.id===state.editStationId);if(!s)return;if(!state.editDraftName.trim()){showToast('Display name cannot be empty.');return}s.name=state.editDraftName.trim();s.depts=[...state.editDraftDepts];if(s.id===state.selectedStationId){state.stationName=s.name;state.selectedDepts=[...s.depts]}state.drawer=null;render();showToast('Display settings updated.');break}
case 'show-station-code':state.editStationId=b.dataset.id;state.modal='show-code';render();break;
case 'pair-station':{const s=state.stations.find(x=>x.id===b.dataset.id);if(!s)return;state.selectedStationId=s.id;state.stationName=s.name;state.location=s.location;state.paired=false;state.posConnected=false;state.posIpInput='';state.posIpError='';state.connectionSuccess=false;state.onboarding=false;s.paired=false;s.posConnected=false;state.setupStep=1;state.testReceived=false;state.pairCode=s.code;state.pairError='';state.drawer=null;state.modal=null;state.route='kds';render();break}
default:break;
}});
document.addEventListener('scroll',e=>{if(e.target?.classList?.contains('ticket-items')){const card=e.target.closest('.ticket');if(card)card.classList.toggle('at-bottom',e.target.scrollTop+e.target.clientHeight>=e.target.scrollHeight-5)}},true);
document.addEventListener('input',e=>{const k=e.target.dataset?.input;if(!k)return;let value=e.target.value;if(k==='pairCode'){value=value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);const formatted=value.match(/.{1,4}/g)?.join(' ')||'';state.pairCode=formatted;state.pairError='';e.target.value=formatted;return}if(k==='posIpInput'){state.posIpInput=value;state.posIpError='';save();return}if(['stationDraftName','editDraftName','searchOrders','searchProducts'].includes(k)){state[k]=value;if(k.startsWith('search'))render();else save()}});
document.addEventListener('change',e=>{const k=e.target.dataset?.change;if(!k)return;state[k]=e.target.value;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){if(state.modal==='settings'){settingsDraft=null}if(state.modal==='unpair'&&state.returnToSettings){state.modal='settings';state.returnToSettings=false}else{state.modal=null;state.returnToSettings=false}}else if(state.drawer)state.drawer=null;else if(immersive)immersive=false;else return;render()}else if(e.key==='Enter'&&e.target.dataset?.input==='pairCode'){e.preventDefault();document.querySelector('[data-action="pair-device"]')?.click()}});
setInterval(()=>{
 if(state.route!=='kds'||!state.paired)return;
 document.querySelectorAll('.live-clock').forEach(el=>el.textContent=formatTime(now()));
 document.querySelectorAll('[data-elapsed]').forEach(el=>{
  const date=Number(el.dataset.elapsed),sv=severity(date);
  el.innerHTML=icon('clock','xs')+' '+mm(date);
  el.classList.remove('warn','danger');if(sv!=='normal')el.classList.add(sv);
  const card=el.closest('.ticket');if(card){card.classList.remove('warn','danger');if(sv!=='normal')card.classList.add(sv)}
 });
 document.querySelectorAll('[data-elapsed-detail]').forEach(el=>el.textContent=mm(Number(el.dataset.elapsedDetail)));
},1000);
render();
})();
</script>
</body>
</html>
